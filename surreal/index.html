// ---- a staircase of televisions, each showing the sun ----
{ id: "tvs", speed: 1, amb: { noise: 0.06, nf: 5000, drone: 0.15 },
  init(s) { s.n = 7; s.static = (Math.random() * 7) | 0; s.ch = {}; s.rects = []; },
  draw(s, t) {
    bg();
    const n = s.n, port = H > W, tw = Math.min(W, H) * (port ? 0.2 : 0.17);
    s.rects = [];
    const loop = (t * 0.4) % 1;                            // they loop, and the loop is wrong
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1), x = lerp(W * 0.12, W * 0.88 - tw, u) + E.lx * (0.3 + u * 0.4), y = lerp(H * 0.82, H * 0.08, u) - tw * 0.4;
      line(x - tw * 0.1, y + tw * 0.86, x + tw * 1.1, y + tw * 0.86, C.r2, 2);           // the step
      line(x + tw * 1.1, y + tw * 0.86, x + tw * 1.1, y + tw * 0.86 - (H * 0.74) / (n - 1), C.r2, 2);
      rrect(x, y, tw, tw * 0.8, tw * 0.08); g.fillStyle = "#000"; g.fill(); g.strokeStyle = C.b; g.lineWidth = 2; g.stroke();
      const sx = x + tw * 0.08, sy = y + tw * 0.08, sw = tw * 0.68, sh = tw * 0.62;
      line(x + tw * 0.4, y, x + tw * 0.25, y - tw * 0.25, C.b, 1); line(x + tw * 0.4, y, x + tw * 0.6, y - tw * 0.22, C.b, 1);
      g.beginPath(); g.arc(x + tw * 0.88, y + tw * 0.25, tw * 0.05, 0, 7); g.stroke();
      g.save(); g.beginPath(); g.rect(sx, sy, sw, sh); g.clip();
      g.fillStyle = C.b3; g.fillRect(sx, sy, sw, sh);
      const ch = s.ch[i];
      if (i === s.static || (ch && t < ch.until && ch.kind === "static")) fillPat("static", Math.random() * 64, Math.random() * 64, sx, sy, sw, sh);
      else if (ch && t < ch.until) olText(ch.text, sx + sw / 2, sy + sh / 2, sh * 0.2, { maxW: sw * 0.9 });
      else { const ph = (loop + i * 0.13) % 1; sun(sx + sw * (0.2 + 0.6 * ph), sy + sh * (0.75 - 0.5 * Math.sin(ph * Math.PI)), sh * 0.2, i % 3 ? "disc" : "wire"); }

  tap(s, x, y, t) {

    }
    return false;
  } },

// ---- telephones hanging from the wires, ringing. pick one up ----
{ id: "phones", speed: 0.85, amb: { hum: 0.18 },
  init(s) { s.phones = Array.from({ length: 5 }, (_, i) => ({ u: (i + 0.5) / 5 + rnd(-0.04, 0.04), w: i % 3, len: rnd(0.12, 0.3), ring: Math.random() < 0.6, up: 0, ph: Math.random() * 6 })); s.next = 0.5; s.said = ""; s.saidT = -9; },
  draw(s, t) {

    if (t > s.next) { s.next = t + rnd(1.5, 3.5); const p = pick(s.phones); if (!p.up) { p.ring = true; } }

      const sw = Math.sin(t * 1.3 + p.ph) * 0.12, len = p.len * H, ringing = p.ring && !p.up && Math.sin(t * 20) > 0 && (t * 1.2 + p.ph) % 2 < 1.2;
      if (ringing) anyRing = true;

      g.stroke();
      const sz = S * 0.055;
      rrect(x - sz, y, sz * 2, sz * 1.1, sz * 0.25); g.fillStyle = "#000"; g.fill(); g.strokeStyle = C.r; g.lineWidth = 2; g.stroke();
      g.beginPath(); g.arc(x, y + sz * 0.6, sz * 0.32, 0, 7); g.strokeStyle = C.b; g.stroke();
      const hu = p.up ? sz * 1.4 : 0;
      g.lineWidth = sz * 0.28; g.strokeStyle = C.r; g.lineCap = "round"; g.beginPath(); g.moveTo(x - sz * 0.9, y - sz * 0.1 - hu); g.lineTo(x + sz * 0.9, y - sz * 0.1 - hu); g.stroke(); g.lineCap = "butt";
      if (ringing) plain("RING", x, y - sz * 0.7, Math.max(9, S * 0.022), C.r2);

      p.up = 1; p.ring = false; s.said = "“" + pick(FATHER) + "”"; s.saidT = t;

// ---- rain falling upward, ads printed on the drops ----
{ id: "uprain", speed: 1.1, amb: { noise: 0.22, nf: 1400, drone: 0.1 },

// ---- your reflection, flying beside you, slightly late ----
{ id: "mirror", speed: 0.7, amb: {},

// ---- a parking lot that never ends; every space is a truth number ----
{ id: "lot", speed: 1.2, amb: { hum: 0.2, drone: 0.15 },
  init(s) { s.z = 0; s.labels = []; },
  draw(s, t, dt) {
    bg();
    const hy = H * 0.36 + E.ly, f = S * 0.9, cam = 1.6;
    sun(CX + E.lx * 0.15, hy, S * 0.4, "disc");
    g.fillStyle = "#000"; g.fillRect(0, hy, W, H - hy); line(0, hy, W, hy, C.r, 2);
    s.z += dt * (3 + 6 * E.h);
    const P = (x, z) => [CX + E.lx + (x * f) / z, hy + (cam * f) / z];
    const d = truthsData || FALLBACK, nums = [...d.truths.map((_, i) => String(i + 1).padStart(2, "0")), ...d.deep.map((_, i) => "D" + (i + 1))];
    s.labels = [];
    g.strokeStyle = C.r2; g.lineWidth = 1.5; g.textAlign = "center"; g.textBaseline = "middle";
    for (let row = 30; row >= 0; row--) {
      const zr = row * 5.5 - (s.z % 5.5) + 1.2;
      if (zr < 0.8) continue;
      const ri = row + Math.floor(s.z / 5.5);
      for (let col = -6; col <= 6; col++) {
        const x = col * 2.7, a = P(x, zr), b = P(x, zr + 4.5);
        g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
        if (col < 6) {
          const c = P(x + 1.35, zr + 1.3), sz = (0.7 * f) / zr;
          if (sz > 5 && c[0] > -20 && c[0] < W + 20) {
            const num = nums[(((ri * 13 + col * 7) % nums.length) + nums.length) % nums.length];
            g.font = `italic 700 ${sz}px ${SF}`; g.fillStyle = zr < 12 ? C.r : C.r2; g.fillText(num, c[0], c[1]);
            if (sz > 12) s.labels.push([c[0], c[1], sz, num]);
          }
        }
      }
      const l1 = P(-16.2, zr), l2 = P(16.2, zr); g.beginPath(); g.moveTo(l1[0], l1[1]); g.lineTo(l2[0], l2[1]); g.stroke();
      if (row % 3 === 0) { const lp = P(row % 2 ? -9 : 9, zr), lt = [lp[0], lp[1] - (4.5 * f) / zr]; line(lp[0], lp[1], lt[0], lt[1], C.b, 1.5); g.beginPath(); g.arc(lt[0], lt[1], (0.5 * f) / zr, 0, 7); g.strokeStyle = C.r2; g.stroke(); g.lineWidth = 1.5; }
    }
  },
  tap(s, x, y) {
    let best = null, bd = Infinity;
    for (const l of s.labels) { const dd = Math.hypot(x - l[0], y - l[1]); if (dd < l[2] * 1.5 && dd < bd) { bd = dd; best = l; } }
    if (!best) return false;
    const d = truthsData || FALLBACK, ever = loadSeen().ever, isD = best[3][0] === "D";
    const tr = isD ? d.deep[+best[3].slice(1) - 1] : d.truths[+best[3] - 1];
    pops.push({ x, y, text: tr && ever.includes(tr.id) ? tr.text : "████████", t0: performance.now() });
    blip(); return true;
  } },

// ============================================================
// The flight: scenes cut like links
// ============================================================
let mode = "start";            // start | fly | secret | melt | fall | oracle
let h = 0, hv = 0, melt = 0, flight = null, cur = null, prevSnap = null, sceneIdx = -1, lowT = 0, phaseT = 0;
let pops = [], drips = [], spin = null, cutFx = null, hold = 0, secretBack = null;
let lastT = performance.now();

function newFlight() {
  const order = shuffle(SCENES.slice()).slice(0, NS);
  flight = { scenes: order.map(def => ({ def, s: {}, inited: false })), snaps: [], visited: [], secret: false, melted: false, start: performance.now() };
  flight.scenes[1 + ((Math.random() * (NS - 2)) | 0)].secret = { fx: rnd(0.15, 0.85), fy: rnd(0.2, 0.8) };
  h = 0; hv = 0; melt = 0; E.melt = 0; lowT = 0; sceneIdx = -1; pops = []; drips = []; spin = null; prevSnap = null; hold = 0; cutFx = null;
  cutTo(0, true);
}
function snapshot() {
  const c = document.createElement("canvas");
  c.width = Math.max(1, cv.width >> 1); c.height = Math.max(1, cv.height >> 1);
  try { c.getContext("2d").drawImage(cv, 0, 0, c.width, c.height); } catch (e) { /* nothing to copy yet */ }
  return c;
}
function cutTo(idx, first = false) {
  if (!first && cur) { const sn = snapshot(); prevSnap = { c: sn, t0: performance.now() }; flight.snaps.push(sn); if (flight.snaps.length > 12) flight.snaps.shift(); }
  sceneIdx = idx;
  cur = flight.scenes[idx];
  if (!cur.inited) { cur.def.init(cur.s); cur.inited = true; }
  cur.t0 = performance.now();
  flight.visited.push(cur);
  setAmb(cur.def.amb);
  if (!first) {
    click();
    noteAct("YOU LEFT.");
    const r = Math.random();
    cutFx = r < 0.18 ? { kind: "loading", t0: performance.now(), dur: 350 } : r < 0.27 ? { kind: "broken", t0: performance.now(), dur: 260 } : null;
  }
}
// "cut to another scene": swap the one you're in for one you haven't had, same height
function jumpScene() {
  const used = new Set(flight.scenes.map(x => x.def.id)), spare = SCENES.filter(d => !used.has(d.id));
  if (!spare.length) return;
  flight.scenes[sceneIdx] = { def: pick(spare), s: {}, inited: false, secret: flight.scenes[sceneIdx].secret };
  cutTo(sceneIdx);
}
function goSecret() {

  const d = await loadTruths(), s = loadSeen();
  const rows = [...d.truths.map(t => [t, false]), ...d.deep.map(t => [t, true]), [d.final, false]];
  const table = $("truthsTable"); table.textContent = "";
  let known = 0;
  rows.forEach(([t, deep], i) => {
    const has = s.ever.includes(t.id);
    if (has && t !== d.final) known++;
    const tr = document.createElement("tr"); tr.className = has ? "" : "unk";
    const n = document.createElement("td"), x = document.createElement("td");
    n.textContent = t === d.final ? "∞" : (deep ? "D" : "") + String(i + 1 - (deep ? d.truths.length : 0)).padStart(2, "0");
    x.textContent = has ? t.text : "█".repeat(Math.max(4, Math.round(t.text.length * 0.8)));
    tr.append(n, x); table.append(tr);
  });
  $("truthsCount").textContent = `${known} OF ${d.truths.length + d.deep.length} LEARNED`;
  $("truthsPage").hidden = false;
}

// ============================================================
// Main loop
// ============================================================
function drawStart(now) {
  const t = now / 1000;
  bg(); fillPat("stars", t * 4, -t * 2, 0, 0, W, H, 0.35);
  E.melt = 0;
  sun(CX, CY - S * 0.05, S * 0.18, "wire");
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  E.t = now / 1000;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (mode === "start") { drawStart(now); return; }
  if (mode === "fly") updateFly(now, dt);
  if (mode === "secret") { readInput(now, dt); if ((now - cur.t0) / 1000 > 7) endSecret(); }
  updateDrips(dt);
  if (hold > 0) { hold -= dt; return; }               // it waits (the last frame stays up)
  if (mode === "fly" || mode === "secret") drawFly(now, dt);
  else if (mode === "melt") drawMelt(now, dt);
  else if (mode === "fall") drawFall(now);
  else if (mode === "oracle") drawOracle(now);
}

// ============================================================
// Setup
// ============================================================
$("go").onclick = async () => {
  const motion = requestMotion();           // iOS: the permission prompt only works inside the tap
  primeSpeech();                            // speech also needs a tap first
  try { audio = initAudio(); await audio.ac.resume(); } catch (e) { audio = null; }
  await motion;
  await loadTruths();
  gyro.calibrate = true;
  $("start").hidden = true;
  newFlight();
  mode = "fly";
};
$("again").onclick = () => {
  $("after").hidden = true; $("truthsPage").hidden = true;
  try { speechSynthesis.cancel(); } catch (e) { /* no voice */ }
  if (audio) { glide(audio.sg.gain, 0, 0.3); const t = audio.ac.currentTime; for (const p of [audio.o1.frequency, audio.o2.frequency]) { p.cancelScheduledValues(t); p.setValueAtTime(55, t); } }
  oracle = null; gyro.calibrate = true;
  newFlight(); mode = "fly";
};
$("share").onclick = () => shareCard();
$("tlist").onclick = () => showTruths();
$("truthsClose").onclick = () => { $("truthsPage").hidden = true; };
$("voice").onclick = () => {
  voiceOn = !voiceOn;
  try { localStorage.setItem(VOICE_KEY, voiceOn ? "1" : "0"); } catch (e) { /* private mode */ }
  $("voice").textContent = voiceOn ? "voice: on" : "voice: off";
  if (!voiceOn) { try { speechSynthesis.cancel(); } catch (e) { /* no voice */ } } else if (oracle) speak(oracle.truth.text);
};
document.addEventListener("visibilitychange", () => { if (!document.hidden && audio) audio.ac.resume(); });
requestAnimationFrame(frame);
</script>
