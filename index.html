// Where each hand is and how it's held this frame. side: -1 left, +1 right.
function handPose(now, side) {
  const t = now / 1000;
  const sp = clamp((fwdSpeed - SPEED_BASE) / (SPEED_ALT + SPEED_BASE), 0, 1);
  let cover = 0, drop = 0;
  if (mode === "melt") {
    const ft = (now - meltStart) / 1000;
    drop = clamp((ft - COVER_OUT_AT) / COVER_OUT, 0, 1);
    cover = smooth01(clamp(ft / COVER_IN, 0, 1));
  }
  const trem = heat * heat * 0.008 + (mode === "melt" ? 0.004 : 0);
  const base = [side * HAND_BASE[0], HAND_BASE[1], HAND_BASE[2]];
  base[1] += 0.012 * Math.sin(t * 1.3 + side * 0.4);
  base[1] += 0.06 * clamp((altitude - SEA_LINE) / (1 - SEA_LINE), 0, 1);
  base[2] -= 0.05 * heat;
  base[0] += Math.sin(t * 0.8 + side * 2) * 0.01 * (1 + 2 * sp) + side * 0.03 * sp;
  base[1] += Math.sin(t * 1.1 + side) * 0.008 * (1 + 2 * sp) - 0.04 * sp + (Math.random() - 0.5) * 0.004 * sp;
  base[1] += -side * bank * 0.22;
  base[0] += (Math.random() - 0.5) * trem; base[1] += (Math.random() - 0.5) * trem;
  const cb = [side * 0.16, -0.02, 0.45];
  const b = base.map((v, i) => lerp(v, cb[i], cover));
  b[1] -= drop * drop * 1.4;
  return {
    base: b,
    pitch: lerp(HAND_PITCH + 0.03 * Math.sin(t * 1.3), 0.05, cover),
    roll: lerp(side * HAND_INWARD, side * 0.1, cover) - bank * 0.35 * (1 - cover),
    splay: lerp(1 + 0.08 * Math.sin(t * 0.6 + side), 3.2, cover),
    curl: (j, fi) => lerp((0.2 + 0.09 * Math.sin(t * (0.8 + fi * 0.13) + fi * 1.9 + side) + 0.04 * (fi === 3 ? 1 : fi === 2 ? 0.5 : 0))
                          * [0.8, 1, 0.7][j], 0, cover),
  };
}

// One hand in camera space: flesh polygons { c, burn, id }, bones { a, b, burn }, fingertip points
function buildHand(side, P) {
  const polys = [], bones = [], tips = [];
  let id = 0;
  const S = HAND_SCALE, cp = Math.cos(P.pitch), spn = Math.sin(P.pitch), cr = Math.cos(P.roll), sr = Math.sin(P.roll);
  const X = (x, y, z) => {
    x *= side * S; y *= S; z *= S;
    const y1 = y * cp - z * spn, z1 = y * spn + z * cp;
    return [x * cr - y1 * sr + P.base[0], x * sr + y1 * cr + P.base[1], z1 + P.base[2]];
  };
  const poly = (pts, u) => polys.push({ c: pts.map(p => X(p[0], p[1], p[2])), burn: lerp(BURN_TIP, BURN_WRIST, u), id: side * 1000 + id++ });
  const bone = (a, b, u) => bones.push({ a: X(a[0], a[1], a[2]), b: X(b[0], b[1], b[2]), burn: lerp(BURN_TIP, BURN_WRIST, u) });
  const palmZ = x => 0.06 * (x / 0.2) ** 2;
  const L3 = (p, q, t) => [lerp(p[0], q[0], t), lerp(p[1], q[1], t), lerp(p[2], q[2], t)];
  const SUB = 2;                                                   // two pieces per phalanx: chunky
  const chain = (fg, fi, isThumb) => {
    const splay = fg.splay * P.splay;
    const dx = Math.sin(splay), dy = Math.cos(splay), sx = Math.cos(splay), sy = -Math.sin(splay);
    const off = (p, w, z = 0) => [p[0] + sx * w, p[1] + sy * w, p[2] + z];
    let p = [fg.x, fg.y, palmZ(fg.x)], ang = isThumb ? 0.35 : 0;
    const u0 = isThumb ? 0.05 : 0;
    for (let j = 0; j < 3; j++) {
      const curl = P.curl(j, fi), Ln = fg.len[j];
      const w0 = fg.w * (1 - 0.12 * j), w1 = fg.w * (1 - 0.12 * (j + 1));
      const u = u0 + (2 - j) * 0.13;                               // fingertips burn first
      const p0 = p, a0 = ang;
      for (let s = 0; s < SUB; s++) {
        ang = a0 + (curl * (s + 1)) / SUB;
        const L = Ln / SUB, ws = lerp(w0, w1, s / SUB), we = lerp(w0, w1, (s + 1) / SUB);
        const q = [p[0] + dx * Math.cos(ang) * L, p[1] + dy * Math.cos(ang) * L, p[2] + Math.sin(ang) * L];
        poly([off(p, -ws), off(q, -we), off(q, we), off(p, ws)], u + 0.02 * s);
        p = q;
      }
      const q = p;
      bone(L3(p0, q, 0.12), L3(p0, q, 0.88), u);
      if (j === 2) {
        const ex = dx * Math.cos(ang), ey = dy * Math.cos(ang), ez = Math.sin(ang);
        const tc = [q[0] + ex * w1 * 0.9, q[1] + ey * w1 * 0.9, q[2] + ez * w1 * 0.9];
        const t1 = [q[0] + ex * w1 * 0.6 - sx * w1 * 0.7, q[1] + ey * w1 * 0.6 - sy * w1 * 0.7, q[2] + ez * w1 * 0.6];
        const t2 = [q[0] + ex * w1 * 0.6 + sx * w1 * 0.7, q[1] + ey * w1 * 0.6 + sy * w1 * 0.7, q[2] + ez * w1 * 0.6];
        poly([off(q, -w1), t1, tc, t2, off(q, w1)], u);
        tips.push(X(tc[0], tc[1], tc[2]));
      }
    }
  };
  FINGERS.forEach((fg, i) => chain(fg, i, false));
  chain(THUMB, 4, true);
  const P3 = (x, y, dz = 0) => [x, y, palmZ(x) + dz];
  const kn = FINGERS.map(f => P3(f.x, f.y, -0.02));
  poly([kn[0], kn[1], kn[2], kn[3], P3(0.21, 0.5), P3(0.215, 0.38), P3(0.205, 0.24), P3(0.19, 0.12), P3(0.175, 0.04), P3(0.17, 0),
        P3(-0.17, 0), P3(-0.2, 0.06), P3(THUMB.x - 0.02, THUMB.y - 0.02), P3(-0.2, 0.2), P3(-0.205, 0.27), P3(-0.218, 0.4), P3(-0.215, 0.5)], 0.55);   // palm
  poly([P3(-0.17, 0), P3(0.17, 0), [0.22, -0.45, 0.02], [-0.21, -0.45, 0.02]], 0.92);                                                              // forearm
  const carp = [-0.09, -0.03, 0.03, 0.09];
  FINGERS.forEach((f, i) => bone(P3(carp[i], 0.11), P3(f.x, f.y - 0.03), 0.45));
  bone(P3(THUMB.x + 0.07, 0.05), P3(THUMB.x, THUMB.y), 0.5);
  for (let i = 0; i < 6; i++) {
    const a1 = (i / 6) * Math.PI * 2, a2 = ((i + 1) / 6) * Math.PI * 2;
    bone([Math.cos(a1) * 0.08, 0.05 + Math.sin(a1) * 0.035, 0], [Math.cos(a2) * 0.08, 0.05 + Math.sin(a2) * 0.035, 0], 0.8);
  }
  bone([-0.07, 0, 0], [-0.1, -0.45, 0.02], 0.95); bone([0.07, 0, 0], [0.1, -0.45, 0.02], 0.95);
  return { polys, bones, tips };
}

// Burnt flesh breaks into two pieces that tumble away (virtual screen space)
function spawnFrag(a, b) {
  for (let k = 0; k < 2 && frags.length < FRAG_CAP; k++) {
    const x1 = lerp(a[0], b[0], k / 2), y1 = lerp(a[1], b[1], k / 2), x2 = lerp(a[0], b[0], (k + 1) / 2), y2 = lerp(a[1], b[1], (k + 1) / 2);
    frags.push({ cx: (x1 + x2) / 2, cy: (y1 + y2) / 2, hx: (x2 - x1) / 2, hy: (y2 - y1) / 2,
                 vx: (Math.random() - 0.5) * 70, vy: -20 - Math.random() * 50, spin: (Math.random() - 0.5) * 8, life: 0, max: 0.8 + Math.random() * 0.8 });
  }
}
function updateFrags(dt) {
  frags = frags.filter(f => {
    f.life += dt;
    f.vy += 260 * dt; f.cx += f.vx * dt; f.cy += f.vy * dt;
    const c = Math.cos(f.spin * dt), s = Math.sin(f.spin * dt), hx = f.hx;
    f.hx = hx * c - f.hy * s; f.hy = hx * s + f.hy * c;
    return f.life < f.max;
  });
}

// Project, burn and draw both hands (back pieces first), then the bones, fragments and sparks
function drawBody(now) {
  const proj = c => { const z = Math.max(0.2, c[2]); return [(W / 2 + ((c[0] - handEye) * FOCAL) / z) * FBS, (H / 2 - (c[1] * FOCAL) / z) * FBS, z]; };
  const first = eyeNow <= 0;
  if (first) { handTips = []; handPtsScreen = []; }
  const all = [], boneSegs = [];
  for (const side of [-1, 1]) {
    const { polys, bones, tips } = buildHand(side, handPose(now, side));
    if (first) for (const tp of tips) { const s = proj(tp); handTips.push({ x: s[0] / FBS, y: s[1] / FBS }); }
    for (const pg of polys) { const pts = pg.c.map(proj); let z = 0; for (const p of pts) z += p[2]; all.push({ pg, pts, z: z / pts.length }); }
    for (const b of bones) boneSegs.push(b);
  }
  all.sort((a, b) => b.z - a.z);
  for (const { pg, pts } of all) {
    const f = burnAmt - pg.burn;
    if (f >= 0) {                                    // burnt away
      if (!burnt.has(pg.id)) { burnt.add(pg.id); spawnFrag([pts[0][0] / FBS, pts[0][1] / FBS], [pts[1][0] / FBS, pts[1][1] / FBS]); }
      continue;
    }
    if (f < -0.12) burnt.delete(pg.id);              // cooled: the flesh grows back
    const flat = [];
    for (const p of pts) flat.push(p[0], p[1]);
    if (f > -0.08) {                                 // charring: the edge flickers dim, sparks lift off
      const k = (f + 0.08) / 0.08;
      if (first && embers.length < EMBER_CAP && Math.random() < k * 0.35) {
        const a = pts[0], b = pts[1], u = Math.random();
        embers.push({ x: lerp(a[0], b[0], u) / FBS, y: lerp(a[1], b[1], u) / FBS, vx: (Math.random() - 0.5) * 30, vy: -40 - Math.random() * 70, life: 0, max: 0.5 + Math.random() * 0.8, s: 2 });
      }
      pxFill(flat, 0); pxOutline(flat, Math.random() < k * 0.5 ? 85 : 170);
      continue;
    }
    pxFill(flat, 0); pxOutline(flat, 255);
    if (first && Math.random() < 0.04) handPtsScreen.push({ x: pts[0][0] / FBS, y: pts[0][1] / FBS });
  }
  for (const b of boneSegs) {                        // bones show where the flesh has gone
    const reveal = clamp((burnAmt - b.burn + 0.06) / 0.12, 0, 1);
    if (reveal < 0.3) continue;
    const p = proj(b.a), q = proj(b.b);

  for (const f of frags) { const v = lvOf(1 - f.life / f.max); if (v) pxLine((f.cx - f.hx) * FBS, (f.cy - f.hy) * FBS, (f.cx + f.hx) * FBS, (f.cy + f.hy) * FBS, v); }
  for (const e of embers) { const v = lvOf(1 - e.life / e.max); if (v) pxRect(e.x * FBS, e.y * FBS, 1, 1, v); }
}
function updateEmbers(dt) {
  embers = embers.filter(e => {
    e.life += dt; e.x += e.vx * dt + Math.sin(e.life * 9) * 12 * dt; e.y += e.vy * dt; e.vy *= 1 - 0.8 * dt;
    return e.life < e.max;
  });
}

// Hard turns and dives shed a few feathers off the hands
function spawnFeathers(dt) {
  if (!handPtsScreen.length || feathers.length >= FEATHER_CAP) return;
  const rate = Math.max(0, Math.abs(yawRate) - 0.5) * 4 + thrustEff * 2 + barrelNow() * 10;
  if (Math.random() >= rate * dt) return;
  const p = handPtsScreen[(Math.random() * handPtsScreen.length) | 0];
  feathers.push({ x: p.x, y: p.y, vx: -yawRate * 120 + (Math.random() - 0.5) * 40, vy: -20 + Math.random() * 30,
                  ph: Math.random() * 6.28, life: 0, max: 1.4 + Math.random() * 1.2, size: 1.4 + Math.random() * 1.2 });
}

// One line of text in the panel's type (so it's in the saved video)
function caption(text, a, y = H * 0.42) {
  if (a <= 0.15) return;
  pxText(glitchText(text), FB_W / 2, Math.round(y * FBS) - 7, 2, a > 0.6 ? 255 : 170, "center", true);
}

// ---------- The ones before you: dot figures falling past; some climb beside you first ----------
function spawnFigures(dt) {
  const rate = lerp(FIG_RATE_LOW, FIG_RATE_HIGH, altitude * altitude);
  if (figures.length >= FIG_MAX || Math.random() >= rate * dt) return;
  const f = { t: 0, seed: Math.random() * 10, dropped: false };
  if (Math.random() < FIG_CLIMBER) {
    place(f, 3 + Math.random() * 3, side() * (2.5 + Math.random() * 1.5));
    f.y = view.h + 0.3 + Math.random() * 0.6; f.vy = 0.4; f.climb = 3 + Math.random() * 2;
    f.ang = 0; f.spin = 0;
  } else {
    place(f, 8 + Math.random() * 16, side() * (1.5 + Math.random() * 8));
    f.y = view.h + 7 + Math.random() * 4; f.vy = -1 - Math.random() * 2; f.climb = 0;
    f.ang = Math.random() * 6.28; f.spin = (Math.random() - 0.5) * 4;
  }

}
function updateFigures(dt) {
  figures = figures.filter(f => {
    f.t += dt;

      f.x += view.hx * fwdSpeed * dt; f.z += view.hz * fwdSpeed * dt;
      f.y += f.vy * dt;
    } else {
      if (f.climb > 0 && !f.dropped) { f.dropped = true; f.vy = 0; f.spin = (Math.random() - 0.5) * 3; }
      f.vy -= FIG_GRAVITY * dt; f.y += f.vy * dt; f.ang += f.spin * dt;

  });
}
function figurePoints(f) {
  const climbing = f.climb > 0 && !f.dropped;
  const armLift = climbing ? Math.sin(f.t * 9) * 0.35 : 0.4 + Math.sin(f.t * 13 + f.seed) * 0.25;
  const P = [];
  for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; P.push([Math.cos(a) * 0.14, 1.62 + Math.sin(a) * 0.14]); }
  for (let i = 0; i <= 3; i++) P.push([0, 1.45 - i * 0.22]);
  for (const sd of [-1, 1]) {
    for (let i = 1; i <= 4; i++) P.push([sd * 0.2 * i, 1.38 + armLift * (i / 4)]);
    for (let i = 1; i <= 4; i++) P.push([sd * 0.07 * i, 0.8 - 0.2 * i]);

  const rx = view.hz, rz = -view.hx;
  for (const f of figures) {
    defer(Math.hypot(f.x - view.x, f.z - travel), () => {
      const ca = Math.cos(f.ang), sa = Math.sin(f.ang);
      for (const [u, v] of figurePoints(f)) {
        const vv = v - 0.9, ur = u * ca - vv * sa, vr = u * sa + vv * ca;
        const c = toCam(f.x + rx * ur, f.y + vr, f.z + rz * ur);
        if (c[2] < NEAR) continue;
        const [sx, sy] = toScreen(c);
        wireDot(sx, sy, clamp(60 / c[2], 3, 7), 0.15 + 0.85 * depthB(c[2], VIEW_FAR * 1.3));
      }
    });
  }
}

// ---------- Your ghosts: past flights as faint trails in world space ----------
function loadGhosts() {
  try {
    const g = JSON.parse(localStorage.getItem(GHOST_KEY) || "[]");
    return Array.isArray(g) ? g.filter(p => Array.isArray(p) && p.length >= 6).slice(-GHOST_MAX) : [];
  } catch (e) { console.warn("Couldn't read ghosts", e); return []; }
}
function saveGhost(path) {
  if (path.length < 6) return;
  ghosts.push(path);
  while (ghosts.length > GHOST_MAX) ghosts.shift();
  try { localStorage.setItem(GHOST_KEY, JSON.stringify(ghosts)); }
  catch (e) { console.warn("Couldn't save ghosts", e); }
}
function recordGhost(now) {
  if (!flight || !flightOrigin || now - lastGhostRec < GHOST_STEP || ghostPath.length >= GHOST_POINTS * 3) return;
  lastGhostRec = now;
  const o = flightOrigin, dx = view.x - o.x, dz = travel - o.z;
  const r2 = v => Math.round(v * 100) / 100;
  ghostPath.push(r2(dx * o.hx + dz * o.hz), r2(dx * o.hz - dz * o.hx), r2(view.h));
}
function drawGhosts() {
  if (!ghosts.length) return;
  const o = flightOrigin || { x: view.x, z: travel, hx: view.hx, hz: view.hz };
  const far = VIEW_FAR * 1.3;
  ghosts.forEach((g, gi) => {
    const age = 0.45 + 0.55 * ((gi + 1) / ghosts.length);
    let px = 0, pz = 0, py = 0, has = false;
    for (let i = 0; i + 2 < g.length; i += 3) {
      const f = g[i], l = g[i + 1];
      const x = o.x + o.hx * f + o.hz * l, z = o.z + o.hz * f - o.hx * l, y = g[i + 2];
      if (has) {
        const mx = (x + px) / 2, mz = (z + pz) / 2, d = Math.hypot(mx - view.x, mz - travel);
        if (d < far && (vloop || fwdOf(mx, mz) > -2)) seg3(px, py, pz, x, y, z, 0.22 * age * (0.3 + 0.7 * depthB(d, far)));
      }
      px = x; pz = z; py = y; has = true;
    }
  });
}

// ---------- The father: a tiny wire figure on the ground; shrinks as you climb ----------
function drawStanding(fx, fz, sc, b) {
  const rx = view.hz, rz = -view.hx;
  const L = (u1, v1, u2, v2) => seg3(fx + rx * u1 * sc, v1 * sc, fz + rz * u1 * sc, fx + rx * u2 * sc, v2 * sc, fz + rz * u2 * sc, b);
  for (let i = 0; i < 6; i++) {
    const a1 = (i / 6) * Math.PI * 2, a2 = ((i + 1) / 6) * Math.PI * 2;
    L(Math.cos(a1) * 0.09, 1.0 + Math.sin(a1) * 0.09, Math.cos(a2) * 0.09, 1.0 + Math.sin(a2) * 0.09);
  }
  L(0, 0.9, 0, 0.5); L(0, 0.82, -0.18, 0.58); L(0, 0.82, 0.18, 0.58); L(0, 0.5, -0.1, 0); L(0, 0.5, 0.1, 0);
}
function drawFather() {
  const sky = clamp((viewAlt - SEA_LINE) / (1 - SEA_LINE), 0, 1);
  const sc = mode === "melt" ? 1 : lerp(1, 0.4, sky);
  const fx = father.x, fz = father.z, d = Math.hypot(fx - view.x, fz - travel);
  const b = 0.35 + 0.6 * depthB(d, VIEW_FAR * 1.5);
  defer(d, () => {

      for (let i = 0; i <= 7; i++) { const a = (i / 7) * Math.PI * 2, r = 0.7 + 0.2 * Math.sin(i * 2.7); rock.push([fx + Math.cos(a) * r, 0.05, fz + Math.sin(a) * r]); }

}

// ---------- The sea, rushing up during the long fall ----------
function drawSea(now, amt) {
  const t = now / 1000;
  const cx = Math.round(father.x / SEA_SPACING) * SEA_SPACING, cz = Math.round(father.z / SEA_SPACING) * SEA_SPACING;
  const step = 8, far = SEA_HALF * 1.2;
  for (let k = 0; k < SEA_LINES; k += 2) {
    const z = cz - SEA_HALF + k * SEA_SPACING;
    let px = 0, py = 0, has = false;
    for (let x = cx - SEA_HALF; x <= cx + SEA_HALF; x += step) {
      const y = 0.12 * Math.sin(x * 0.45 + t * 1.8 + k * 0.9);
      if (has) { const d = Math.hypot((x + px) / 2 - view.x, z - travel); seg3(px, py, z, x, y, z, amt * (0.2 + 0.7 * depthB(d, far))); }
      px = x; py = y; has = true;
    }
  }
}

// ---------- Horizon: the line at infinity, tilted by pitch and roll ----------
function drawHorizon() {
  if (Math.abs(view.cp) <= 0.02) return;
  const y0 = clamp((focal * view.sp) / view.cp, -1e5, 1e5);
  const ends = [[-W, y0], [W, y0]].map(([a, b]) => [W / 2 + a * view.cr - b * view.sr, H / 2 + a * view.sr + b * view.cr]);
  wire(ends[0][0], ends[0][1], ends[1][0], ends[1][1], 0.5);
}

// ---------- Ground grid: world-aligned, so turning swings it; sliced so each piece fades on its own ----------
function drawGround() {
  const half = (GRID_LINES * GRID) / 2, bias = vloop ? 0 : half - 4;
  const cx = Math.round((view.x + view.hx * bias) / GRID) * GRID;
  const cz = Math.round((travel + view.hz * bias) / GRID) * GRID;
  const SL = 6;
  const piece = (x1, z1, x2, z2) => {
    const mx = (x1 + x2) / 2, mz = (z1 + z2) / 2;
    if (!vloop && fwdOf(mx, mz) < -SL) return;
    const d = Math.hypot(mx - view.x, mz - travel);
    if (d > VIEW_FAR) return;
    seg3(x1, 0, z1, x2, 0, z2, 0.75 * depthB(d, VIEW_FAR) * clamp((VIEW_FAR - d) / 4, 0, 1));
  };
  for (let i = 0; i <= GRID_LINES; i++) {
    const u = -half + i * GRID;
    for (let s = -half; s < half; s += SL) { piece(cx + u, cz + s, cx + u, cz + s + SL); piece(cx + s, cz + u, cx + s + SL, cz + u); }
  }
}

const sceneryB = d => depthB(d, VIEW_FAR * 1.2) * clamp((VIEW_FAR * 1.2 - d) / 5, 0, 1);
const distOf = o => Math.hypot(o.x - view.x, o.z - travel);
const passed = (o, behind, wide) => fwdOf(o.x, o.z) < behind || Math.abs(latOf(o.x, o.z)) > wide;

// ---------- Clouds: solid outlines at eye level that part around the camera ----------
function drawClouds() {
  for (const c of cloudShapes) {
    respawn(c, spawnCloud, 0.3, 40);
    const d = Math.max(0, fwdOf(c.x, c.z)), n = c.pts.length, y = view.h + c.yRel;
    const b = 0.85 * depthB(d, VIEW_FAR) * clamp((VIEW_FAR - d) / 4, 0, 1);
    if (b <= 0.04) continue;
    const split = d < CLOUD_SPLIT ? 3.5 * Math.pow(1 - d / CLOUD_SPLIT, 1.5) : 0;
    const rx = view.hz, rz = -view.hx;
    const half = (from, to, off) => {
      const cam = [];
      for (let i = from; i <= to; i++) { const p = c.pts[i % n], u = p[0] + off; cam.push(toCam(c.x + rx * u, y + p[1], c.z + rz * u)); }
      face(cam, lvOf(b));
    };
    defer(Math.hypot(c.x - view.x, c.z - travel), () => {
      if (split <= 0) half(0, n - 1, 0);
      else { half(n / 4, (3 * n) / 4, -split); half((3 * n) / 4, n + n / 4, split); }
    });
  }
}

// ---------- Speed lines: streaks rushing past once you're flying fast ----------
function drawSpeedLines() {
  const show = clamp((fwdSpeed - 6) / 6 + Math.max(0, thrustEff) + barrelNow() * 0.6, 0, 1);
  const len = fwdSpeed * (0.07 + 0.05 * Math.max(0, thrustEff));
  for (const p of speedLines) {
    if (passed(p, 0.3, 8)) spawnSpeed(p, 14 + Math.random() * 8);
    if (show <= 0) continue;
    const t = clamp(1 - fwdOf(p.x, p.z) / 22, 0, 1);
    seg3(p.x, p.y, p.z, p.x + view.hx * len, p.y, p.z + view.hz * len, show * (0.25 + 0.75 * t * t));
  }
}

// ---------- The far skyline: a solid jagged range all round (it hides the sun's lower edge) ----------
function drawRidge() {
  const half = Math.PI, N = 48;
  const hAt = a => 2.5 + 2.2 * Math.abs(Math.sin(a * 3 + RIDGE_SEED)) + 1.6 * Math.sin(a * 7.3 + RIDGE_SEED * 2)
                 + 0.9 * Math.sin(a * 17 + RIDGE_SEED * 3) + 0.5 * Math.sin(a * 41);
  let px = 0, py = 0, pz = 0, has = false;
  for (let i = 0; i <= N; i++) {
    const a = view.yaw - half + (i / N) * half * 2;
    const x = view.x + Math.sin(a) * RIDGE_D, z = travel + Math.cos(a) * RIDGE_D, y = Math.max(0, hAt(a));
    if (has) {
      face([toCam(px, 0, pz), toCam(px, py, pz), toCam(x, y, z), toCam(x, 0, z)], 0);
      seg3(px, py, pz, x, y, z, 0.2);
    }
    px = x; py = y; pz = z; has = true;
  }
}

// ============================================================
// The highway at night: poles and sagging wires, motels, gas stations, overpasses, and billboards
// selling the site's own ads, until they start talking about you. Higher = stranger.
// ============================================================
const weirdNow = () => clamp((viewAlt - WEIRD_FROM) / (WEIRD_FULL - WEIRD_FROM), 0, 1);
function hash1(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function fadeAt(x, z) {
  const d = Math.hypot(x - view.x, z - travel);
  return d >= VIEW_FAR ? 0 : depthB(d, VIEW_FAR) * clamp((VIEW_FAR - d) / 4, 0, 1);
}
function roadsNear() {
  const k0 = Math.round(view.x / HWY_SPACING), out = [];
  for (let k = k0 - 1; k <= k0 + 1; k++) { const rx = k * HWY_SPACING; if (Math.abs(rx - view.x) < VIEW_FAR + POLE_X) out.push(rx); }
  return out;
}
// Solid things are queued with their distance and drawn far to near (painter's algorithm)
let DL = [];
const defer = (d, f) => { DL.push({ d, f }); };

function drawHighway() {
  const z0 = travel - VIEW_FAR, z1 = travel + VIEW_FAR, SL = 4;
  for (const rx of roadsNear()) {
    for (let z = Math.floor(z0 / SL) * SL; z < z1; z += SL) {
      for (const x of [rx - HWY_HALF, rx + HWY_HALF]) { const b = fadeAt(x, z + SL / 2); if (b > 0.04) seg3(x, 0, z, x, 0, z + SL, b); }
    }
    for (let z = Math.floor(z0 / (DASH * 2)) * DASH * 2; z < z1; z += DASH * 2) {
      const b = fadeAt(rx, z) * 0.7; if (b > 0.04) seg3(rx, 0, z, rx, 0, z + DASH, b);
    }
  }
}

// Cars on the nearest road: little solid boxes with their lights, recycled as they leave the view
function lightDot(x, y, z, v) {
  const p = toCam(x, y, z);
  if (p[2] <= NEAR) return;
  const s = toScreen(p), sz = clamp(Math.round(10 / p[2]), 1, 3);
  pxRect(s[0] * FBS - sz / 2, s[1] * FBS - sz / 2, sz, sz, v);
}
function drawCars(dt) {
  const rx = Math.round(view.x / HWY_SPACING) * HWY_SPACING;
  for (const c of cars) {
    c.z += c.v * dt;
    if (c.z - travel > VIEW_FAR) c.z = travel - VIEW_FAR * 0.3;
    else if (c.z - travel < -VIEW_FAR * 0.3) c.z = travel + VIEW_FAR * 0.95;
    const x = rx + c.lane, b = fadeAt(x, c.z);
    if (b <= 0.04) continue;
    defer(Math.hypot(x - view.x, c.z - travel), () => {
      const z0 = c.z - 0.9, z1 = c.z + 0.9, y0 = 0.05, y1 = 0.55, hw = 0.4;
      hexa([[x - hw, y0, z0], [x + hw, y0, z0], [x + hw, y0, z1], [x - hw, y0, z1], [x - hw, y1, z0], [x + hw, y1, z0], [x + hw, y1, z1], [x - hw, y1, z1]], b * 0.8);
      const dir = Math.sign(c.v), front = c.v > 0 ? z1 : z0, back = c.v > 0 ? z0 : z1;
      for (const o of [-0.25, 0.25]) { lightDot(x + o, 0.3, back - dir * 0.03, b > 0.3 ? 170 : 85); lightDot(x + o, 0.3, front + dir * 0.03, b > 0.3 ? 255 : 85); }
    });
  }
}

// Telephone poles both sides of each road, every POLE_GAP, three wires sagging between each pair.
// Computed straight from where the camera is: nothing to spawn, nothing to keep.
// Strange: the poles bend toward the sun and the wires sway; higher still, spans snap and whip.
function drawPoles(now) {
  const w = weirdNow(), t = now / 1000, bend = w * w;
  const snap = clamp((viewAlt - 0.72) / 0.2, 0, 1);
  const k0 = Math.ceil((travel - VIEW_FAR * 0.4) / POLE_GAP), k1 = Math.floor((travel + VIEW_FAR) / POLE_GAP);
  for (const rx of roadsNear()) for (const s of [-1, 1]) {
    const x = rx + s * POLE_X;
    if (Math.abs(x - view.x) > VIEW_FAR) continue;
    const top = k => {
      const z = k * POLE_GAP, dx = SUN_X - x, dz = SUN_Z - z, dl = Math.hypot(dx, dz) || 1;
      const lean = bend * 1.8 * (0.7 + 0.3 * hash1(k * 3 + x));
      return [x + (dx / dl) * lean, POLE_H - bend * 0.3, z + (dz / dl) * lean];
    };
    for (let k = k0; k <= k1; k++) {
      const z = k * POLE_GAP, b = fadeAt(x, z);
      if (b <= 0.04) continue;
      const d = Math.hypot(x - view.x, z - travel);
      defer(d, () => drawPole(x, z, k, top(k), top(k + 1), b, d, w, t, snap));
    }
  }
}
function drawPole(x, z, k, T, T2, b, d, w, t, snap) {
  const mx = lerp(x, T[0], 0.3), mz = lerp(z, T[2], 0.3), my = POLE_H * 0.5, ay = T[1] - 0.15;
  if (d < 24) {                                                       // near: boxy solid beams
    beam([x, 0, z], [mx, my, mz], 0.08, b); beam([mx, my, mz], T, 0.07, b);
    beam([T[0] - ARM, ay, T[2]], [T[0] + ARM, ay, T[2]], 0.05, b);
  } else {                                                            // far: a pixel wide anyway
    seg3(x, 0, z, mx, my, mz, b); seg3(mx, my, mz, T[0], T[1], T[2], b); seg3(T[0] - ARM, ay, T[2], T[0] + ARM, ay, T[2], b);
  }
  const NS = d < 24 ? 6 : 3;
  for (const wo of [-ARM * 0.85, 0, ARM * 0.85]) {
    const ax = T[0] + wo, az = T[2], bx = T2[0] + wo, by = T2[1] - 0.15, bz = T2[2];
    if (snap > 0 && hash1(k * 7.3 + x * 3.1 + wo * 11) < snap * 0.6) {
      for (const [ox, oy, oz, dir] of [[ax, ay, az, 1], [bx, by, bz, -1]]) {      // snapped: both ends hang and whip
        let px = ox, py = oy, pz = oz;
        for (let i = 1; i <= 4; i++) {
          const u = i / 4, whip = Math.sin(t * 9 + k * 1.7 + i + dir) * 0.7 * u;
          const qx = ox + whip, qy = oy - u * 2.2, qz = oz + dir * u * POLE_GAP * 0.18;
          seg3(px, py, pz, qx, qy, qz, b); px = qx; py = qy; pz = qz;
        }
      }
    } else {                                                                        // a catenary, swaying when strange
      let px = ax, py = ay, pz = az;
      const sway = 1 + w * 0.8 * Math.sin(t * 3 + k + wo * 5);
      for (let i = 1; i <= NS; i++) {
        const u = i / NS, sag = WIRE_SAG * 4 * u * (1 - u) * sway;
        const qx = lerp(ax, bx, u), qy = lerp(ay, by, u) - sag, qz = lerp(az, bz, u);
        seg3(px, py, pz, qx, qy, qz, b * 0.85); px = qx; py = qy; pz = qz;
      }
    }
  }
}

// Overpasses: a solid deck across each road on pillars, every OVERPASS_GAP
function drawOverpasses() {
  const m0 = Math.ceil((travel - VIEW_FAR * 0.3 - OVERPASS_AT) / OVERPASS_GAP), m1 = Math.floor((travel + VIEW_FAR - OVERPASS_AT) / OVERPASS_GAP);
  for (const rx of roadsNear()) for (let m = m0; m <= m1; m++) {
    const z = OVERPASS_AT + m * OVERPASS_GAP, b = fadeAt(rx, z) * 0.9;
    if (b <= 0.04) continue;
    defer(Math.hypot(rx - view.x, z - travel), () => {
      const y = 2.6, half = 14, th = 0.45, dz = 1.2;
      for (const px of [-HWY_HALF - 1, HWY_HALF + 1, -10, 10]) beam([rx + px, 0, z], [rx + px, y, z], 0.3, b);
      hexa([[rx - half, y, z - dz], [rx + half, y, z - dz], [rx + half, y, z + dz], [rx - half, y, z + dz],
            [rx - half, y + th, z - dz], [rx + half, y + th, z - dz], [rx + half, y + th, z + dz], [rx - half, y + th, z + dz]], b);
      for (const zz of [z - dz, z + dz]) seg3(rx - half, y + th + 0.5, zz, rx + half, y + th + 0.5, zz, b * 0.6);   // railing
    });
  }
}

// A sign's lettering in the panel font, laid onto its face (top-left, top-right, bottom-left corners).
// Neon buzz: it cuts out for a beat now and then. Strange: letters turn Greek. Near the top: the
// ads melt, letters sliding down off the board and stretching. Too far to read: a scribble line.
function signGlitch(str, seed, w, now) {
  let txt = str;
  if (w > 0) {
    const tick = Math.floor(now / 140);
    txt = [...txt].map((ch, i) => (ch !== " " && hash1(seed + i * 13 + tick) < w * 0.14 ? GREEK[(i * 7 + tick) % GREEK.length] : ch)).join("");
  }
  return glitchText(txt);
}
function signPix(tl, tr, bl, lines, b, seed, now) {
  const a = toCam(tl[0], tl[1], tl[2]), c = toCam(tr[0], tr[1], tr[2]), d = toCam(bl[0], bl[1], bl[2]);
  if (a[2] < NEAR * 4 || c[2] < NEAR * 4 || d[2] < NEAR * 4) return;
  const w = weirdNow();
  if (hash1(seed + Math.floor(now / 70)) < 0.04 + 0.12 * w) return;
  const p0 = toScreen(a), p1 = toScreen(c), p3 = toScreen(d);
  const ox = p0[0] * FBS, oy = p0[1] * FBS, ux = (p1[0] - p0[0]) * FBS, uy = (p1[1] - p0[1]) * FBS, vx = (p3[0] - p0[0]) * FBS, vy = (p3[1] - p0[1]) * FBS;
  const fw = Math.hypot(ux, uy), fh = Math.hypot(vx, vy);
  if (fw < 12 || fh < 4) return;
  const melt = clamp((viewAlt - MELT_ADS) / (1 - MELT_ADS), 0, 1);
  const at = (fu, fv) => [ox + ux * fu + vx * fv, oy + uy * fu + vy * fv];
  [[lines[0], 0.12, 0.4, lvOf(b * 1.3)], [lines[1], 0.62, 0.24, lvOf(b * 0.9)]].forEach(([str, top, maxH, v], ri) => {
    if (!v) return;
    const chars = [...signGlitch(str, seed + ri * 9, w, now)], cols = chars.length * 6 - 1;
    let gu = 0.92 / cols, gv = (gu * fw) / fh;                     // square pixels on screen
    if (gv * 7 > maxH) { gv = maxH / 7; gu = (gv * fh) / fw; }
    const x0 = (1 - gu * cols) / 2;
    if (gu * fw < 0.7) { const A = at(x0, top + gv * 3.5), B = at(1 - x0, top + gv * 3.5); pxLine(A[0], A[1], B[0], B[1], 85); return; }
    const pw = Math.max(1, Math.round(gu * fw)), ph = Math.max(1, Math.round(gv * fh));
    chars.forEach((ch, k) => {
      if (ch === " ") return;
      const g = glyph(ch), kk = hash1(seed + k * 3.7);
      const drop = melt * melt * (0.25 + 1.4 * kk) * (0.7 + 0.3 * Math.sin(now / 900 + k)), stretch = 1 + melt * 1.8 * kk;
      for (let r = 0; r < 7; r++) {
        const bits = g[r];
        if (!bits) continue;
        for (let cc = 0; cc < 5; cc++) if (bits & (16 >> cc)) {
          const P = at(x0 + (k * 6 + cc) * gu, top + r * gv * stretch + drop);
          pxRect(P[0], P[1], pw, Math.max(1, Math.round(ph * stretch)), v);
        }
      }
    });
  });
}

// Billboards: a flat black board on two legs, a catwalk, the ad. Strange: they rise on impossible legs
// to meet you, and the ads turn to you.
function drawBillboards(now) {
  const w = weirdNow(), rise = Math.pow(w, 1.5);
  let nearest = Infinity;
  for (const bb of billboards) {
    respawn(bb, spawnBillboard, -1, 45);
    const d = distOf(bb), b = sceneryB(d);
    if (b <= 0.04) continue;
    bb.reroll -= dtWorld;
    if (bb.reroll <= 0) { bb.reroll = 3 + Math.random() * 5; if (Math.random() < 0.15 + w) pickAd(bb); }
    const L = bb.leg + rise * Math.max(0, view.h - bb.h * 0.6 - bb.leg) * (0.75 + 0.25 * hash1(bb.seed));
    nearest = Math.min(nearest, Math.hypot(d, L + bb.h / 2 - view.h));
    defer(d, () => {
      const ax = bb.ax, az = bb.az, corner = (u, v) => [bb.x + ax * u, L + v, bb.z + az * u];
      for (const u of [bb.w * 0.25, bb.w * 0.75]) { const p = corner(u, 0); beam([p[0], 0, p[2]], [p[0], L, p[2]], 0.08, b * 0.8); }
      const c = [corner(0, bb.h), corner(bb.w, bb.h), corner(bb.w, 0), corner(0, 0)];
      face(c.map(p => toCam(p[0], p[1], p[2])), lvOf(b));
      seg3(...corner(-0.2, -0.25), ...corner(bb.w + 0.2, -0.25), b * 0.6);
      signPix(c[0], c[1], c[3], bb.ad, b, bb.seed, now);
    });
  }
  for (const m of motels) nearest = Math.min(nearest, Math.hypot(distOf(m), m.h - view.h));
  neonNear = clamp(1 - nearest / 14, 0, 1);
}

function drawMotels(now) {
  for (const m of motels) {
    respawn(m, spawnMotel, -1, 45);
    const d = distOf(m), b = sceneryB(d);
    if (b <= 0.04) continue;
    defer(d, () => {
      const P = (u, y) => [m.x + m.ax * u, y, m.z + m.az * u];
      const sw = 2.6, y0 = m.h - 1.1;
      beam(P(0, 0), P(0, y0), 0.09, b);
      const box = [P(-sw / 2, m.h), P(sw / 2, m.h), P(sw / 2, y0), P(-sw / 2, y0)];
      face(box.map(p => toCam(p[0], p[1], p[2])), lvOf(b));
      const ar = [P(sw / 2 + 0.2, y0 - 0.1), P(sw / 2 + 0.9, y0 - 0.45), P(sw / 2 + 0.2, y0 - 0.8)];
      seg3(...ar[0], ...ar[1], b); seg3(...ar[1], ...ar[2], b);
      signPix(box[0], box[1], box[3], ["MOTEL", m.vacancy ? "VACANCY" : "NO VACANCY"], b, m.seed, now);
    });
  }
}

function drawGas(now) {
  for (const g of gasStations) {
    respawn(g, spawnGas, -1, 45);
    const d = distOf(g), b = sceneryB(d);
    if (b <= 0.04) continue;
    defer(d, () => {
      const ax = g.ax, az = g.az, fx = -az, fz = ax;
      const P = (u, y, v) => [g.x + ax * u + fx * v, y, g.z + az * u + fz * v];
      for (const [u, v] of [[0.4, 0.4], [g.w - 0.4, 0.4], [0.4, g.d - 0.4], [g.w - 0.4, g.d - 0.4]]) beam(P(u, 0, v), P(u, g.h, v), 0.1, b);
      for (const u of [g.w * 0.33, g.w * 0.66]) {                  // pumps
        const q = [P(u - 0.25, 0, g.d / 2 - 0.2), P(u + 0.25, 0, g.d / 2 - 0.2), P(u + 0.25, 0, g.d / 2 + 0.2), P(u - 0.25, 0, g.d / 2 + 0.2)];
        hexa([...q, ...q.map(p => [p[0], 1.1, p[2]])], b * 0.8);
      }
      const c = [P(0, g.h, 0), P(g.w, g.h, 0), P(g.w, g.h, g.d), P(0, g.h, g.d)], top = c.map(p => [p[0], p[1] + 0.9, p[2]]);
      hexa([...c, ...top], b);                                      // the canopy with its tall fascia
      signPix(top[0], top[1], c[0], ["GAS · 24 HRS", "feelings extra."], b, g.seed, now);
    });
  }
}

// ---------- The sun melting: drips fall off its sagging rim and past you ----------
function updateDrips(dt, s) {
  const m = s.melt || 0;
  if ((mode === "live" || mode === "melt") && s.r > 4 && m > 0.05) {
    const n = Math.min(4, Math.floor(m * m * 45 * dt + Math.random()));
    for (let i = 0; i < n && sunDrips.length < DRIP_CAP; i++) {
      const a = (0.12 + 0.76 * Math.random()) * Math.PI;
      const sag = m * 0.55 * Math.pow(Math.max(0, Math.sin(a) + 0.25), 2);
      sunDrips.push({ x: s.x + Math.cos(a) * s.r * (1 + m * 0.12), y: s.y + Math.sin(a) * s.r * (1 + sag),
                      vx: (Math.random() - 0.5) * 30, vy: 20 + Math.random() * 80, size: 1.5 + Math.random() * 2.5 * (1 + m) });
    }
  }
  const g = 500 + 900 * m;
  sunDrips = sunDrips.filter(d => { d.vy += g * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.size *= 1 + 0.25 * dt; return d.y < H + 100; });
  const hot = Math.max(heat, burnAmt);
  if ((mode === "live" || mode === "melt") && hot > 0.1 && edgeDrips.length < EDGE_CAP && Math.random() < hot * hot * 14 * dt) {
    const left = Math.random() < 0.5;
    edgeDrips.push({ x: left ? Math.random() * W * 0.08 : W - Math.random() * W * 0.08, y: -10 - Math.random() * H * 0.2,
                     vy: 40 + Math.random() * 90, size: 2.5 + Math.random() * 3.5, c: WAX_COLORS[(Math.random() * WAX_COLORS.length) | 0] });
  }
  edgeDrips = edgeDrips.filter(d => { d.vy += 480 * dt; d.y += d.vy * dt; return d.y < H + 80; });
}
function drawDrips() {
  for (const d of sunDrips) {
    const len = clamp(d.vy * 0.05, 4, 90) * (1 + d.size * 0.15), x = d.x * FBS, y = d.y * FBS;
    pxLine((d.x - d.vx * 0.03) * FBS, (d.y - len) * FBS, x, y, 170);
    pxRect(x - 1, y - 1, 2, 2, 255);

// THE ORACLE: a solid low-poly 8-ball rising out of dark water, turning in dithered red liquid
// ============================================================
function drawOracle(now) {

  const R = 64, waterY = 170, cx = FB_W / 2;

  for (let y = Math.max(0, cy - R); y <= Math.min(FB_H - 1, cy + R); y++) {      // the liquid
    const dy = y - cy, hw = Math.floor(Math.sqrt(Math.max(0, R * R - dy * dy))), row = y * FB_W;
    for (let x = Math.max(0, cx - hw); x <= Math.min(FB_W - 1, cx + hw); x++) {

  const cyA = Math.cos(ay), syA = Math.sin(ay), cxA = Math.cos(ax), sxA = Math.sin(ax);
  const P = ICO_V.map(([x, y, z]) => {
    const x1 = x * cyA + z * syA, z1 = -x * syA + z * cyA, y1 = y * cxA - z1 * sxA, z2 = y * sxA + z1 * cxA, k = 3 / (3 + z2);
    return [cx + x1 * rs * k, cy + y1 * rs * k, z2];

  for (const f of ICO_F) { const z = P[f[0]][2] + P[f[1]][2] + P[f[2]][2]; if (z < 0.2) fr.push([z, f]); }
  fr.sort((a, b) => b[0] - a[0]);
  for (const [, f] of fr) { const p = [P[f[0]][0], P[f[0]][1], P[f[1]][0], P[f[1]][1], P[f[2]][0], P[f[2]][1]]; pxFill(p, 0); pxOutline(p, 255); }
  pxRect(0, waterY, FB_W, FB_H - waterY, 0);                       // the water, over its lower part
  for (let k = 0; k < 5; k++) {

    for (let x = 8; x <= FB_W; x += 8) { const yy = y + Math.sin(x * 0.03 + t * 0.8 + k) * (1 + k * 0.5); pxLine(px, py, x, yy, v); px = x; py = yy; }
  }

  if (t >= T0) {                                                   // the truth, typed out letter by letter
    const text = o.truth.text, n = Math.min(text.length, Math.floor(((t - T0) * 1000) / LETTER_MS));
    let shown = [...text.slice(0, n)].map(c => (c !== " " && Math.random() < 0.025 ? GREEK[(Math.random() * GREEK.length) | 0] : c)).join("");
    if (n < text.length) shown += GREEK[(Math.random() * GREEK.length) | 0];
    const big = text.length <= 16, sc = big ? 2 : 1, lines = wrapChars(text, big ? 16 : 30);
    const lw = Math.max(...lines.map(l => textW(l, sc))), lh = 9 * sc;
    const bw = lw + 12, bh = lines.length * lh + 8, bx = Math.round(cx - bw / 2), by = Math.round(cy - bh / 2);
    pxRect(bx, by, bw, bh, 0); pxFrame(bx, by, bw, bh, 170);
    let off = 0;
    lines.forEach((ln, i) => {
      const seg = shown.slice(off, off + ln.length + (off + ln.length >= shown.length - 1 ? 1 : 0));
      off += ln.length + 1;
      pxText(seg, bx + 6 + (lw - textW(ln, sc)) / 2, by + 5 + i * lh, sc, 255);
    });
    const count = o.final ? `ALL ${o.total} LEARNED · THE CYCLE BEGINS AGAIN` : `TRUTH ${String(o.learned).padStart(2, "0")} OF ${o.total} LEARNED`;
    pxText(count, cx, waterY + 12, 1, 170, "center", true);
    if (o.hint) pxText(o.hint, cx, waterY + 22, 1, 255, "center", true);
  }
  if (o.shown) {
    pxText(o.flew || "", FB_W / 2, 4, 1, 85, "center");
    const items = [["FLY AGAIN", flyAgain], ["TRUTHS", showTruths], [voiceOn ? "VOICE: ON" : "VOICE: OFF", toggleVoice]];
    if (lastClip) items.push(["SAVE CLIP", saveClip]);

}
// The Oracle's timeline: speak as the letters start (a chip beep per letter); the menu once it's

function updateOracle(now) {
  const o = oracle, t = (now - o.start) / 1000, T0 = ORACLE_DARK + ORACLE_RISE;
  if (!o.spoken && t >= T0) { o.spoken = true; speakTruth(o.truth.text); }
  const n = t >= T0 ? Math.min(o.truth.text.length, Math.floor(((t - T0) * 1000) / LETTER_MS)) : 0;

// ============================================================
// Main loop
// ============================================================
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  if (!portrait()) {
    if (mode === "live" || mode === "melt" || mode === "oracle") step(now, dt);
    else { updateRain(dt); updateScreens(now); }
  }
  render(now, dt);
}

// START: unlock audio + speech, ask for motion access, go fullscreen + landscape (all inside the tap)
async function startGame() {
  if (audio) { setMode("boot"); return; }
  try {
    const motion = requestMotion();   // first: iOS only allows the permission prompt inside the tap
    primeSpeech();                    // speech is only allowed after a tap: unlock it now for the Oracle
    loadTruths();
    audio = initAudio();
    await audio.ac.resume();
    await motion;
    try { await document.documentElement.requestFullscreen({ navigationUI: "hide" }); } catch (e) { console.warn("Fullscreen failed", e); }
    try { await screen.orientation.lock("landscape"); } catch (e) { console.warn("Orientation lock failed", e); }
    setTimeout(fit, 150);
    startError = false;
    setMode("boot");
  } catch (e) {
    console.error(e);
    startError = true;
  }
}

  embers = []; burnAmt = 0;
  view.x = 0; travel = 0; view.yaw = 0; view.hx = 0; view.hz = 1; view.cy = 1; view.sy = 0;
  view.h = CAM_H_SEA; view.pitch = 0; bank = 0; yawRate = 0; fwdSpeed = SPEED_BASE;
  father.x = 0; father.z = FATHER_AHEAD;
  respawnAll();
  recalibrate();                      // "level" = however the phone is held when you tap
  releaseVoice();
  if (audio) audio.oracleGain.gain.setTargetAtTime(0, audio.ac.currentTime, 0.3);
  sunDrips = []; edgeDrips = [];
  setMode("live");
}
function flyAgain() {
  if (!document.fullscreenElement) {
    try { document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(e => console.warn("Fullscreen failed", e)); }
    catch (e) { console.warn("Fullscreen failed", e); }
  }
  resetFlight();
}
function toggleVoice() {
  voiceOn = !voiceOn;
  try { localStorage.setItem(VOICE_KEY, voiceOn ? "1" : "0"); } catch (e) { /* private mode */ }
  if (!voiceOn) { try { speechSynthesis.cancel(); } catch (e) { /* no speech */ } speechBed(false); }
  else if (oracle) speakTruth(oracle.truth.text);
}
function toggleStereo() {
  stereo = !stereo;
  try { localStorage.setItem(STEREO_KEY, stereo ? "1" : "0"); } catch (e) { /* private mode */ }
  prevLv[0].fill(0); prevLv[1].fill(0);
  fit();
}

// A tap on the panel: hit-test this frame's menu items (in 3D, either eye's half works)
function tapAt(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  if (!r.width || !r.height) return false;
  const fx = (((clientX - r.left) / r.width) * FB_W * (stereo ? 2 : 1)) % FB_W, fy = ((clientY - r.top) / r.height) * FB_H;
  for (const m of menu) {
    if (fx >= m.x - 4 && fx <= m.x + m.w + 4 && fy >= m.y - 4 && fy <= m.y + m.h + 4) { blip(); m.act(); return true; }
  }
  return false;
}
addEventListener("click", e => {
  if (portrait()) return;
  if (!truthsView && (mode === "live" || mode === "melt")) return;
  if (tapAt(e.clientX, e.clientY) || truthsView) return;
  if (mode === "warning") { blip(); enterAlign(); }
  else if (mode === "align") { blip(); resetFlight(); }
});
addEventListener("keydown", e => {
  if (e.key !== "Enter" || portrait()) return;
  if (menu.length) { blip(); menu[0].act(); }
  else if (mode === "warning") enterAlign();
  else if (mode === "align") resetFlight();
});

addEventListener("resize", fit);
if (screen.orientation) screen.orientation.addEventListener("change", fit);
// Browsers may suspend audio in the background; wake it on return
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && audio) audio.ac.resume();
});
fit();
loop();
</script>
