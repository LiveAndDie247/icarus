  // a roar of noise and a rumble underneath, and the signal itself starts to fail
  const sunNear = clamp(heat * (0.5 + 0.5 * sunAim), 0, 1);
  glide(a.droneGain.gain, 0.35 * fatherAmt, 0.2);
  glide(a.drone2.detune, -DRONE_FLAT - heat * 95, 0.3);   // the father's low voice slides a semitone flat
  glide(a.sunGain.gain, 0.05 * sunNear + 0.12 * heat * heat, 0.15);
  glide(a.sunTremDepth.gain, 0.03 * sunNear + 0.08 * heat * heat, 0.15);
  glide(a.sunTrem.frequency, lerp(6.5, 17, heat), 0.3);
  glide(a.roarGain.gain, 0.3 * heat * heat * heat, 0.25);
  glide(a.roarFilter.frequency, lerp(180, 1100, heat), 0.3);
  glide(a.roarLfoDepth.gain, 400 * heat, 0.3);
  glide(a.roarLfo.frequency, lerp(0.6, 4, heat), 0.3);
  glide(a.rumbleGain.gain, 0.5 * heat * heat, 0.3);
  if (heat > 0.5 && Math.random() < (heat - 0.5) * 2.2 * dtVoice) sunGlitchAudio(heat);

  setFreq(a, a.ac, hzOf(semis), 0.06);
  const ratio = lerp(3, 5.04, heat);                        // the sun's voice goes inharmonic
  glide(a.sunV1.frequency, hzOf(semis) * ratio, 0.06);
  glide(a.sunV2.frequency, hzOf(semis) * ratio * lerp(SUN_BEAT, 1.41, heat), 0.06);
  glide(a.vib.frequency, lerp(5.5, 0.8, heat), 0.3);
  glide(a.osc1.detune, spread - pull);
  glide(a.osc2.detune, -spread - pull);
  glide(a.shim.detune, spread * 0.5 - pull);
  glide(a.filter.frequency, cutoff, 0.12);
  glide(a.filter.Q, q, 0.2);
  glide(a.g2.gain, saw, 0.15);
  glide(a.gSub.gain, sub, 0.15);
  glide(a.gShim.gain, shim, 0.15);
  glide(a.revSend.gain, rev, 0.3);
  glide(a.hallSend.gain, hall, 0.3);
  glide(a.wobblePitch.gain, wobP, 0.4);
  glide(a.wobbleFilter.gain, wobF, 0.4);
  glide(a.vibDepth.gain, vib, 0.15);
  glide(a.wet.gain, heat * 0.6, 0.15);     // soft saturation creeps in
  glide(a.dry.gain, 1 - heat * 0.3, 0.15);
  glide(a.amp.gain, handsVisible ? level : 0, handsVisible ? 0.08 : 0.25);

  // Engine: pitch and brightness rise with speed; louder when you push forward
  const push = Math.max(0, thrustEff);
  glide(a.engine.frequency, 38 + fwdSpeed * 4 + push * 30, 0.08);
  glide(a.engFilter.frequency, 250 + fwdSpeed * 60 + push * 900, 0.08);
  glide(a.engGain.gain, handsVisible ? 0.035 + push * 0.08 : 0, 0.1);
}

// MELT: pitch falls 2.5 octaves over MELT_TIME while the volume collapses to
// near silence; then the sea tone fades back in, quietly.
function meltVoice() {
  const a = audio, t = a.ac.currentTime, T = MELT_TIME;
  const hz = Math.max(40, a.osc1.frequency.value);
  const g0 = Math.max(0.02, a.amp.gain.value);
  for (const p of voiceParams(a)) hold(p, t);

  // Pitch sweep (exponential = even in octaves)
  const end = hz * Math.pow(2, -MELT_OCTAVES);
  a.osc1.frequency.exponentialRampToValueAtTime(end, t + T);
  a.osc2.frequency.exponentialRampToValueAtTime(end, t + T);
  a.sub.frequency.exponentialRampToValueAtTime(end / 2, t + T);
  a.shim.frequency.exponentialRampToValueAtTime(end * 2, t + T);
  a.drone1.frequency.exponentialRampToValueAtTime(end / 2, t + T);   // the father falls with you
  a.drone2.frequency.exponentialRampToValueAtTime(end / 4, t + T);
  a.sunV1.frequency.exponentialRampToValueAtTime(end * 3, t + T);
  a.sunV2.frequency.exponentialRampToValueAtTime(end * 3 * SUN_BEAT, t + T);
  a.sunGain.gain.linearRampToValueAtTime(0, t + T * 0.4);            // the sun lets go first
  a.sunTremDepth.gain.linearRampToValueAtTime(0, t + T * 0.4);
  a.roarGain.gain.linearRampToValueAtTime(0, t + T * 0.6);           // its roar fades behind you
  a.rumbleGain.gain.linearRampToValueAtTime(0, t + T * 1.5);

  // Volume collapse: -12 dB at 1s, ~-30 dB at 1.7s, near silence at 2s
  a.amp.gain.exponentialRampToValueAtTime(g0 * 0.25, t + T * 0.5);
  a.amp.gain.exponentialRampToValueAtTime(g0 * 0.03, t + T * 0.85);
  a.amp.gain.exponentialRampToValueAtTime(0.0006, t + T);

  // Timbre drains away with it
  a.filter.frequency.exponentialRampToValueAtTime(180, t + T);
  a.wet.gain.linearRampToValueAtTime(0, t + T * 0.5);
  a.dry.gain.linearRampToValueAtTime(1, t + T * 0.5);
  a.g2.gain.linearRampToValueAtTime(0, t + T * 0.7);
  a.gShim.gain.linearRampToValueAtTime(0, t + T * 0.3);
  a.vibDepth.gain.linearRampToValueAtTime(0, t + T * 0.3);
  // Engine dies with the melt: pitch sags, level collapses
  a.engine.frequency.exponentialRampToValueAtTime(25, t + T);
  a.engGain.gain.setTargetAtTime(0, t, T / 4);
  // (the hall send stays open so the fall rings out in the big space)

  // The long fall: nothing but wind, rising in level and pitch all the way down
  a.windGain.gain.setValueAtTime(0.0001, t + 0.6);
  a.windGain.gain.exponentialRampToValueAtTime(0.22, t + FALL_TIME - 0.2);
  a.windFilter.frequency.setValueAtTime(250, t + 0.6);
  a.windFilter.frequency.exponentialRampToValueAtTime(1600, t + FALL_TIME - 0.2);
}

// At the water: the wind cuts and the sea tone fades back in, quietly
function seaReturn() {
  const a = audio, ts = a.ac.currentTime;
  for (const p of voiceParams(a)) hold(p, ts);
  a.windGain.gain.setTargetAtTime(0, ts, 0.04);
  const hallNow = a.hallSend.gain.value;
  a.osc1.frequency.setValueAtTime(ROOT_HZ, ts);
  a.osc2.frequency.setValueAtTime(ROOT_HZ, ts);
  a.sub.frequency.setValueAtTime(ROOT_HZ / 2, ts);
  a.shim.frequency.setValueAtTime(ROOT_HZ * 2, ts);
  a.drone1.frequency.setValueAtTime(ROOT_HZ / 2, ts);
  a.drone2.frequency.setValueAtTime(ROOT_HZ / 4, ts);
  a.sunV1.frequency.setValueAtTime(ROOT_HZ * 3, ts);
  a.sunV2.frequency.setValueAtTime(ROOT_HZ * 3 * SUN_BEAT, ts);
  a.droneGain.gain.setValueAtTime(0.35, ts);        // at sea, the father is strongest
  a.sunGain.gain.setValueAtTime(0, ts);
  a.roarGain.gain.setValueAtTime(0, ts); a.rumbleGain.gain.setValueAtTime(0, ts);
  a.osc1.detune.setValueAtTime(4 - FATHER_PULL, ts);
  a.osc2.detune.setValueAtTime(-4 - FATHER_PULL, ts);
  a.shim.detune.setValueAtTime(2 - FATHER_PULL, ts);
  a.filter.frequency.setValueAtTime(260, ts);
  a.filter.Q.setValueAtTime(1.2, ts);
  a.g2.gain.setValueAtTime(0.25, ts);
  a.gSub.gain.setValueAtTime(0.5, ts);
  a.wobblePitch.gain.setValueAtTime(14, ts);
  a.wobbleFilter.gain.setValueAtTime(140, ts);
  a.revSend.gain.setValueAtTime(0.4, ts);
  a.hallSend.gain.setValueAtTime(hallNow, ts);    // big space stays open through the fall
  a.hallSend.gain.linearRampToValueAtTime(0, ts + 1.5);
  a.amp.gain.setValueAtTime(0.0006, ts);
  a.amp.gain.exponentialRampToValueAtTime(SEA_AFTER_GAIN, ts + 2.0);
}

function silence() { glide(audio.amp.gain, 0, 0.15); }

// A whispered syllable for each line of text: a hiss, then a gliding vowel formant,
// filtered noise shaped by short envelopes, with a little reverb.
const VOWELS = [[700, 1200], [400, 2200], [300, 900], [600, 1700], [500, 1000]];
function whisper() {
  if (!audio) return;
  const a = audio, ac = a.ac, t = ac.currentTime;
  const src = ac.createBufferSource();
  src.buffer = a.noiseBuf; src.playbackRate.value = 0.8 + Math.random() * 0.4;
  const hiss = ac.createBiquadFilter(); hiss.type = "highpass"; hiss.frequency.value = 3500;
  const vowel = ac.createBiquadFilter(); vowel.type = "bandpass"; vowel.Q.value = 5;
  const F = VOWELS[(Math.random() * VOWELS.length) | 0];
  vowel.frequency.setValueAtTime(F[0] * 1.4, t + 0.03);
  vowel.frequency.exponentialRampToValueAtTime(F[1], t + 0.28);
  const gH = ac.createGain(), gV = ac.createGain();
  gH.gain.setValueAtTime(0, t);
  gH.gain.linearRampToValueAtTime(0.07, t + 0.015);
  gH.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  gV.gain.setValueAtTime(0.0001, t + 0.03);
  gV.gain.exponentialRampToValueAtTime(0.22, t + 0.08);
  gV.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  src.connect(hiss).connect(gH);
  src.connect(vowel).connect(gV);
  for (const g of [gH, gV]) { g.connect(a.master); g.connect(a.reverb); }
  src.start(t, Math.random() * 1.5);
  src.stop(t + 0.4);
}

// ============================================================
// Flight lifecycle
// ============================================================
function startFlight(now) {
  flight = { start: now };
  flightOrigin = { x: view.x, z: travel, hx: view.hx, hz: view.hz };
  ghostPath = []; lastGhostRec = 0;
}

function startMelt(now) {
  mode = "melt";
  meltStart = now;
  flight.flown = now - flight.start;
  meltSunR = sunRadius();
  meltAlt0 = altitude; meltPitch0 = view.pitch; meltH0 = view.h; meltBurn0 = burnAmt;
  barrel = null; vloop = null;
  meltX0 = view.x; meltZ0 = travel; meltYaw0 = view.yaw; meltHx = view.hx; meltHz = view.hz;
  lie = null; lieTextUntil = 0;       // all text goes silent
  tilt = null; stutterLeft = 0; fallWhispered = false;
  meltVoice();
  // (the hands now rise and cover the camera: see handPose)
}

// fromMelt: the wind cuts and the quiet sea tone plays under the results
async function endFlight(flownMs, fromMelt = false) {
  mode = "results";
  if (fromMelt) seaReturn(); else silence();
  saveGhost(ghostPath);
  ghostPath = [];
  flight = null; flightOrigin = null;
  heat = 0; burnAmt = 0;
  $("flew").textContent = (flownMs / 1000).toFixed(1) + "s";
  $("results").classList.remove("hidden");
}

// ============================================================
// Gyroscope input (DeviceOrientation)
// ============================================================
// beta/gamma are in the device's portrait frame. Turn them into the device "up" vector,
// rotate it into the screen's frame (so sideways works), and read pitch/roll from that.
// gyro.beta = pitch, gyro.gamma = roll (degrees). "Level" is captured from the first
// reading after you tap Reach up (or Fly again).
function onOrientation(e) {
  if (e.beta == null || e.gamma == null) return;
  const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
  const dx = -Math.cos(b) * Math.sin(g), dy = Math.sin(b), dz = Math.cos(b) * Math.cos(g);
  const t = (screen.orientation?.angle ?? window.orientation ?? 0) * Math.PI / 180;
  const ux = dx * Math.cos(t) - dy * Math.sin(t), uy = dx * Math.sin(t) + dy * Math.cos(t), uz = dz;
  const pitch = Math.atan2(uy, uz) * 180 / Math.PI;
  const roll = -Math.asin(clamp(ux, -1, 1)) * 180 / Math.PI;
  gyro.beta = pitch; gyro.gamma = roll; gyro.seen = true;
  if (gyro.calibrate) { gyro.beta0 = pitch; gyro.gamma0 = roll; gyro.calibrate = false; }
}
function recalibrate() { gyro.calibrate = true; }

// iOS needs explicit permission, and only from inside a tap
async function requestMotion() {
  try {
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === "function") {
      const r = await DOE.requestPermission();
      if (r !== "granted") console.warn("Motion permission:", r);
    }
  } catch (e) { console.warn("Motion permission failed", e); }
  window.addEventListener("deviceorientation", onOrientation);
}

// Tilt in degrees → −1..1, with a small dead zone
function shape(deg, range) {
  const a = Math.max(0, Math.abs(deg) - TILT_DEAD) / (range - TILT_DEAD);
  return Math.sign(deg) * clamp(a, 0, 1);
}

// Per frame: phone tilt (or keys on a desktop) → pitch and roll inputs → targets
function readControls(now, dt) {
  let p = 0, r = 0;
  if (gyro.seen && !gyro.calibrate) {
    let db = gyro.beta - gyro.beta0;
    if (db > 180) db -= 360; else if (db < -180) db += 360;   // pitch (atan2) wraps at ±180
    p = PITCH_SIGN * shape(db, PITCH_RANGE);
    r = shape(gyro.gamma - gyro.gamma0, ROLL_RANGE);
  }
  if (keys.has("ArrowUp") || keys.has("w")) p = 1;
  if (keys.has("ArrowDown") || keys.has("s")) p = -1;
  if (keys.has("ArrowLeft") || keys.has("a")) r = -1;
  if (keys.has("ArrowRight") || keys.has("d")) r = 1;
  if (detectFlick(rollHist, now, dt, r)) triggerBarrel(Math.sign(r), now);
  if (detectFlick(pitchHist, now, dt, p) && p > 0) triggerLoop(now);   // top edge flicked toward you
  pitchIn = p; rollIn = r;
  yawTarget = rollIn * YAW_RATE;                 // roll right → turn right
  bankTarget = -rollIn * BANK_MAX;               // (bank > 0 = banked left)
  thrustEff = Math.max(0, -pitchIn);             // diving is thrust
  if (barrelCool > 0) barrelCool -= dt;
}

// A hard, fast flick of the phone sideways: the roll input shoots past BARREL_FLICK,
// quickly, having been near level a moment before → barrel roll that way
function detectFlick(hist, now, dt, r) {
  hist.push([now, r]);
  while (hist.length && hist[0][0] < now - 400) hist.shift();
  const prev = hist.length > 1 ? hist[hist.length - 2][1] : r;
  const rate = (r - prev) / Math.max(dt, 1e-3);
  if (Math.abs(r) < BARREL_FLICK || Math.sign(rate) !== Math.sign(r) || Math.abs(rate) < BARREL_FLICK_RATE) return false;
  const earlier = hist.filter(([t]) => t < now - 180 && t > now - 400);
  if (!earlier.length || earlier.some(([, v]) => Math.abs(v) > BARREL_FLICK_FROM)) return false;
  hist.length = 0;
  return true;
}

addEventListener("keydown", e => {
  keys.add(e.key.length === 1 ? e.key.toLowerCase() : e.key);
  if (e.key === "q") triggerBarrel(-1);
  if (e.key === "e") triggerBarrel(1);
  if (e.key === "l") triggerLoop();
  if (e.key === " ") { e.preventDefault(); triggerBarrel(rollIn < 0 ? -1 : 1); }
});
addEventListener("keyup", e => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
// Double-tap one half of the screen: barrel roll toward that side. Swipe up: loop.
canvas.addEventListener("pointerdown", e => {
  const now = performance.now();
  swipe = { t: now, y: e.clientY };
  if (now - lastTap.t < DOUBLE_TAP && Math.abs(e.clientX - lastTap.x) < 80) {
    triggerBarrel(e.clientX < innerWidth / 2 ? -1 : 1, now);
    lastTap.t = -1e9;
  } else lastTap = { t: now, x: e.clientX };
});
canvas.addEventListener("pointerup", e => {
  const now = performance.now();
  if (swipe && now - swipe.t < SWIPE_MS && swipe.y - e.clientY > SWIPE_MIN) { triggerLoop(now); lastTap.t = -1e9; }
  swipe = null;
});

// Altitude physics: climb rate follows the tilt (with a little lag); gravity sinks you slowly
function updateAltitude(dt) {
  const target = pitchIn * CLIMB_RATE - SINK_RATE;
  altVel += (target - altVel) * (1 - Math.exp(-dt / ALT_TAU));
  altitude += altVel * dt;
  if (altitude <= 0) { altitude = 0; altVel = Math.max(0, altVel); }
  if (altitude >= 1) { altitude = 1; altVel = Math.min(0, altVel); }
}

// ============================================================
// Game logic (per frame)
// ============================================================
function step(now, dt) {
  if (mode === "live") { readControls(now, dt); updateAltitude(dt); }
  else if (mode === "results") { readControls(now, dt); thrustEff = 0; }

  // Always flying forward along the heading: base speed, faster with altitude and when diving.
  // The melt keeps your momentum.
  if (mode !== "melt") {
    const target = (SPEED_BASE + SPEED_ALT * altitude) * (1 + DIVE_GAIN * thrustEff);
    fwdSpeed += (target - fwdSpeed) * (1 - Math.exp(-dt / CAM_TAU));
    // Banking drifts the world sideways (camera slides along -right = (-hz, +hx))
    view.x -= bank * DRIFT * dt * view.hz;
    travel += bank * DRIFT * dt * view.hx;
    view.x += view.hx * fwdSpeed * dt;
    travel += view.hz * fwdSpeed * dt;
  }
  updateGlitch(now, dt);
  updateView(now, dt);                    // (during the long fall it places the camera itself)
  sunAim = sunAimNow();
  updateFigures(dt);
  updateVisor(dt);

  updateRain(dt);
  updateFrags(dt);
  updateEmbers(dt);

  if (mode === "live") {
    spawnWax(dt);
    spawnFeathers(dt);
    spawnFigures(dt);
    recordGhost(now);
    updateLie(now, dt);

    // Heat is nearness: it builds as you close on the sun and fades as you back off.
    // Touch it (full heat) and you melt.
    const near = Math.pow(clamp((HEAT_FAR - sunDist()) / (HEAT_FAR - HEAT_NEAR), 0, 1), 1.4);
    heat += (near - heat) * (1 - Math.exp(-dt / (near > heat ? HEAT_RISE : HEAT_FALL)));
    if (near >= 1) heat = 1;
    burnAmt = heat * BURN_LIVE;

    if (!flight && altitude > SEA_LINE) { startFlight(now); seaSince = 0; }

    if (flight && heat >= 0.995) { startMelt(now); return; }
    // Sank back into the sea and stayed there: the flight is over
    if (flight) {
      if (altitude <= 0.001) {
        if (!seaSince) seaSince = now;
        else if (now - seaSince > SEA_END * 1000) { endFlight(seaSince - flight.start); return; }
      } else seaSince = 0;
    }

    updateVoice(true, dt);
  } else if (mode === "melt") {
    // The hands burn through on the way down: tips first, bone by the time the water's near
    const u = clamp((now - meltStart) / 1000 / (FALL_TIME * BURN_FALL_END), 0, 1);
    burnAmt = lerp(meltBurn0, 1.08, u * u * (3 - 2 * u));
    spawnWax(dt);
    if (now - meltStart > FALL_TIME * 1000) {
      altitude = 0;                   // in the water: cut to the results
      endFlight(flight.flown, true);
    }
  }
}

// ============================================================
// Rendering: black, dots only, sun, horizon
// ============================================================
// ---------- Sun: a fixed place in the world; it grows as you actually get nearer ----------
const sunDist = () => Math.hypot(SUN_X - view.x, SUN_Y - view.h, SUN_Z - travel);
function sunRadius() {
  const byDist = clamp(focal * SUN_WORLD_R / sunDist(), SUN_MIN_R, SUN_MAX_R);
  return lerp(byDist, SUN_MAX_R, heat * 0.3);          // and swells with heat
}

function sunState(now) {
  let r = sunRadius(), flare = heat;
  if (mode === "melt") {
    // Shrinks away; the dive pitches it up and out of the frame
    const u = clamp((now - meltStart) / 1000 / MELT_TIME, 0, 1);
    r = meltSunR * Math.pow(1 - u, 1.6); flare = 1 - u * 0.6;
  }
  const c = sunCam();
  if (c[2] <= 0.05) return { x: 0, y: 0, r: 0, flare, face: 0 };     // behind you
  const [x, y] = toScreen(c);
  // Its face resolves as you near it
  const face = mode === "melt" ? 0 : clamp((r / SUN_FACE_R - FACE_FROM) / (1 - FACE_FROM), 0, 1);
  return { x, y, r, flare, face };
}

// The sun is a fixed point in the world: turn away and it slides off; fly past and it's behind you
function sunCam() { return toCam(SUN_X, SUN_Y, SUN_Z); }

// 1 with the sun dead centre, falling to 0 at AIM_CONE off-centre
function sunAimNow() {
  const c = sunCam();
  if (c[2] <= 0) return 0;
  const off = Math.atan2(Math.hypot(c[0], c[1]), c[2]);
  return clamp(1 - off / AIM_CONE, 0, 1);
}

// ---------- Batched wire drawing ----------
// Every environment line goes into one of WIRE_LEVELS brightness buckets
// (far = dim + 1px, near = bright + 2px) and each bucket is stroked once.
const wrap = (v, m) => ((v % m) + m) % m;
const depthB = (z, far) => Math.pow(clamp(1 - z / far, 0, 1), 1.2);   // depth fade
let wirePaths = [], dotPaths = [];
function beginWire() {
  wirePaths = Array.from({ length: WIRE_LEVELS }, () => new Path2D());
  dotPaths = Array.from({ length: WIRE_LEVELS }, () => new Path2D());
}
// A red dot (for the falling figures), batched by brightness like the lines
function wireDot(x, y, s, b) {
  if (b <= 0.02) return;
  dotPaths[wireLevel(b)].rect(x - s / 2, y - s / 2, s, s);
}
function wireLevel(b) { return Math.round(clamp(b, 0, 1) * (WIRE_LEVELS - 1)); }
function wire(x1, y1, x2, y2, b) {
  if (b <= 0.02) return;
  const p = wirePaths[wireLevel(b)];
  p.moveTo(x1, y1); p.lineTo(x2, y2);
}
function wirePoly(pts, b, closed = false) {
  if (b <= 0.02 || pts.length < 2) return;
  const p = wirePaths[wireLevel(b)];
  p.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]);
  if (closed) p.lineTo(pts[0][0], pts[0][1]);
}
function flushWire() {
  const flick = 0.9 + Math.random() * 0.1;        // slight frame-to-frame flicker
  ctx.strokeStyle = RED;
  for (let i = 0; i < WIRE_LEVELS; i++) {
    const t = i / (WIRE_LEVELS - 1);
    ctx.globalAlpha = (0.12 + 0.88 * t) * flick;
    ctx.lineWidth = 1 + t;                        // 1px far → 2px near
    ctx.stroke(wirePaths[i]);
  }
  ctx.fillStyle = RED;
  for (let i = 0; i < WIRE_LEVELS; i++) {
    ctx.globalAlpha = (0.12 + 0.88 * (i / (WIRE_LEVELS - 1))) * flick;
    ctx.fill(dotPaths[i]);
  }
  ctx.globalAlpha = 1;
}

// Scanlines over the world (not the body): every third row darkened, flickering
let scanPattern = null;
function drawScanlines() {
  if (!scanPattern) {
    const c = document.createElement("canvas");
    c.width = 1; c.height = 3;
    const g = c.getContext("2d");
    g.fillStyle = "#000"; g.fillRect(0, 2, 1, 1);
    scanPattern = ctx.createPattern(c, "repeat");
  }
  ctx.globalAlpha = 0.35 + Math.random() * 0.15;
  ctx.fillStyle = scanPattern;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
}

// ---------- Sun: wireframe sphere, lines warp and jitter with heat ----------
function drawSun(now, s) {
  if (s.r < 2) return;
  const f = s.flare, R = s.r, tilt = 0.4, ct = Math.cos(tilt), st = Math.sin(tilt);
  const spin = now / 5000, tw = now / 110;
  const base = 0.55 + 0.45 * f;
  const P = (lat, lon) => {
    const cl = Math.cos(lat), x = cl * Math.sin(lon), y = Math.sin(lat), z = cl * Math.cos(lon);
    const y2 = y * ct - z * st, z2 = y * st + z * ct;          // axis tilted toward the camera
    const w = 1 + f * (0.08 * Math.sin(lat * 6 + lon * 4 + tw) + 0.04 * Math.sin(lon * 9 - tw * 1.7))
                + f * f * (Math.random() - 0.5) * 0.05;          // warp + jitter
    return [s.x + x * R * w, s.y - y2 * R * w, z2];
  };
  const seg = (a, b) => wire(a[0], a[1], b[0], b[1], a[2] + b[2] > 0 ? base : base * 0.22);  // back half dim
  for (let la = -60; la <= 60; la += 20) {                       // latitudes
    const lat = la * Math.PI / 180;
    let prev = P(lat, spin);
    for (let i = 1; i <= 32; i++) { const q = P(lat, spin + (i / 32) * Math.PI * 2); seg(prev, q); prev = q; }
  }
  for (let k = 0; k < 12; k++) {                                 // longitudes
    const lon = spin + (k / 12) * Math.PI * 2;
    let prev = P(-Math.PI / 2, lon);
    for (let i = 1; i <= 16; i++) { const q = P(-Math.PI / 2 + (i / 16) * Math.PI, lon); seg(prev, q); prev = q; }
  }
  const limb = [];                                               // outline
  for (let i = 0; i <= 40; i++) {
    const a = (i / 40) * Math.PI * 2;
    const w = 1 + f * 0.05 * Math.sin(a * 7 + tw) + f * f * (Math.random() - 0.5) * 0.03;
    limb.push([s.x + Math.cos(a) * R * w, s.y + Math.sin(a) * R * w]);
  }
  wirePoly(limb, Math.min(1, base + 0.15));
  drawCorona(s, now);
  if (s.face > 0.02) drawSunFace(s, now);
}

// The corona: flame tongues off the limb, short and lazy from afar, long and roaring up close
function drawCorona(s, now) {
  const f = s.flare, R = s.r, t = now / 1000;
  const n = Math.round(lerp(14, CORONA_N, f));
  const b = 0.3 + 0.7 * f;
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * Math.PI * 2 + t * 0.15 * (1 + 2 * f);
    // each tongue flickers in length and leans with the spin
    const len = R * (0.06 + 0.5 * f * (0.5 + 0.5 * Math.sin(t * (6 + 9 * f) + i * 1.7)) + 0.04 * Math.random() * f);
    const lean = 0.25 * Math.sin(t * 3 + i) * f;
    const x0 = s.x + Math.cos(a0) * R * 1.01, y0 = s.y + Math.sin(a0) * R * 1.01;
    const x1 = s.x + Math.cos(a0 + lean * 0.5) * (R + len * 0.55), y1 = s.y + Math.sin(a0 + lean * 0.5) * (R + len * 0.55);
    const x2 = s.x + Math.cos(a0 + lean) * (R + len), y2 = s.y + Math.sin(a0 + lean) * (R + len);
    wire(x0, y0, x1, y1, b); wire(x1, y1, x2, y2, b * 0.7);
    if (f > 0.5 && Math.random() < (f - 0.5) * 0.5)              // sparks thrown off the tips
      wireDot(x2 + (Math.random() - 0.5) * 20, y2 + (Math.random() - 0.5) * 20, 2 + Math.random() * 2, b);
  }
}

// The face: eyes, nose, mouth. Far off it's scattered fragments; very close, they pull together.
// With heat the brows come down, the eyes narrow, the mouth opens: it does not want you here.
function drawSunFace(s, now) {
  const R = s.r, a = s.face, f = s.flare, scatter = (1 - a) * R * 0.45, tw = now / 110;
  const J = () => (Math.random() - 0.5) * (scatter + f * f * R * 0.025);
  const P = (u, v) => [s.x + u * R + J(), s.y + v * R + J()];
  const b = 0.25 + 0.75 * a;
  for (const sd of [-1, 1]) {
    const ex = sd * 0.32, eye = [];
    const h = 0.05 + 0.02 * Math.sin(tw * 0.3) - 0.03 * f;         // narrowing
    for (let i = 0; i <= 10; i++) {
      const t = (i / 10) * Math.PI * 2;
      eye.push(P(ex + Math.cos(t) * 0.13, -0.18 + Math.sin(t) * Math.max(0.012, h)));
    }
    wirePoly(eye, b);
    if (f > 0.15) {                                                // brows, angled down toward the nose
      const k = (f - 0.15) / 0.85;
      wirePoly([P(ex - sd * 0.18, -0.34 + 0.02 * k), P(ex + sd * 0.1, -0.32 + 0.1 * k)], b * k);
    }
    if (f > 0.6) wireDot(s.x + ex * R, s.y - 0.18 * R, 3 + 3 * f, b);   // a pupil, fixed on you
  }
  wirePoly([P(0, -0.1), P(0.05, 0.12), P(-0.03, 0.15)], b * 0.8);  // nose
  const open = 0.22 * f * (0.7 + 0.3 * Math.sin(tw * 0.5));         // the mouth opens with heat
  const top = [], bot = [];
  for (let i = 0; i <= 12; i++) {
    const u = -0.3 + (i / 12) * 0.6, e = 1 - (u / 0.3) ** 2;
    top.push(P(u, 0.42 - 0.06 * e - open * 0.25 * e));
    bot.push(P(u, 0.42 - 0.06 * e + open * e));
  }
  wirePoly(top, b);
  if (open > 0.01) {
    wirePoly(bot, b);
    for (let i = 1; i < 12; i += 2) wire(top[i][0], top[i][1], top[i][0], top[i][1] + open * R * 0.4 * (1 - ((i / 12 - 0.5) * 2) ** 2), b * 0.6);   // teeth
  }
}

// ---------- The sun lies: at high heat it briefly duplicates or drifts ----------
function updateLie(now, dt) {
  if (lie && now > lie.end) lie = null;
  const every = lerp(LIE_EVERY, 0.8, clamp((heat - LIE_HEAT) / (1 - LIE_HEAT), 0, 1));
  if (!lie && heat > LIE_HEAT && Math.random() < dt / every) {
    const dur = 700 + Math.random() * 600;
    lie = { start: now, end: now + dur, kind: Math.random() < 0.5 ? "double" : "drift",
            dx: (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.5), dy: (Math.random() - 0.5) * 0.6 };
    lieTextUntil = now + dur + 900;
    whisper();                                        // each line of text gets a whispered syllable
  }
}

// ---------- The renderer fails at high heat ----------
function glitchAmt() { return mode === "live" ? clamp((heat - GLITCH_FROM) / (1 - GLITCH_FROM), 0, 1) : 0; }

function updateGlitch(now, dt) {
  const g = glitchAmt();
  if (tilt && now > tilt.end) tilt = null;
  if (!tilt && g > 0 && Math.random() < g * 0.25 * dt) {
    tilt = { start: now, end: now + 600 + Math.random() * 600, amt: (Math.random() < 0.5 ? -1 : 1) * (0.1 + 0.25 * g) };
  }
  if (mode !== "live") tilt = null;
}
function tiltNow(now) {
  if (!tilt) return 0;
  return tilt.amt * Math.sin(clamp((now - tilt.start) / (tilt.end - tilt.start), 0, 1) * Math.PI);
}
// Tear: shift a few horizontal bands of the frame sideways
function tearFrame() {
  const g = glitchAmt();
  if (g <= 0 || Math.random() > g * 0.25) return;
  const n = 1 + ((Math.random() * 3 * g) | 0);
  for (let i = 0; i < n; i++) {
    const y = Math.random() * H, h = 4 + Math.random() * 50 * g, dx = (Math.random() - 0.5) * 160 * g;
    ctx.drawImage(canvas, 0, y, W, h, dx, y, W, h);
  }
}
// Text flickers into Greek letters
function glitchText(s) {
  const g = glitchAmt();
  if (g <= 0) return s;
  return [...s].map(c => (c !== " " && Math.random() < g * 0.3 ? GREEK[(Math.random() * GREEK.length) | 0] : c)).join("");
}

// ---------- Wax on the visor: drops land, stick, slip down; the view behind them blurs red ----------
function updateVisor(dt) {
  if (mode === "live" && heat > VISOR_FROM && visorDrops.length < VISOR_CAP &&
      Math.random() < heat * heat * VISOR_RATE * dt) {
    visorDrops.push({
      x: Math.random() * W, y: Math.random() * H * 0.85,
      r: (8 + Math.random() * 18) * (0.6 + heat * 0.6), vy: 0, stick: 0.3 + Math.random() * 1.5, trail: [],
    });
  }
  for (const d of visorDrops) {
    if (mode === "melt") d.vy += 2500 * dt;           // the fall clears them
    else {
      d.stick -= dt;
      if (d.stick <= 0) { d.vy = 20 + Math.random() * 70 * (d.r / 20); d.stick = 0.3 + Math.random() * 1.2; }   // slip
      else d.vy *= 1 - 3 * dt;                                                                                 // stick
    }
    d.y += d.vy * dt;
    const last = d.trail[d.trail.length - 1];
    if (d.vy > 5 && (!last || d.y - last[1] > d.r * 0.6)) { d.trail.push([d.x, d.y - d.r * 0.4]); if (d.trail.length > 6) d.trail.shift(); }
  }
  visorDrops = visorDrops.filter(d => d.y - d.r < H + 40);
}

function drawVisor() {
  if (!visorDrops.length) return;
  // Blur = a scaled-down copy of the frame, drawn back up inside the drops (cheap on phones)
  const f = Math.round(lerp(6, 14, heat)), bw = Math.ceil(W / f), bh = Math.ceil(H / f);
  if (!blurCanvas) { blurCanvas = document.createElement("canvas"); blurCtx = blurCanvas.getContext("2d"); }
  if (blurCanvas.width !== bw || blurCanvas.height !== bh) { blurCanvas.width = bw; blurCanvas.height = bh; }
  blurCtx.imageSmoothingEnabled = true; blurCtx.imageSmoothingQuality = "high";
  blurCtx.drawImage(canvas, 0, 0, bw, bh);

  const clip = new Path2D();
  for (const d of visorDrops) {
    clip.moveTo(d.x + d.r, d.y); clip.ellipse(d.x, d.y, d.r, d.r * 1.15, 0, 0, Math.PI * 2);
    d.trail.forEach(([tx, ty], i) => {
      const tr = d.r * 0.25 * (i + 1) / d.trail.length;
      clip.moveTo(tx + tr, ty); clip.ellipse(tx, ty, tr, tr * 1.3, 0, 0, Math.PI * 2);
    });
  }
  ctx.save();
  ctx.clip(clip);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(blurCanvas, 0, 0, bw, bh, -6, 10, W + 12, H + 12);   // slight lens shift / magnify
  ctx.fillStyle = `rgba(255, 70, 20, ${0.18 + 0.25 * heat})`;          // red-orange tint
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  // A thin bright rim on the upper edge of each drop
  ctx.strokeStyle = "rgba(255, 150, 90, 0.45)"; ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (const d of visorDrops) {
    const a0 = Math.PI * 1.15;
    ctx.moveTo(d.x + Math.cos(a0) * d.r, d.y + Math.sin(a0) * d.r * 1.15);
    ctx.ellipse(d.x, d.y, d.r, d.r * 1.15, 0, a0, Math.PI * 1.85);
  }
  ctx.stroke();
}

// ---------- Greek rain: falling columns behind the world ----------
// Sparse and slow at sea; denser and faster with altitude and heat; near the sun the
// letters glitch into Latin and symbols. Each column has a depth: size + brightness.
const RAIN_SIZES = [11, 15, 21];
function rainDensity() { return mode === "melt" ? 0.6 : clamp(altitude * 0.6 + heat * 0.6, 0, 1); }
function sunGlitch() { return heat * (0.4 + 0.6 * sunAim) * 0.7; }
function rainChar() {
  return Math.random() < sunGlitch() ? LATIN[(Math.random() * LATIN.length) | 0] : GREEK[(Math.random() * GREEK.length) | 0];
}
function newColumn(anywhere) {
  const d = (Math.random() * 3) | 0, size = RAIN_SIZES[d];
  const len = 6 + ((Math.random() * 12) | 0);
  return {
    x: Math.round((Math.random() * W) / 18) * 18 + 9, y: anywhere ? Math.random() * H : -Math.random() * 300,
    d, size, alpha: [0.06, 0.11, 0.18][d], v: [45, 75, 115][d] * (0.8 + Math.random() * 0.4),
    chars: Array.from({ length: len }, rainChar), t: 0, swap: 0.1 + Math.random() * 0.3,
  };
}
function updateRain(dt) {
  const dens = rainDensity(), want = Math.round(lerp(RAIN_MIN, RAIN_MAX, dens)), speed = 1 + dens * 3;
  if (!rain.length) for (let i = 0; i < want; i++) rain.push(newColumn(true));
  while (rain.length < want) rain.push(newColumn(false));
  for (const c of rain) {
    c.y += c.v * speed * dt;
    c.t += dt;
    if (c.t > c.swap) {                                   // characters keep changing
      c.t = 0; c.swap = (0.05 + Math.random() * 0.3) / (1 + dens * 2);
      c.chars[(Math.random() * c.chars.length) | 0] = rainChar();
    }
  }
  // Columns that leave the bottom start again at the top, or retire if there are too many
  rain = rain.filter(c => {
    if (c.y - c.chars.length * c.size < H) return true;
    if (rain.length > want) return false;
    Object.assign(c, newColumn(false));
    return true;
  });
}
function drawRain() {
  ctx.save();
  ctx.fillStyle = RED;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const g = sunGlitch();
  for (let d = 0; d < RAIN_SIZES.length; d++) {          // one font per depth layer
    ctx.font = `${RAIN_SIZES[d]}px system-ui, sans-serif`;
    for (const c of rain) {
      if (c.d !== d) continue;
      for (let i = 0; i < c.chars.length; i++) {
        const y = c.y - i * c.size;
        if (y < -c.size || y > H + c.size) continue;
        ctx.globalAlpha = c.alpha * (i === 0 ? 2.2 : 1 - i / c.chars.length);   // bright head, fading tail
        const ch = g > 0 && Math.random() < g * 0.15 ? LATIN[(Math.random() * LATIN.length) | 0] : c.chars[i];
        ctx.fillText(ch, c.x, y);
      }
    }
  }
  ctx.restore();
}

// ---------- The body: two wireframe hands at the lower corners ----------
// Built in hand-local space (right hand; y along the fingers, x across with the thumb at −x,
// z forward), then posed and projected. Every line is either FLESH (red outline) or BONE
// (white-red centre line). Flesh burns off from the fingertips as heat rises.
const FINGERS = [   // knuckle position, splay, segment lengths, half-width
  { x: -0.17,  y: 0.56, splay: -0.10, len: [0.25, 0.15, 0.11],  w: 0.045 },   // index
  { x: -0.055, y: 0.58, splay: -0.02, len: [0.28, 0.17, 0.12],  w: 0.047 },   // middle
  { x: 0.06,   y: 0.56, splay: 0.06,  len: [0.26, 0.16, 0.115], w: 0.044 },   // ring
  { x: 0.165,  y: 0.51, splay: 0.15,  len: [0.20, 0.125, 0.10], w: 0.038 },   // pinky
];
const THUMB = { x: -0.19, y: 0.14, splay: -0.75, len: [0.20, 0.15, 0.12], w: 0.05 };
const smooth01 = v => v * v * (3 - 2 * v);

// Where each hand is and how it's held this frame. side: −1 left, +1 right.
function handPose(now, side) {
  const t = now / 1000;
  const sp = clamp((fwdSpeed - SPEED_BASE) / (SPEED_ALT + SPEED_BASE), 0, 1);
  let cover = 0, drop = 0;
  if (mode === "melt") {                                // CRASH: up over the camera, then away
    const ft = (now - meltStart) / 1000;
    drop = clamp((ft - COVER_OUT_AT) / COVER_OUT, 0, 1);
    cover = smooth01(clamp(ft / COVER_IN, 0, 1));
  }
  const trem = heat * heat * 0.008 + (mode === "melt" ? 0.004 : 0);
  const base = [side * HAND_BASE[0], HAND_BASE[1], HAND_BASE[2]];
  base[1] += 0.012 * Math.sin(t * 1.3 + side * 0.4);                         // breathing
  base[1] += 0.06 * clamp((altitude - SEA_LINE) / (1 - SEA_LINE), 0, 1);      // reaching higher as you climb
  base[2] -= 0.05 * heat;                                                     // drawn toward the sun
  base[0] += Math.sin(t * 0.8 + side * 2) * 0.01 * (1 + 2 * sp) + side * 0.03 * sp;   // drift with speed
  base[1] += Math.sin(t * 1.1 + side) * 0.008 * (1 + 2 * sp) - 0.04 * sp + (Math.random() - 0.5) * 0.004 * sp;
  base[1] += -side * bank * 0.22;                     // bank left (bank > 0) raises the left hand
  base[0] += (Math.random() - 0.5) * trem; base[1] += (Math.random() - 0.5) * trem;   // trembling with heat
  const cb = [side * 0.16, -0.02, 0.45];
  const b = base.map((v, i) => lerp(v, cb[i], cover));
  b[1] -= drop * drop * 1.4;                          // ...they drop away just before the water
  return {
    base: b,
    pitch: lerp(HAND_PITCH + 0.03 * Math.sin(t * 1.3), 0.05, cover),
    roll: lerp(side * HAND_INWARD, side * 0.1, cover) - bank * 0.35 * (1 - cover),
    splay: lerp(1 + 0.08 * Math.sin(t * 0.6 + side), 3.2, cover),   // fingers spread to see through
    // each finger flexes on its own slow phase; the pinky and ring curl a little more
    curl: (j, fi) => lerp((0.2 + 0.09 * Math.sin(t * (0.8 + fi * 0.13) + fi * 1.9 + side) + 0.04 * (fi === 3 ? 1 : fi === 2 ? 0.5 : 0))
                          * [0.8, 1, 0.7][j], 0, cover),
  };
}

// All segments of one hand in camera space: { a, b, burn, bone, id }, plus fingertip points
function buildHand(side, P) {
  const segs = [], tips = [];
  let id = 0;
  const S = HAND_SCALE, cp = Math.cos(P.pitch), spn = Math.sin(P.pitch), cr = Math.cos(P.roll), sr = Math.sin(P.roll);
  const X = (x, y, z) => {
    x *= side * S; y *= S; z *= S;
    const y1 = y * cp - z * spn, z1 = y * spn + z * cp;           // fingers tipped forward
    return [x * cr - y1 * sr + P.base[0], x * sr + y1 * cr + P.base[1], z1 + P.base[2]];
  };
  const add = (a, b, u, bone) => segs.push({ a: X(...a), b: X(...b), burn: lerp(BURN_TIP, BURN_WRIST, u), bone, id: side * 1000 + id++ });
  const F = (a, b, u) => add(a, b, u, false), B = (a, b, u) => add(a, b, u, true);
  const palmZ = x => 0.06 * (x / 0.2) ** 2;                        // slight cup across the palm
  const L3 = (p, q, t) => [lerp(p[0], q[0], t), lerp(p[1], q[1], t), lerp(p[2], q[2], t)];

  // Each phalanx is drawn as SUB curved pieces: the bend is spread along it, the width tapers
  // smoothly, and the flesh outline is a soft curve rather than a jointed stick.
  const SUB = 3;
  const chain = (fg, fi, isThumb) => {
    const splay = fg.splay * P.splay;
    const dx = Math.sin(splay), dy = Math.cos(splay);             // along the finger
    const sx = Math.cos(splay), sy = -Math.sin(splay);            // across it
    const off = (p, w, z = 0) => [p[0] + sx * w, p[1] + sy * w, p[2] + z];
    let p = [fg.x, fg.y, palmZ(fg.x)], ang = isThumb ? 0.35 : 0;
    const u0 = isThumb ? 0.05 : 0;
    for (let j = 0; j < 3; j++) {
      const curl = P.curl(j, fi), Ln = fg.len[j];
      const w0 = fg.w * (1 - 0.12 * j), w1 = fg.w * (1 - 0.12 * (j + 1));
      const u = u0 + (2 - j) * 0.13;                               // fingertips burn first
      const p0 = p, a0 = ang;
      F(off(p, -w0 * 0.7, -0.01), off(p, w0 * 0.7, -0.01), u + 0.03);   // joint crease
      for (let s = 0; s < SUB; s++) {
        ang = a0 + curl * (s + 1) / SUB;                             // the bend spreads along the phalanx
        const L = Ln / SUB, ws = lerp(w0, w1, s / SUB), we = lerp(w0, w1, (s + 1) / SUB);
        const pad = 1 + 0.12 * Math.sin(((s + 0.5) / SUB) * Math.PI) * (j === 2 ? 1 : 0.5);   // a little fullness
        const q = [p[0] + dx * Math.cos(ang) * L, p[1] + dy * Math.cos(ang) * L, p[2] + Math.sin(ang) * L];
        F(off(p, -ws * pad), off(q, -we * pad), u + 0.02 * s);     // flesh: both sides
        F(off(p, ws * pad), off(q, we * pad), u + 0.02 * s);
        p = q;
      }
      const q = p;
      B(L3(p0, q, 0.12), L3(p0, q, 0.88), u);                      // bone, with a gap at each joint
      const jr = w0 * 0.35;                                        // joint: a small diamond
      B([p0[0] - jr, p0[1], p0[2]], [p0[0], p0[1] + jr, p0[2]], u); B([p0[0], p0[1] + jr, p0[2]], [p0[0] + jr, p0[1], p0[2]], u);
      B([p0[0] + jr, p0[1], p0[2]], [p0[0], p0[1] - jr, p0[2]], u); B([p0[0], p0[1] - jr, p0[2]], [p0[0] - jr, p0[1], p0[2]], u);
      if (j === 2) {
        // fingertip: a rounded cap of three pieces
        const ex = dx * Math.cos(ang), ey = dy * Math.cos(ang), ez = Math.sin(ang);
        const tc = [q[0] + ex * w1 * 0.9, q[1] + ey * w1 * 0.9, q[2] + ez * w1 * 0.9];
        const t1 = [q[0] + ex * w1 * 0.6 - sx * w1 * 0.7, q[1] + ey * w1 * 0.6 - sy * w1 * 0.7, q[2] + ez * w1 * 0.6];
        const t2 = [q[0] + ex * w1 * 0.6 + sx * w1 * 0.7, q[1] + ey * w1 * 0.6 + sy * w1 * 0.7, q[2] + ez * w1 * 0.6];
        F(off(q, -w1), t1, u); F(t1, tc, u); F(tc, t2, u); F(t2, off(q, w1), u);
        const n0 = L3(p0, q, 0.5);                                 // fingernail, on the back
        F(off(n0, -w1 * 0.55, -0.012), off(q, -w1 * 0.5, -0.012), u);
        F(off(n0, w1 * 0.55, -0.012), off(q, w1 * 0.5, -0.012), u);
        F(off(n0, -w1 * 0.55, -0.012), off(n0, w1 * 0.55, -0.012), u);
        tips.push(X(...tc));
      }
    }
  };
  FINGERS.forEach((fg, i) => chain(fg, i, false));
  chain(THUMB, 4, true);

  // Palm: knuckle ridge, sides, thumb web, wrist, forearm (flesh)
  const P3 = (x, y, dz = 0) => [x, y, palmZ(x) + dz];
  const kn = FINGERS.map(f => P3(f.x, f.y, -0.02));
  for (let i = 1; i < kn.length; i++) {                            // knuckle ridge: a gentle arch between each pair
    const m = L3(kn[i - 1], kn[i], 0.5); m[1] += 0.012;
    F(kn[i - 1], m, 0.42); F(m, kn[i], 0.42);
  }
  // the outline, as short pieces so it reads as a curve
  const outline = (pts, u) => { for (let i = 1; i < pts.length; i++) F(pts[i - 1], pts[i], u + (i / pts.length) * 0.1); };
  outline([kn[3], P3(0.21, 0.5), P3(0.215, 0.38), P3(0.205, 0.24), P3(0.19, 0.12), P3(0.175, 0.04), P3(0.17, 0)], 0.5);          // pinky side
  outline([kn[0], P3(-0.215, 0.5), P3(-0.218, 0.4), P3(-0.205, 0.27)], 0.5);                                                    // index side
  outline([P3(-0.205, 0.27), P3(-0.2, 0.2), P3(THUMB.x + 0.02, THUMB.y + 0.1)], 0.6);                                          // thumb web
  outline([P3(THUMB.x - 0.02, THUMB.y - 0.02), P3(-0.2, 0.06), P3(-0.17, 0)], 0.75);                                          // heel of the thumb
  F(P3(-0.17, 0), P3(0.17, 0), 0.82);                              // wrist crease
  F(P3(-0.17, 0), [-0.21, -0.45, 0.02], 0.92); F(P3(0.17, 0), [0.22, -0.45, 0.02], 0.92);   // forearm
  // Palm bones: metacarpals, the thumb's, a ring of carpals, radius and ulna
  const carp = [-0.09, -0.03, 0.03, 0.09];
  FINGERS.forEach((f, i) => B(P3(carp[i], 0.11), P3(f.x, f.y - 0.03), 0.45));
  B(P3(THUMB.x + 0.07, 0.05), P3(THUMB.x, THUMB.y), 0.5);
  for (let i = 0; i < 6; i++) {
    const a1 = (i / 6) * Math.PI * 2, a2 = ((i + 1) / 6) * Math.PI * 2;
    B([Math.cos(a1) * 0.08, 0.05 + Math.sin(a1) * 0.035, 0], [Math.cos(a2) * 0.08, 0.05 + Math.sin(a2) * 0.035, 0], 0.8);
  }
  B([-0.07, 0, 0], [-0.1, -0.45, 0.02], 0.95); B([0.07, 0, 0], [0.1, -0.45, 0.02], 0.95);
  return { segs, tips };
}

// Burnt flesh breaks into two glowing pieces that tumble away (screen space)
function spawnFrag(a, b) {
  for (let k = 0; k < 2 && frags.length < FRAG_CAP; k++) {
    const x1 = lerp(a[0], b[0], k / 2), y1 = lerp(a[1], b[1], k / 2), x2 = lerp(a[0], b[0], (k + 1) / 2), y2 = lerp(a[1], b[1], (k + 1) / 2);
    frags.push({ cx: (x1 + x2) / 2, cy: (y1 + y2) / 2, hx: (x2 - x1) / 2, hy: (y2 - y1) / 2,
                 vx: (Math.random() - 0.5) * 70, vy: -20 - Math.random() * 50, spin: (Math.random() - 0.5) * 8,
                 life: 0, max: 0.8 + Math.random() * 0.8 });
  }
}
function updateFrags(dt) {
  frags = frags.filter(f => {
    f.life += dt;
    f.vy += 260 * dt; f.cx += f.vx * dt; f.cy += f.vy * dt;
    const c = Math.cos(f.spin * dt), s = Math.sin(f.spin * dt), hx = f.hx;
    f.hx = hx * c - f.hy * s; f.hy = hx * s + f.hy * c;
    return f.life < f.max;
  });
}

// Project, burn and draw both hands, then the falling fragments
function drawBody(now) {
  const fleshP = Array.from({ length: WIRE_LEVELS }, () => new Path2D());
  const boneP = Array.from({ length: WIRE_LEVELS }, () => new Path2D());
  const charP = new Path2D();
  const proj = c => { const z = Math.max(0.2, c[2]); return [W / 2 + c[0] * FOCAL / z, H / 2 - c[1] * FOCAL / z, z]; };
  const depth = z => clamp(1.15 - (z - 0.7) * 0.9, 0.3, 1);      // depth fade, like the world
  const lvl = b => Math.round(clamp(b, 0, 1) * (WIRE_LEVELS - 1));
  handTips = []; handPtsScreen = [];
  for (const side of [-1, 1]) {
    const { segs, tips } = buildHand(side, handPose(now, side));
    for (const tp of tips) { const s = proj(tp); handTips.push({ x: s[0], y: s[1] }); }
    for (const sg of segs) {
      const a = proj(sg.a), b = proj(sg.b), d = depth((a[2] + b[2]) / 2), f = burnAmt - sg.burn;
      if (sg.bone) {                                  // bones show where the flesh has gone
        const reveal = clamp((f + 0.06) / 0.12, 0, 1);
        if (reveal <= 0.02) continue;
        const p = boneP[lvl(d * reveal)]; p.moveTo(a[0], a[1]); p.lineTo(b[0], b[1]);
        continue;
      }
      if (f >= 0) {                                   // burnt away
        if (!burnt.has(sg.id)) { burnt.add(sg.id); spawnFrag(a, b); }
        continue;
      }
      if (f < -0.12) burnt.delete(sg.id);             // cooled: the flesh grows back
      if (f > -0.08) {                                // charring: flickers and darkens first, sparks lift off
        const k = (f + 0.08) / 0.08;
        if (embers.length < EMBER_CAP && Math.random() < k * 0.35) {
          const u = Math.random();
          embers.push({ x: lerp(a[0], b[0], u), y: lerp(a[1], b[1], u), vx: (Math.random() - 0.5) * 30,
                        vy: -40 - Math.random() * 70, life: 0, max: 0.5 + Math.random() * 0.8, s: 1.5 + Math.random() * 1.5 });
        }
        if (Math.random() < k * 0.5) continue;
        charP.moveTo(a[0], a[1]); charP.lineTo(b[0], b[1]);
        continue;
      }
      const p = fleshP[lvl(d)]; p.moveTo(a[0], a[1]); p.lineTo(b[0], b[1]);
      if (Math.random() < 0.04) handPtsScreen.push({ x: a[0], y: a[1] });
    }
  }
  ctx.save();
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  // a soft glow under the flesh lines, warmer with heat
  ctx.strokeStyle = heat > 0.3 ? `rgba(255, ${Math.round(90 - 60 * heat)}, 20, ${0.14 + 0.1 * heat})` : HAND_GLOW;
  ctx.lineWidth = 5;
  for (let i = 0; i < WIRE_LEVELS; i++) { ctx.globalAlpha = 0.3 + 0.7 * (i / (WIRE_LEVELS - 1)); ctx.stroke(fleshP[i]); }
  for (let i = 0; i < WIRE_LEVELS; i++) {
    const t = i / (WIRE_LEVELS - 1);
    ctx.lineWidth = 1 + t * 1.2;
    ctx.globalAlpha = 0.2 + 0.8 * t;
    ctx.strokeStyle = RED; ctx.stroke(fleshP[i]);
    ctx.strokeStyle = BONE; ctx.stroke(boneP[i]);
  }
  ctx.globalAlpha = 0.55 + Math.random() * 0.4;
  ctx.lineWidth = 1.6; ctx.strokeStyle = CHAR; ctx.stroke(charP);
  ctx.strokeStyle = CHAR; ctx.lineWidth = 1.4;
  for (const f of frags) {                            // flakes of burnt flesh, cooling as they fall
    ctx.globalAlpha = 1 - f.life / f.max;
    ctx.beginPath(); ctx.moveTo(f.cx - f.hx, f.cy - f.hy); ctx.lineTo(f.cx + f.hx, f.cy + f.hy); ctx.stroke();
  }
  for (const e of embers) {                           // sparks, orange to red as they rise and die
    const k = e.life / e.max;
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = k < 0.4 ? "rgb(255, 180, 60)" : k < 0.7 ? CHAR : RED;
    ctx.fillRect(e.x - e.s / 2, e.y - e.s / 2, e.s, e.s);
  }
  ctx.restore();
}
function updateEmbers(dt) {
  embers = embers.filter(e => {
    e.life += dt; e.x += e.vx * dt + Math.sin(e.life * 9) * 12 * dt; e.y += e.vy * dt; e.vy *= 1 - 0.8 * dt;
    return e.life < e.max;
  });
}

// Hard turns and dives shed a few feathers off the hands
function spawnFeathers(dt) {
  if (!handPtsScreen.length || feathers.length >= FEATHER_CAP) return;
  const rate = Math.max(0, Math.abs(yawRate) - 0.5) * 4 + thrustEff * 2 + barrelNow() * 10;
  if (Math.random() >= rate * dt) return;
  const p = handPtsScreen[(Math.random() * handPtsScreen.length) | 0];
  feathers.push({
    x: p.x, y: p.y, vx: -yawRate * 120 + (Math.random() - 0.5) * 40, vy: -20 + Math.random() * 30,
    ph: Math.random() * 6.28, life: 0, max: 1.4 + Math.random() * 1.2, size: 1.4 + Math.random() * 1.2,
  });
}
function drawSunWithLies(now, sun) {
  if (!lie || sun.r < 2) { drawSun(now, sun); return; }
  const u = clamp((now - lie.start) / (lie.end - lie.start), 0, 1), env = Math.sin(u * Math.PI);
  if (lie.kind === "double") {
    drawSun(now, sun);
    drawSun(now, { ...sun, x: sun.x + lie.dx * sun.r * 1.4 * env, y: sun.y + lie.dy * sun.r * env, face: 0 });
  } else {
    drawSun(now, { ...sun, x: sun.x + lie.dx * sun.r * 1.2 * env, y: sun.y + lie.dy * sun.r * env });
  }
}

// One line of text on the canvas (so it's in the saved video)
function caption(text, a, y = H * 0.42) {
  if (a <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.fillStyle = RED;
  ctx.font = "300 34px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(glitchText(text), W / 2, y);
  ctx.restore();
}

// ---------- The ones before you: dot figures falling past; some climb beside you first ----------
function spawnFigures(dt) {
  const rate = lerp(FIG_RATE_LOW, FIG_RATE_HIGH, altitude * altitude);
  if (figures.length >= FIG_MAX || Math.random() >= rate * dt) return;
  const f = { t: 0, seed: Math.random() * 10, dropped: false };
  if (Math.random() < FIG_CLIMBER) {        // still climbing beside you, for a few seconds
    place(f, 3 + Math.random() * 3, side() * (2.5 + Math.random() * 1.5));
    f.y = view.h + 0.3 + Math.random() * 0.6; f.vy = 0.4; f.climb = 3 + Math.random() * 2;
    f.ang = 0; f.spin = 0;
  } else {                                  // falling from above, tumbling
    place(f, 8 + Math.random() * 16, side() * (1.5 + Math.random() * 8));
    f.y = view.h + 7 + Math.random() * 4; f.vy = -1 - Math.random() * 2; f.climb = 0;
    f.ang = Math.random() * 6.28; f.spin = (Math.random() - 0.5) * 4;
  }
  figures.push(f);
}

function updateFigures(dt) {
  figures = figures.filter(f => {
    f.t += dt;
    if (f.climb > 0 && f.t < f.climb && mode === "live") {
      f.x += view.hx * fwdSpeed * dt; f.z += view.hz * fwdSpeed * dt;   // keeps pace with you
      f.y += f.vy * dt;
    } else {
      if (f.climb > 0 && !f.dropped) { f.dropped = true; f.vy = 0; f.spin = (Math.random() - 0.5) * 3; }
      f.vy -= FIG_GRAVITY * dt; f.y += f.vy * dt; f.ang += f.spin * dt;
    }
    return f.y > -3 && f.t < 30;
  });
}

// A body like yours was: head ring, torso, arms out, legs, as (u across, v up) points
function figurePoints(f) {
  const climbing = f.climb > 0 && !f.dropped;
  const armLift = climbing ? Math.sin(f.t * 9) * 0.35 : 0.4 + Math.sin(f.t * 13 + f.seed) * 0.25;
  const P = [];
  for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; P.push([Math.cos(a) * 0.14, 1.62 + Math.sin(a) * 0.14]); }
  for (let i = 0; i <= 3; i++) P.push([0, 1.45 - i * 0.22]);
  for (const sd of [-1, 1]) {
    for (let i = 1; i <= 4; i++) P.push([sd * 0.2 * i, 1.38 + armLift * (i / 4)]);
    for (let i = 1; i <= 4; i++) P.push([sd * 0.07 * i, 0.8 - 0.2 * i]);
  }
  return P;
}

function drawFigures() {
  const rx = view.hz, rz = -view.hx;                 // billboard: faces you
  for (const f of figures) {
    const ca = Math.cos(f.ang), sa = Math.sin(f.ang);
    for (const [u, v] of figurePoints(f)) {
      const vv = v - 0.9, ur = u * ca - vv * sa, vr = u * sa + vv * ca;   // tumble about the waist
      const c = toCam(f.x + rx * ur, f.y + vr, f.z + rz * ur);
      if (c[2] < NEAR) continue;
      const [sx, sy] = toScreen(c);
      wireDot(sx, sy, clamp(60 / c[2], 1.5, 7), 0.15 + 0.85 * depthB(c[2], VIEW_FAR * 1.3));
    }
  }
}

// ---------- Your ghosts: past flights as faint trails in world space ----------
function loadGhosts() {
  try {
    const g = JSON.parse(localStorage.getItem(GHOST_KEY) || "[]");
    return Array.isArray(g) ? g.filter(p => Array.isArray(p) && p.length >= 6).slice(-GHOST_MAX) : [];
  } catch (e) { console.warn("Couldn't read ghosts", e); return []; }
}
function saveGhost(path) {
  if (path.length < 6) return;
  ghosts.push(path);
  while (ghosts.length > GHOST_MAX) ghosts.shift();
  try { localStorage.setItem(GHOST_KEY, JSON.stringify(ghosts)); }
  catch (e) { console.warn("Couldn't save ghosts", e); }
}
// A few points per second, relative to where (and which way) this flight took off
function recordGhost(now) {
  if (!flight || !flightOrigin || now - lastGhostRec < GHOST_STEP || ghostPath.length >= GHOST_POINTS * 3) return;
  lastGhostRec = now;
  const o = flightOrigin, dx = view.x - o.x, dz = travel - o.z;
  const r2 = v => Math.round(v * 100) / 100;
  ghostPath.push(r2(dx * o.hx + dz * o.hz), r2(dx * o.hz - dz * o.hx), r2(view.h));
}
function drawGhosts() {
  if (!ghosts.length) return;
  // Laid out from this flight's take-off; before take-off, from where you are now
  const o = flightOrigin || { x: view.x, z: travel, hx: view.hx, hz: view.hz };
  const far = VIEW_FAR * 1.3;
  ghosts.forEach((g, gi) => {
    const age = 0.45 + 0.55 * ((gi + 1) / ghosts.length);     // older flights fainter
    let px = 0, pz = 0, py = 0, has = false;
    for (let i = 0; i + 2 < g.length; i += 3) {
      const f = g[i], l = g[i + 1];
      const x = o.x + o.hx * f + o.hz * l, z = o.z + o.hz * f - o.hx * l, y = g[i + 2];
      if (has) {
        const mx = (x + px) / 2, mz = (z + pz) / 2;
        const d = Math.hypot(mx - view.x, mz - travel);
        if (d < far && (vloop || fwdOf(mx, mz) > -2)) seg3(px, py, pz, x, y, z, 0.22 * age * (0.3 + 0.7 * depthB(d, far)));
      }
      px = x; pz = z; py = y; has = true;
    }
  });
}

// ---------- The father: a tiny wire figure on the ground; shrinks as you climb ----------
// A standing wire figure on the ground at (fx, fz), facing you, scaled by sc
function drawStanding(fx, fz, sc, b) {
  const rx = view.hz, rz = -view.hx;
  const L = (u1, v1, u2, v2) => seg3(fx + rx * u1 * sc, v1 * sc, fz + rz * u1 * sc, fx + rx * u2 * sc, v2 * sc, fz + rz * u2 * sc, b);
  for (let i = 0; i < 6; i++) {                     // head, tipped back a little: looking up
    const a1 = (i / 6) * Math.PI * 2, a2 = ((i + 1) / 6) * Math.PI * 2;
    L(Math.cos(a1) * 0.09, 1.0 + Math.sin(a1) * 0.09, Math.cos(a2) * 0.09, 1.0 + Math.sin(a2) * 0.09);
  }
  L(0, 0.9, 0, 0.5);                                 // body
  L(0, 0.82, -0.18, 0.58); L(0, 0.82, 0.18, 0.58);   // arms at his sides
  L(0, 0.5, -0.1, 0); L(0, 0.5, 0.1, 0);             // legs
}

function drawFather() {
  const sky = clamp((viewAlt - SEA_LINE) / (1 - SEA_LINE), 0, 1);
  const sc = mode === "melt" ? 1 : lerp(1, 0.4, sky);
  const fx = father.x, fz = father.z;
  const d = Math.hypot(fx - view.x, fz - travel);
  const b = 0.35 + 0.6 * depthB(d, VIEW_FAR * 1.5);
  drawStanding(fx, fz, sc, b);
  if (mode === "melt") {                             // standing on a rock in the sea
    const rock = [];
    for (let i = 0; i <= 9; i++) {
      const a = (i / 9) * Math.PI * 2, r = 0.7 + 0.2 * Math.sin(i * 2.7);
      rock.push([fx + Math.cos(a) * r, 0.05, fz + Math.sin(a) * r]);
    }
    for (let i = 1; i < rock.length; i++) seg3(...rock[i - 1], ...rock[i], b * 0.8);
  }
}

// ---------- The sea, rushing up during the long fall ----------
function drawSea(now, amt) {
  const t = now / 1000;
  const cx = Math.round(father.x / SEA_SPACING) * SEA_SPACING, cz = Math.round(father.z / SEA_SPACING) * SEA_SPACING;
  const step = 6, far = SEA_HALF * 1.2;
  for (let k = 0; k < SEA_LINES; k++) {
    const z = cz - SEA_HALF + k * SEA_SPACING;
    let px = 0, py = 0, has = false;
    for (let x = cx - SEA_HALF; x <= cx + SEA_HALF; x += step) {
      const y = 0.12 * Math.sin(x * 0.45 + t * 1.8 + k * 0.9);
      if (has) {
        const d = Math.hypot((x + px) / 2 - view.x, z - travel);
        seg3(px, py, z, x, y, z, amt * (0.2 + 0.7 * depthB(d, far)));
      }
      px = x; py = y; has = true;
    }
  }
}

// ---------- Horizon: the line at infinity, tilted by pitch and roll ----------
function drawHorizon() {
  if (Math.abs(view.cp) <= 0.02) return;
  const y0 = clamp(focal * view.sp / view.cp, -1e5, 1e5);   // below centre when looking up; flips when inverted
  const ends = [[-W, y0], [W, y0]].map(([a, b]) => [W / 2 + a * view.cr - b * view.sr, H / 2 + a * view.sr + b * view.cr]);
  wire(ends[0][0], ends[0][1], ends[1][0], ends[1][1], 0.9);
}

// ---------- Ground grid: world-aligned, so turning swings it; scrolls under the bottom edge ----------
// Lines in both world axes over a square centred ahead of you, sliced so each piece
// fades by its own distance; pieces behind you or past the fade are skipped.
function drawGround() {
  const half = (GRID_LINES * GRID) / 2, bias = vloop ? 0 : half - 4;
  const cx = Math.round((view.x + view.hx * bias) / GRID) * GRID;
  const cz = Math.round((travel + view.hz * bias) / GRID) * GRID;
  const SL = 4;                                     // slice length
  const piece = (x1, z1, x2, z2) => {
    const mx = (x1 + x2) / 2, mz = (z1 + z2) / 2;
    if (!vloop && fwdOf(mx, mz) < -SL) return;
    const d = Math.hypot(mx - view.x, mz - travel);
    if (d > VIEW_FAR) return;
    seg3(x1, 0, z1, x2, 0, z2, depthB(d, VIEW_FAR) * clamp((VIEW_FAR - d) / 4, 0, 1));
  };
  for (let i = 0; i <= GRID_LINES; i++) {
    const u = -half + i * GRID;
    for (let s = -half; s < half; s += SL) {
      piece(cx + u, cz + s, cx + u, cz + s + SL);   // lines along z
      piece(cx + s, cz + u, cx + s + SL, cz + u);   // lines along x
    }
  }
}

// Fade for scenery at distance d (dim far away, fades in at the far end)
const sceneryB = d => depthB(d, VIEW_FAR * 1.2) * clamp((VIEW_FAR * 1.2 - d) / 5, 0, 1);
const distOf = o => Math.hypot(o.x - view.x, o.z - travel);
// Passed behind you or far off to the side of your heading → respawn far ahead
const passed = (o, behind, wide) => fwdOf(o.x, o.z) < behind || Math.abs(latOf(o.x, o.z)) > wide;

// ---------- Mountains: jagged ridges at the sides ----------
function drawMountains() {
  for (const m of mountains) {
    respawn(m, spawnMountain, 0.5, 60);
    const b = sceneryB(distOf(m)), P = m.prof;
    const at = i => [m.x + m.ax * P[i][0] * m.w, P[i][1] * m.h, m.z + m.az * P[i][0] * m.w];
    for (let i = 1; i < P.length; i++) {
      const a = at(i - 1), c = at(i);
      seg3(a[0], a[1], a[2], c[0], c[1], c[2], b);
    }
  }
}

// ---------- Towers: tapering lattice with rings, braces and an antenna ----------
function drawTowers() {
  for (const t of towers) {
    respawn(t, spawnTower, -0.5, 45);
    const b = sceneryB(distOf(t));
    const ring = (y, w) => [[t.x - w, y, t.z - w], [t.x + w, y, t.z - w], [t.x + w, y, t.z + w], [t.x - w, y, t.z + w]];
    let prev = ring(0, 0.3);
    for (let l = 1; l <= t.levels; l++) {
      const cur = ring((t.h * l) / t.levels, lerp(0.3, 0.1, l / t.levels));
      for (let k = 0; k < 4; k++) {
        const a = prev[k], c = cur[k], n = cur[(k + 1) % 4];
        seg3(a[0], a[1], a[2], c[0], c[1], c[2], b);           // leg
        seg3(c[0], c[1], c[2], n[0], n[1], n[2], b);           // ring
        seg3(a[0], a[1], a[2], n[0], n[1], n[2], b * 0.7);     // brace
      }
      prev = cur;
    }
    seg3(t.x, t.h, t.z, t.x, t.h + 0.8, t.z, b);               // antenna
  }
}

// ---------- Clouds: eye-level outlines that part around the camera ----------
function drawClouds() {
  for (const c of cloudShapes) {
    respawn(c, spawnCloud, 0.3, 40);
    const d = Math.max(0, fwdOf(c.x, c.z)), n = c.pts.length, y = view.h + c.yRel;
    const b = 0.85 * depthB(d, VIEW_FAR) * clamp((VIEW_FAR - d) / 4, 0, 1);
    const split = d < CLOUD_SPLIT ? 3.5 * Math.pow(1 - d / CLOUD_SPLIT, 1.5) : 0;
    const rx = view.hz, rz = -view.hx;              // faces you: laid out along your right vector
    const half = (from, to, off) => {
      for (let i = from; i < to; i++) {
        const p = c.pts[i % n], q = c.pts[(i + 1) % n];
        const pu = p[0] + off, qu = q[0] + off;
        seg3(c.x + rx * pu, y + p[1], c.z + rz * pu, c.x + rx * qu, y + q[1], c.z + rz * qu, b);
      }
    };
    if (split <= 0) half(0, n, 0);
    else { half(n / 4, (3 * n) / 4, -split); half((3 * n) / 4, n + n / 4, split); }   // left half, right half
  }
}

// ---------- Speed lines: red streaks rushing past once you're flying fast ----------
function drawSpeedLines() {
  const show = clamp((fwdSpeed - 6) / 6 + Math.max(0, thrustEff) + barrelNow() * 0.6, 0, 1);   // surge under thrust / a roll
  const len = fwdSpeed * (0.07 + 0.05 * Math.max(0, thrustEff));
  for (const p of speedLines) {
    if (passed(p, 0.3, 8)) spawnSpeed(p, 14 + Math.random() * 8);
    if (show <= 0) continue;
    const t = clamp(1 - fwdOf(p.x, p.z) / 22, 0, 1);
    seg3(p.x, p.y, p.z, p.x + view.hx * len, p.y, p.z + view.hz * len, show * (0.25 + 0.75 * t * t));
  }
}

// ---------- The far skyline: a jagged range all round, fixed by world bearing ----------
function drawRidge() {
  const half = Math.PI;                               // all the way round (behind-the-camera pieces clip away)
  const hAt = a => 2.5 + 2.2 * Math.abs(Math.sin(a * 3 + RIDGE_SEED)) + 1.6 * Math.sin(a * 7.3 + RIDGE_SEED * 2)
                 + 0.9 * Math.sin(a * 17 + RIDGE_SEED * 3) + 0.5 * Math.sin(a * 41);
  let px = 0, py = 0, pz = 0, has = false;
  for (let i = 0; i <= RIDGE_N; i++) {
    const a = view.yaw - half + (i / RIDGE_N) * half * 2;
    const x = view.x + Math.sin(a) * RIDGE_D, z = travel + Math.cos(a) * RIDGE_D, y = Math.max(0, hAt(a));
    if (has) seg3(px, py, pz, x, y, z, 0.2);
    px = x; py = y; pz = z; has = true;
  }
}

// ---------- Ruins: rows of columns, some broken, a lintel over the whole ones ----------
function drawColumns() {
  for (const c of columns) {
    respawn(c, spawnColumns, 0, 40);
    const b = sceneryB(distOf(c));
    if (b <= 0.02) continue;
    const ax = c.ax, az = c.az, w = 0.13;
    let prevTop = null;
    for (let i = 0; i < c.n; i++) {
      const u = i * c.gap, h = c.h * c.cols[i], whole = c.cols[i] === 1;
      const x = c.x + ax * u, z = c.z + az * u;
      // two shaft lines (seen edge-on either side), base and cap squares
      seg3(x + ax * w, 0, z + az * w, x + ax * w, h, z + az * w, b);
      seg3(x - ax * w, 0, z - az * w, x - ax * w, h, z - az * w, b);
      const sq = (y, s) => {
        const p = [[x + ax * s + az * s, y, z + az * s - ax * s], [x - ax * s + az * s, y, z + az * s + ax * s],
                   [x - ax * s - az * s, y, z - az * s + ax * s], [x + ax * s - az * s, y, z - az * s - ax * s]];
        for (let k = 0; k < 4; k++) { const p1 = p[k], p2 = p[(k + 1) % 4]; seg3(p1[0], p1[1], p1[2], p2[0], p2[1], p2[2], b * 0.8); }
      };
      sq(0.08, 0.24);
      if (whole) sq(h, 0.22);
      else {                                          // broken: a jagged top
        seg3(x - ax * w, h, z - az * w, x, h + 0.18, z, b); seg3(x, h + 0.18, z, x + ax * w, h - 0.05, z + az * w, b);
      }
      if (whole && prevTop) seg3(prevTop[0], c.h + 0.12, prevTop[1], x, c.h + 0.12, z, b);   // lintel
      prevTop = whole ? [x, z] : null;
    }
  }
}

// ---------- Labyrinth: low maze walls on the ground, drawn as top edge + posts ----------
function drawMaze() {
  for (const m of mazes) {
    respawn(m, spawnMaze, -2, 36);
    const b = sceneryB(distOf(m)) * 0.9;
    if (b <= 0.02) continue;
    for (const [x1, z1, x2, z2] of m.walls) {
      const ax = m.x + x1, az = m.z + z1, bx = m.x + x2, bz = m.z + z2;
      seg3(ax, m.h, az, bx, m.h, bz, b);              // top edge
      seg3(ax, 0, az, ax, m.h, az, b * 0.7);          // post
      seg3(bx, 0, bz, bx, m.h, bz, b * 0.7);
    }
  }
}

// ---------- Rings in the air: fly through one and it rings ----------
function drawRings(now) {
  for (const r of rings) {
    respawn(r, spawnRing, -1, 30);
    const f = fwdOf(r.x, r.z);
    // crossing its plane, inside its radius → hit
    if (mode === "live" && r.prevFwd > 0 && f <= 0 && Math.abs(latOf(r.x, r.z)) < r.r && Math.abs(view.h - r.y) < r.r) {
      r.hit = now; ringChime();
      for (let k = 0; k < 12 && feathers.length < FEATHER_CAP; k++) {
        feathers.push({ x: W / 2 + (Math.random() - 0.5) * W * 0.6, y: H / 2 + (Math.random() - 0.5) * H * 0.6,
                        vx: (Math.random() - 0.5) * 120, vy: -60 + Math.random() * 40,
                        ph: Math.random() * 6.28, life: 0, max: 1.2 + Math.random(), size: 1.8 + Math.random() });
      }
    }
    r.prevFwd = f;
    const flash = clamp(1 - (now - r.hit) / 600, 0, 1);
    const b = Math.min(1, sceneryB(distOf(r)) * (0.9 + 0.6 * flash) + flash * 0.3);
    if (b <= 0.02) continue;
    const n = 14, pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, s = r.r * (1 + flash * 0.15);
      pts.push([r.x + r.ax * Math.cos(a) * s, r.y + Math.sin(a) * s, r.z + r.az * Math.cos(a) * s]);
    }
    for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n]; seg3(p[0], p[1], p[2], q[0], q[1], q[2], b); }
  }
}

// ---------- Giant feathers, turning as they drift down ----------
function drawBigFeathers(now, dt) {
  const t = now / 1000;
  for (const f of bigFeathers) {
    if (mode === "live" || mode === "results") { f.y += f.vy * dt; f.ang += f.spin * dt; }
    if (f.y < -1 || fwdOf(f.x, f.z) < -3 || Math.abs(latOf(f.x, f.z)) > 40) spawnBigFeather(f, 10 + Math.random() * 40);
    const b = sceneryB(distOf(f)) * 0.9;
    if (b <= 0.02) continue;
    const rx = view.hz, rz = -view.hx;                // billboard plane: your right vector + up
    const ang = f.ang + Math.sin(t * 0.7 + f.sway) * 0.3;
    const ca = Math.cos(ang), sa = Math.sin(ang), L = f.len;
    const P = (u, v) => [f.x + rx * (u * ca - v * sa), f.y + (u * sa + v * ca), f.z + rz * (u * ca - v * sa)];
    const tip = P(L / 2, 0), base = P(-L / 2, 0);
    seg3(base[0], base[1], base[2], tip[0], tip[1], tip[2], b);          // the shaft
    for (let i = 1; i <= 5; i++) {                                        // barbs, both sides
      const u = -L / 2 + (i / 6) * L, w = L * 0.18 * Math.sin((i / 6) * Math.PI);
      const o = P(u, 0), p1 = P(u + L * 0.08, w), p2 = P(u + L * 0.08, -w);
      seg3(o[0], o[1], o[2], p1[0], p1[1], p1[2], b * 0.8);
      seg3(o[0], o[1], o[2], p2[0], p2[1], p2[2], b * 0.8);
    }
  }
}

// ---------- The colossus ----------
function drawColossus() {
  respawn(colossus, spawnColossus, -2, 50);
  const b = sceneryB(distOf(colossus)) * 0.7;
  if (b > 0.02) drawStanding(colossus.x, colossus.z, COLOSSUS_SCALE, b);
}

// The whole world, in one batched stroke pass, then scanlines
function drawWorld(now, dt, sun) {
  beginWire();
  // During the long fall the land gives way to the sea once the nose is down
  const fallT = mode === "melt" ? (now - meltStart) / 1000 : -1;
  const land = fallT < FALL_UP * 0.8;
  if (land) {
    drawRidge();
    drawGround();
    drawMaze();
    drawMountains();
    drawColumns();
    drawTowers();
    drawColossus();
    drawRings(now);
    drawBigFeathers(now, dt);
    drawClouds();
    drawSpeedLines();
  }
  if (fallT >= FALL_UP * 0.5) drawSea(now, clamp((fallT - FALL_UP * 0.5) / 0.6, 0, 1));
  drawHorizon();
  drawGhosts();
  drawFather();
  drawFigures();
  drawSunWithLies(now, sun);
  flushWire();
  drawScanlines();
}

// ---------- Wax ----------
function spawnWax(dt) {
  const hot = Math.max(heat, burnAmt);
  if (hot < 0.04 || !handTips.length) return;
  const rate = hot * hot * 6;             // drops per second, per fingertip
  for (const tip of handTips) {
    if (wax.length >= WAX_CAP) return;
    if (Math.random() < rate * dt) {
      wax.push({
        x: tip.x + (Math.random() - 0.5) * 4, y: tip.y,
        vx: (Math.random() - 0.5) * 30, vy: 20 + Math.random() * 60,
        size: 2 + Math.random() * 1.5 + heat, c: WAX_COLORS[(Math.random() * WAX_COLORS.length) | 0], life: 0,
      });
    }
  }
}

function drawWax(dt) {
  ctx.globalAlpha = 0.9;
  wax = wax.filter(p => {
    p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life += dt;
    if (p.y > H + 10 || p.life > 3) return false;
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    return true;
  });
  ctx.globalAlpha = 1;
}

// ---------- Feathers ----------
function drawFeathers(dt) {
  ctx.fillStyle = "#fff";
  feathers = feathers.filter(p => {
    p.life += dt;
    if (p.life > p.max) return false;
    p.vy += 60 * dt; p.vx *= 1 - 1.5 * dt; p.vy *= 1 - 1.5 * dt;
    p.x += p.vx * dt + Math.sin(p.life * 4 + p.ph) * 25 * dt;
    p.y += p.vy * dt;
    ctx.globalAlpha = 0.85 * (1 - p.life / p.max);
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    return true;
  });
  ctx.globalAlpha = 1;
}

function render(now, dt) {
  // Renderer failing: sometimes it just doesn't draw a new frame (the world keeps moving)
  if (stutterLeft > 0) { stutterLeft--; return; }
  if (Math.random() < glitchAmt() * 0.05) stutterLeft = 1 + ((Math.random() * 3) | 0);

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  drawRain();                         // Greek rain, behind everything

  const sun = sunState(now);

  if (mode === "melt") {
    const t = (now - meltStart) / 1000;
    drawWorld(now, dt, sun);
    drawBody(now);                    // CRASH: bones over the camera; you fall through the gaps
    drawWax(dt);
    drawFeathers(dt);
    drawVisor();                      // the drops slide off as you fall
    // Just before the water, one line (and its whisper)
    if (t >= FALL_TEXT_AT) {
      if (!fallWhispered) { fallWhispered = true; whisper(); }
      caption("he also flew.", (t - FALL_TEXT_AT) / 0.5);
    }
    return;
  }

  drawWorld(now, dt, sun);
  tearFrame();                        // lines tear and offset at high heat
  drawBody(now);                      // the hands, burning to the bone as heat rises
  drawWax(dt);
  drawFeathers(dt);
  drawVisor();                        // wax on the lens, over everything
  if (mode === "live" && now < lieTextUntil) caption("that's not the sun", Math.min(1, (lieTextUntil - now) / 600), H * 0.6);
}

// ============================================================
// Main loop
// ============================================================
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  step(now, dt);
  render(now, dt);
}

// ============================================================
// Setup
// ============================================================
$("reach").onclick = async () => {
  const btn = $("reach");
  btn.disabled = true;
  try {
    const motion = requestMotion();   // first: iOS only allows the permission prompt inside the tap
    recalibrate();                    // "level" = however the phone is held right now
    audio = initAudio();              // must happen inside the tap
    await audio.ac.resume();
    await motion;

    // Go fullscreen and landscape (both must start inside the tap), then resize to match
    try { await document.documentElement.requestFullscreen({ navigationUI: "hide" }); } catch (e) { console.warn("Fullscreen failed", e); }
    try { await screen.orientation.lock("landscape"); } catch (e) { console.warn("Orientation lock failed", e); }
    await new Promise(res => setTimeout(res, 150));
    fit();

    $("intro").classList.add("hidden");
    mode = "live";
    loop();
  } catch (e) {
    console.error(e);
    btn.textContent = "Error · retry";
    btn.disabled = false;
  }
};

$("again").onclick = () => {
  if (!document.fullscreenElement) {
    try { document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(e => console.warn("Fullscreen failed", e)); }
    catch (e) { console.warn("Fullscreen failed", e); }
  }
  $("results").classList.add("hidden");
  altitude = 0; altVel = 0; heat = 0; seaSince = 0;
  wax = []; feathers = []; figures = []; visorDrops = []; frags = []; burnt.clear();
  lie = null; lieTextUntil = 0; tilt = null;
  barrel = null; vloop = null; barrelCool = 0; rollHist.length = 0; pitchHist.length = 0;
  embers = []; burnAmt = 0;
  // Back to the start, facing the sun; the world is laid out fresh ahead
  view.x = 0; travel = 0; view.yaw = 0; view.hx = 0; view.hz = 1; view.cy = 1; view.sy = 0;
  view.h = CAM_H_SEA; view.pitch = 0; bank = 0; yawRate = 0; fwdSpeed = SPEED_BASE;
  father.x = 0; father.z = FATHER_AHEAD;
  respawnAll();
  recalibrate();                      // "level" = however the phone is held when you tap
  releaseVoice();                     // drop any leftover melt automation
  mode = "live";
};

// Browsers may suspend audio in the background; wake it on return
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && audio) audio.ac.resume();
});
</script>
