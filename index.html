    const lat = la * Math.PI / 180;
    let prev = P(lat, spin);
    for (let i = 1; i <= 32; i++) { const q = P(lat, spin + (i / 32) * Math.PI * 2); seg(prev, q); prev = q; }
  }
  for (let k = 0; k < 12; k++) {                                 // longitudes
    const lon = spin + (k / 12) * Math.PI * 2;
    let prev = P(-Math.PI / 2, lon);
    for (let i = 1; i <= 16; i++) { const q = P(-Math.PI / 2 + (i / 16) * Math.PI, lon); seg(prev, q); prev = q; }
  }
  const limb = [];                                               // outline
  for (let i = 0; i <= 40; i++) {
    const a = (i / 40) * Math.PI * 2;
    const w = 1 + f * 0.05 * Math.sin(a * 7 + tw) + f * f * (Math.random() - 0.5) * 0.03;
    const sag = mf * 0.55 * Math.pow(Math.max(0, Math.sin(a) + 0.25), 2) * (1 + 0.4 * Math.sin(a * 9 + mt));   // the rim runs
    limb.push([s.x + Math.cos(a) * R * w * (1 + mf * 0.12), s.y + Math.sin(a) * R * w + sag * R]);
  }
  wirePoly(limb, Math.min(1, base + 0.15));
  drawCorona(s, now);
  if (s.face > 0.02) drawSunFace(s, now);
}

// The corona: flame tongues off the limb, short and lazy from afar, long and roaring up close
function drawCorona(s, now) {
  const f = s.flare, R = s.r, t = now / 1000;
  const n = Math.round(lerp(14, CORONA_N, f));
  const b = 0.3 + 0.7 * f;
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * Math.PI * 2 + t * 0.15 * (1 + 2 * f);
    // each tongue flickers in length and leans with the spin
    const len = R * (0.06 + 0.5 * f * (0.5 + 0.5 * Math.sin(t * (6 + 9 * f) + i * 1.7)) + 0.04 * Math.random() * f);
    const lean = 0.25 * Math.sin(t * 3 + i) * f;
    const x0 = s.x + Math.cos(a0) * R * 1.01, y0 = s.y + Math.sin(a0) * R * 1.01;
    const x1 = s.x + Math.cos(a0 + lean * 0.5) * (R + len * 0.55), y1 = s.y + Math.sin(a0 + lean * 0.5) * (R + len * 0.55);
    const x2 = s.x + Math.cos(a0 + lean) * (R + len), y2 = s.y + Math.sin(a0 + lean) * (R + len);
    wire(x0, y0, x1, y1, b); wire(x1, y1, x2, y2, b * 0.7);
    if (f > 0.5 && Math.random() < (f - 0.5) * 0.5)              // sparks thrown off the tips
      wireDot(x2 + (Math.random() - 0.5) * 20, y2 + (Math.random() - 0.5) * 20, 2 + Math.random() * 2, b);
  }
}

// The face: eyes, nose, mouth. Far off it's scattered fragments; very close, they pull together.
// With heat the brows come down, the eyes narrow, the mouth opens: it does not want you here.
function drawSunFace(s, now) {
  const R = s.r, a = s.face, f = s.flare, scatter = (1 - a) * R * 0.45, tw = now / 110;
  const J = () => (Math.random() - 0.5) * (scatter + f * f * R * 0.025);
  const P = (u, v) => [s.x + u * R + J(), s.y + v * R + J()];
  const b = 0.25 + 0.75 * a;
  for (const sd of [-1, 1]) {
    const ex = sd * 0.32, eye = [];
    const h = 0.05 + 0.02 * Math.sin(tw * 0.3) - 0.03 * f;         // narrowing
    for (let i = 0; i <= 10; i++) {
      const t = (i / 10) * Math.PI * 2;
      eye.push(P(ex + Math.cos(t) * 0.13, -0.18 + Math.sin(t) * Math.max(0.012, h)));
    }
    wirePoly(eye, b);
    if (f > 0.15) {                                                // brows, angled down toward the nose
      const k = (f - 0.15) / 0.85;
      wirePoly([P(ex - sd * 0.18, -0.34 + 0.02 * k), P(ex + sd * 0.1, -0.32 + 0.1 * k)], b * k);
    }
    if (f > 0.6) wireDot(s.x + ex * R, s.y - 0.18 * R, 3 + 3 * f, b);   // a pupil, fixed on you
  }
  wirePoly([P(0, -0.1), P(0.05, 0.12), P(-0.03, 0.15)], b * 0.8);  // nose
  const open = 0.22 * f * (0.7 + 0.3 * Math.sin(tw * 0.5));         // the mouth opens with heat
  const top = [], bot = [];
  for (let i = 0; i <= 12; i++) {
    const u = -0.3 + (i / 12) * 0.6, e = 1 - (u / 0.3) ** 2;
    top.push(P(u, 0.42 - 0.06 * e - open * 0.25 * e));
    bot.push(P(u, 0.42 - 0.06 * e + open * e));
  }
  wirePoly(top, b);
  if (open > 0.01) {
    wirePoly(bot, b);
    for (let i = 1; i < 12; i += 2) wire(top[i][0], top[i][1], top[i][0], top[i][1] + open * R * 0.4 * (1 - ((i / 12 - 0.5) * 2) ** 2), b * 0.6);   // teeth
  }
}

// ---------- The sun lies: at high heat it briefly duplicates or drifts ----------
function updateLie(now, dt) {
  if (lie && now > lie.end) lie = null;
  const every = lerp(LIE_EVERY, 0.8, clamp((heat - LIE_HEAT) / (1 - LIE_HEAT), 0, 1));
  if (!lie && heat > LIE_HEAT && Math.random() < dt / every) {
    const dur = 700 + Math.random() * 600;
    lie = { start: now, end: now + dur, kind: Math.random() < 0.5 ? "double" : "drift",
            dx: (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.5), dy: (Math.random() - 0.5) * 0.6 };
    lieTextUntil = now + dur + 900;
    whisper();                                        // each line of text gets a whispered syllable
  }
}

// ---------- The renderer fails at high heat ----------
function glitchAmt() { return mode === "live" ? clamp((heat - GLITCH_FROM) / (1 - GLITCH_FROM), 0, 1) : 0; }

function updateGlitch(now, dt) {
  const g = glitchAmt();
  if (tilt && now > tilt.end) tilt = null;
  if (!tilt && g > 0 && Math.random() < g * 0.25 * dt) {
    tilt = { start: now, end: now + 600 + Math.random() * 600, amt: (Math.random() < 0.5 ? -1 : 1) * (0.1 + 0.25 * g) };
  }
  if (mode !== "live") tilt = null;
}

  ctx.lineWidth = 1.6; ctx.strokeStyle = CHAR; ctx.stroke(charP);
  ctx.strokeStyle = CHAR; ctx.lineWidth = 1.4;
  for (const f of frags) {                            // flakes of burnt flesh, cooling as they fall
    ctx.globalAlpha = 1 - f.life / f.max;
    ctx.beginPath(); ctx.moveTo(f.cx - f.hx, f.cy - f.hy); ctx.lineTo(f.cx + f.hx, f.cy + f.hy); ctx.stroke();
  }
  for (const e of embers) {                           // sparks, orange to red as they rise and die
    const k = e.life / e.max;
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = k < 0.4 ? "rgb(255, 180, 60)" : k < 0.7 ? CHAR : RED;
    ctx.fillRect(e.x - e.s / 2, e.y - e.s / 2, e.s, e.s);
  }
  ctx.restore();
}
function updateEmbers(dt) {
  embers = embers.filter(e => {
    e.life += dt; e.x += e.vx * dt + Math.sin(e.life * 9) * 12 * dt; e.y += e.vy * dt; e.vy *= 1 - 0.8 * dt;
    return e.life < e.max;
  });
}

// Hard turns and dives shed a few feathers off the hands
function spawnFeathers(dt) {
  if (!handPtsScreen.length || feathers.length >= FEATHER_CAP) return;
  const rate = Math.max(0, Math.abs(yawRate) - 0.5) * 4 + thrustEff * 2 + barrelNow() * 10;
  if (Math.random() >= rate * dt) return;
  const p = handPtsScreen[(Math.random() * handPtsScreen.length) | 0];
  feathers.push({
    x: p.x, y: p.y, vx: -yawRate * 120 + (Math.random() - 0.5) * 40, vy: -20 + Math.random() * 30,
    ph: Math.random() * 6.28, life: 0, max: 1.4 + Math.random() * 1.2, size: 1.4 + Math.random() * 1.2,
  });
}
function drawSunWithLies(now, sun) {
  if (!lie || sun.r < 2) { drawSun(now, sun); return; }
  const u = clamp((now - lie.start) / (lie.end - lie.start), 0, 1), env = Math.sin(u * Math.PI);
  if (lie.kind === "double") {
    drawSun(now, sun);
    drawSun(now, { ...sun, x: sun.x + lie.dx * sun.r * 1.4 * env, y: sun.y + lie.dy * sun.r * env, face: 0 });
  } else {
    drawSun(now, { ...sun, x: sun.x + lie.dx * sun.r * 1.2 * env, y: sun.y + lie.dy * sun.r * env });
  }
}

// One line of text on the canvas (so it's in the saved video)
function caption(text, a, y = H * 0.42) {
  if (a <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.font = `italic 700 34px ${SF}`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  const t = glitchText(text);
  ctx.lineWidth = 5; ctx.strokeStyle = "#000"; ctx.strokeText(t, W / 2, y);   // the site's hard outline
  ctx.fillStyle = RED; ctx.fillText(t, W / 2, y);
  ctx.restore();
}

// ---------- The ones before you: dot figures falling past; some climb beside you first ----------
function spawnFigures(dt) {
  const rate = lerp(FIG_RATE_LOW, FIG_RATE_HIGH, altitude * altitude);
  if (figures.length >= FIG_MAX || Math.random() >= rate * dt) return;
  const f = { t: 0, seed: Math.random() * 10, dropped: false };
  if (Math.random() < FIG_CLIMBER) {        // still climbing beside you, for a few seconds
    place(f, 3 + Math.random() * 3, side() * (2.5 + Math.random() * 1.5));
    f.y = view.h + 0.3 + Math.random() * 0.6; f.vy = 0.4; f.climb = 3 + Math.random() * 2;
    f.ang = 0; f.spin = 0;
  } else {                                  // falling from above, tumbling
    place(f, 8 + Math.random() * 16, side() * (1.5 + Math.random() * 8));
    f.y = view.h + 7 + Math.random() * 4; f.vy = -1 - Math.random() * 2; f.climb = 0;
    f.ang = Math.random() * 6.28; f.spin = (Math.random() - 0.5) * 4;
  }
  figures.push(f);
}

function updateFigures(dt) {
  figures = figures.filter(f => {
    f.t += dt;
    if (f.climb > 0 && f.t < f.climb && mode === "live") {
      f.x += view.hx * fwdSpeed * dt; f.z += view.hz * fwdSpeed * dt;   // keeps pace with you
      f.y += f.vy * dt;
    } else {
      if (f.climb > 0 && !f.dropped) { f.dropped = true; f.vy = 0; f.spin = (Math.random() - 0.5) * 3; }
      f.vy -= FIG_GRAVITY * dt; f.y += f.vy * dt; f.ang += f.spin * dt;
    }
    return f.y > -3 && f.t < 30;
  });
}

// A body like yours was: head ring, torso, arms out, legs, as (u across, v up) points
function figurePoints(f) {
  const climbing = f.climb > 0 && !f.dropped;
  const armLift = climbing ? Math.sin(f.t * 9) * 0.35 : 0.4 + Math.sin(f.t * 13 + f.seed) * 0.25;
  const P = [];
  for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; P.push([Math.cos(a) * 0.14, 1.62 + Math.sin(a) * 0.14]); }
  for (let i = 0; i <= 3; i++) P.push([0, 1.45 - i * 0.22]);
  for (const sd of [-1, 1]) {
    for (let i = 1; i <= 4; i++) P.push([sd * 0.2 * i, 1.38 + armLift * (i / 4)]);
    for (let i = 1; i <= 4; i++) P.push([sd * 0.07 * i, 0.8 - 0.2 * i]);
  }
  return P;
}

function drawFigures() {
  const rx = view.hz, rz = -view.hx;                 // billboard: faces you
  for (const f of figures) {
    const ca = Math.cos(f.ang), sa = Math.sin(f.ang);
    for (const [u, v] of figurePoints(f)) {
      const vv = v - 0.9, ur = u * ca - vv * sa, vr = u * sa + vv * ca;   // tumble about the waist
      const c = toCam(f.x + rx * ur, f.y + vr, f.z + rz * ur);
      if (c[2] < NEAR) continue;
      const [sx, sy] = toScreen(c);
      wireDot(sx, sy, clamp(60 / c[2], 1.5, 7), 0.15 + 0.85 * depthB(c[2], VIEW_FAR * 1.3));
    }
  }
}

// ---------- Your ghosts: past flights as faint trails in world space ----------
function loadGhosts() {
  try {
    const g = JSON.parse(localStorage.getItem(GHOST_KEY) || "[]");
    return Array.isArray(g) ? g.filter(p => Array.isArray(p) && p.length >= 6).slice(-GHOST_MAX) : [];
  } catch (e) { console.warn("Couldn't read ghosts", e); return []; }
}
function saveGhost(path) {
  if (path.length < 6) return;
  ghosts.push(path);
  while (ghosts.length > GHOST_MAX) ghosts.shift();
  try { localStorage.setItem(GHOST_KEY, JSON.stringify(ghosts)); }
  catch (e) { console.warn("Couldn't save ghosts", e); }
}
// A few points per second, relative to where (and which way) this flight took off
function recordGhost(now) {
  if (!flight || !flightOrigin || now - lastGhostRec < GHOST_STEP || ghostPath.length >= GHOST_POINTS * 3) return;
  lastGhostRec = now;
  const o = flightOrigin, dx = view.x - o.x, dz = travel - o.z;
  const r2 = v => Math.round(v * 100) / 100;
  ghostPath.push(r2(dx * o.hx + dz * o.hz), r2(dx * o.hz - dz * o.hx), r2(view.h));
}
function drawGhosts() {
  if (!ghosts.length) return;
  // Laid out from this flight's take-off; before take-off, from where you are now
  const o = flightOrigin || { x: view.x, z: travel, hx: view.hx, hz: view.hz };
  const far = VIEW_FAR * 1.3;
  ghosts.forEach((g, gi) => {
    const age = 0.45 + 0.55 * ((gi + 1) / ghosts.length);     // older flights fainter
    let px = 0, pz = 0, py = 0, has = false;
    for (let i = 0; i + 2 < g.length; i += 3) {
      const f = g[i], l = g[i + 1];
      const x = o.x + o.hx * f + o.hz * l, z = o.z + o.hz * f - o.hx * l, y = g[i + 2];
      if (has) {
        const mx = (x + px) / 2, mz = (z + pz) / 2;
        const d = Math.hypot(mx - view.x, mz - travel);
        if (d < far && (vloop || fwdOf(mx, mz) > -2)) seg3(px, py, pz, x, y, z, 0.22 * age * (0.3 + 0.7 * depthB(d, far)));
      }
      px = x; pz = z; py = y; has = true;
    }
  });
}

// ---------- The father: a tiny wire figure on the ground; shrinks as you climb ----------
// A standing wire figure on the ground at (fx, fz), facing you, scaled by sc
function drawStanding(fx, fz, sc, b) {
  const rx = view.hz, rz = -view.hx;
  const L = (u1, v1, u2, v2) => seg3(fx + rx * u1 * sc, v1 * sc, fz + rz * u1 * sc, fx + rx * u2 * sc, v2 * sc, fz + rz * u2 * sc, b);
  for (let i = 0; i < 6; i++) {                     // head, tipped back a little: looking up
    const a1 = (i / 6) * Math.PI * 2, a2 = ((i + 1) / 6) * Math.PI * 2;
    L(Math.cos(a1) * 0.09, 1.0 + Math.sin(a1) * 0.09, Math.cos(a2) * 0.09, 1.0 + Math.sin(a2) * 0.09);
  }
  L(0, 0.9, 0, 0.5);                                 // body
  L(0, 0.82, -0.18, 0.58); L(0, 0.82, 0.18, 0.58);   // arms at his sides
  L(0, 0.5, -0.1, 0); L(0, 0.5, 0.1, 0);             // legs
}

function drawFather() {
  const sky = clamp((viewAlt - SEA_LINE) / (1 - SEA_LINE), 0, 1);
  const sc = mode === "melt" ? 1 : lerp(1, 0.4, sky);
  const fx = father.x, fz = father.z;
  const d = Math.hypot(fx - view.x, fz - travel);
  const b = 0.35 + 0.6 * depthB(d, VIEW_FAR * 1.5);
  drawStanding(fx, fz, sc, b);
  if (mode === "melt") {                             // standing on a rock in the sea
    const rock = [];
    for (let i = 0; i <= 9; i++) {
      const a = (i / 9) * Math.PI * 2, r = 0.7 + 0.2 * Math.sin(i * 2.7);
      rock.push([fx + Math.cos(a) * r, 0.05, fz + Math.sin(a) * r]);
    }
    for (let i = 1; i < rock.length; i++) seg3(...rock[i - 1], ...rock[i], b * 0.8);
  }
}

// ---------- The sea, rushing up during the long fall ----------
function drawSea(now, amt) {
  const t = now / 1000;
  const cx = Math.round(father.x / SEA_SPACING) * SEA_SPACING, cz = Math.round(father.z / SEA_SPACING) * SEA_SPACING;
  const step = 6, far = SEA_HALF * 1.2;
  for (let k = 0; k < SEA_LINES; k++) {
    const z = cz - SEA_HALF + k * SEA_SPACING;
    let px = 0, py = 0, has = false;
    for (let x = cx - SEA_HALF; x <= cx + SEA_HALF; x += step) {
      const y = 0.12 * Math.sin(x * 0.45 + t * 1.8 + k * 0.9);
      if (has) {
        const d = Math.hypot((x + px) / 2 - view.x, z - travel);
        seg3(px, py, z, x, y, z, amt * (0.2 + 0.7 * depthB(d, far)));
      }
      px = x; py = y; has = true;
    }
  }
}

// ---------- Horizon: the line at infinity, tilted by pitch and roll ----------
function drawHorizon() {
  if (Math.abs(view.cp) <= 0.02) return;
  const y0 = clamp(focal * view.sp / view.cp, -1e5, 1e5);   // below centre when looking up; flips when inverted
  const ends = [[-W, y0], [W, y0]].map(([a, b]) => [W / 2 + a * view.cr - b * view.sr, H / 2 + a * view.sr + b * view.cr]);
  wire(ends[0][0], ends[0][1], ends[1][0], ends[1][1], 0.9);
}

// ---------- Ground grid: world-aligned, so turning swings it; scrolls under the bottom edge ----------
// Lines in both world axes over a square centred ahead of you, sliced so each piece
// fades by its own distance; pieces behind you or past the fade are skipped.
function drawGround() {
  const half = (GRID_LINES * GRID) / 2, bias = vloop ? 0 : half - 4;
  const cx = Math.round((view.x + view.hx * bias) / GRID) * GRID;
  const cz = Math.round((travel + view.hz * bias) / GRID) * GRID;
  const SL = 4;                                     // slice length
  const piece = (x1, z1, x2, z2) => {
    const mx = (x1 + x2) / 2, mz = (z1 + z2) / 2;
    if (!vloop && fwdOf(mx, mz) < -SL) return;
    const d = Math.hypot(mx - view.x, mz - travel);
    if (d > VIEW_FAR) return;
    seg3(x1, 0, z1, x2, 0, z2, depthB(d, VIEW_FAR) * clamp((VIEW_FAR - d) / 4, 0, 1));
  };
  for (let i = 0; i <= GRID_LINES; i++) {
    const u = -half + i * GRID;
    for (let s = -half; s < half; s += SL) {
      piece(cx + u, cz + s, cx + u, cz + s + SL);   // lines along z
      piece(cx + s, cz + u, cx + s + SL, cz + u);   // lines along x
    }
  }
}

// Fade for scenery at distance d (dim far away, fades in at the far end)
const sceneryB = d => depthB(d, VIEW_FAR * 1.2) * clamp((VIEW_FAR * 1.2 - d) / 5, 0, 1);
const distOf = o => Math.hypot(o.x - view.x, o.z - travel);
// Passed behind you or far off to the side of your heading → respawn far ahead
const passed = (o, behind, wide) => fwdOf(o.x, o.z) < behind || Math.abs(latOf(o.x, o.z)) > wide;

// ---------- Clouds: eye-level outlines that part around the camera ----------
function drawClouds() {
  for (const c of cloudShapes) {
    respawn(c, spawnCloud, 0.3, 40);
    const d = Math.max(0, fwdOf(c.x, c.z)), n = c.pts.length, y = view.h + c.yRel;
    const b = 0.85 * depthB(d, VIEW_FAR) * clamp((VIEW_FAR - d) / 4, 0, 1);
    const split = d < CLOUD_SPLIT ? 3.5 * Math.pow(1 - d / CLOUD_SPLIT, 1.5) : 0;
    const rx = view.hz, rz = -view.hx;              // faces you: laid out along your right vector
    const half = (from, to, off) => {
      for (let i = from; i < to; i++) {
        const p = c.pts[i % n], q = c.pts[(i + 1) % n];
        const pu = p[0] + off, qu = q[0] + off;
        seg3(c.x + rx * pu, y + p[1], c.z + rz * pu, c.x + rx * qu, y + q[1], c.z + rz * qu, b);
      }
    };
    if (split <= 0) half(0, n, 0);
    else { half(n / 4, (3 * n) / 4, -split); half((3 * n) / 4, n + n / 4, split); }   // left half, right half
  }
}

// ---------- Speed lines: red streaks rushing past once you're flying fast ----------
function drawSpeedLines() {
  const show = clamp((fwdSpeed - 6) / 6 + Math.max(0, thrustEff) + barrelNow() * 0.6, 0, 1);   // surge under thrust / a roll
  const len = fwdSpeed * (0.07 + 0.05 * Math.max(0, thrustEff));
  for (const p of speedLines) {
    if (passed(p, 0.3, 8)) spawnSpeed(p, 14 + Math.random() * 8);
    if (show <= 0) continue;
    const t = clamp(1 - fwdOf(p.x, p.z) / 22, 0, 1);
    seg3(p.x, p.y, p.z, p.x + view.hx * len, p.y, p.z + view.hz * len, show * (0.25 + 0.75 * t * t));
  }
}

// ---------- The far skyline: a jagged range all round, fixed by world bearing ----------
function drawRidge() {
  const half = Math.PI;                               // all the way round (behind-the-camera pieces clip away)
  const hAt = a => 2.5 + 2.2 * Math.abs(Math.sin(a * 3 + RIDGE_SEED)) + 1.6 * Math.sin(a * 7.3 + RIDGE_SEED * 2)
                 + 0.9 * Math.sin(a * 17 + RIDGE_SEED * 3) + 0.5 * Math.sin(a * 41);
  let px = 0, py = 0, pz = 0, has = false;
  for (let i = 0; i <= RIDGE_N; i++) {
    const a = view.yaw - half + (i / RIDGE_N) * half * 2;
    const x = view.x + Math.sin(a) * RIDGE_D, z = travel + Math.cos(a) * RIDGE_D, y = Math.max(0, hAt(a));
    if (has) seg3(px, py, pz, x, y, z, 0.2);
    px = x; py = y; pz = z; has = true;
  }
}

// ============================================================
// v3: the highway at night. Endless poles and sagging wires, motels, gas stations, overpasses,
// and billboards selling the site's own ads, until they start talking about you.
// The higher you climb, the stranger it gets.
// ============================================================
const weirdNow = () => clamp((viewAlt - WEIRD_FROM) / (WEIRD_FULL - WEIRD_FROM), 0, 1);
function hash1(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
// Depth fade for a fixed world point (dim far off, fading in at the far end)
function fadeAt(x, z) {
  const d = Math.hypot(x - view.x, z - travel);
  return d >= VIEW_FAR ? 0 : depthB(d, VIEW_FAR) * clamp((VIEW_FAR - d) / 4, 0, 1);
}
// Parallel highways along z, every HWY_SPACING across x: the ones near enough to see
function roadsNear() {
  const k0 = Math.round(view.x / HWY_SPACING), out = [];
  for (let k = k0 - 1; k <= k0 + 1; k++) { const rx = k * HWY_SPACING; if (Math.abs(rx - view.x) < VIEW_FAR + POLE_X) out.push(rx); }
  return out;
}

// The road: edges and a dashed centre line, sliced so each piece fades by its own distance
function drawHighway() {
  const z0 = travel - VIEW_FAR, z1 = travel + VIEW_FAR, SL = 4;
  for (const rx of roadsNear()) {
    for (let z = Math.floor(z0 / SL) * SL; z < z1; z += SL) {
      for (const x of [rx - HWY_HALF, rx + HWY_HALF]) { const b = fadeAt(x, z + SL / 2); if (b > 0.02) seg3(x, 0, z, x, 0, z + SL, b); }
    }
    for (let z = Math.floor(z0 / (DASH * 2)) * DASH * 2; z < z1; z += DASH * 2) {
      const b = fadeAt(rx, z) * 0.7; if (b > 0.02) seg3(rx, 0, z, rx, 0, z + DASH, b);
    }
  }
}

// Cars on the nearest road: pairs of lights, recycled as they leave the view
function drawCars(dt) {
  const rx = Math.round(view.x / HWY_SPACING) * HWY_SPACING;
  for (const c of cars) {
    c.z += c.v * dt;
    if (c.z - travel > VIEW_FAR) c.z = travel - VIEW_FAR * 0.3;
    else if (c.z - travel < -VIEW_FAR * 0.3) c.z = travel + VIEW_FAR * 0.95;
    const x = rx + c.lane, b = fadeAt(x, c.z);
    if (b <= 0.02) continue;
    wireBlue = c.v < 0;                                   // oncoming: blue headlights; yours: red tail lights
    for (const o of [-0.35, 0.35]) {
      const p = toCam(x + o, 0.45, c.z);
      if (p[2] > NEAR) { const s = toScreen(p); wireDot(s[0], s[1], clamp(40 / p[2], 1.5, 7), Math.min(1, b * 1.3)); }
    }
    wireBlue = false;
  }
}

// Telephone poles both sides of each road, every POLE_GAP, three wires sagging between each pair.
// Computed straight from where the camera is: nothing to spawn, nothing to keep.
// Strange: the poles bend toward the sun and the wires sway; higher still, spans snap and whip.
function drawPoles(now) {
  const w = weirdNow(), t = now / 1000, bend = w * w;
  const snap = clamp((viewAlt - 0.72) / 0.2, 0, 1);
  const k0 = Math.ceil((travel - VIEW_FAR * 0.4) / POLE_GAP), k1 = Math.floor((travel + VIEW_FAR) / POLE_GAP);
  for (const rx of roadsNear()) for (const s of [-1, 1]) {
    const x = rx + s * POLE_X;
    if (Math.abs(x - view.x) > VIEW_FAR) continue;
    const top = k => {
      const z = k * POLE_GAP, dx = SUN_X - x, dz = SUN_Z - z, dl = Math.hypot(dx, dz) || 1;
      const lean = bend * 1.8 * (0.7 + 0.3 * hash1(k * 3 + x));
      return [x + (dx / dl) * lean, POLE_H - bend * 0.3, z + (dz / dl) * lean];
    };
    let T = top(k0);
    for (let k = k0; k <= k1; k++) {
      const z = k * POLE_GAP, b = fadeAt(x, z), T2 = top(k + 1);
      const NS = Math.hypot(x - view.x, z - travel) < 24 ? 6 : 3;     // far spans: fewer wire segments
      if (b > 0.02) {
        const mx = lerp(x, T[0], 0.3), mz = lerp(z, T[2], 0.3);
        seg3(x, 0, z, mx, POLE_H * 0.5, mz, b); seg3(mx, POLE_H * 0.5, mz, T[0], T[1], T[2], b);   // the pole, bending
        const ay = T[1] - 0.15;
        seg3(T[0] - ARM, ay, T[2], T[0] + ARM, ay, T[2], b);                                         // crossarm
        for (const wo of [-ARM * 0.85, 0, ARM * 0.85]) {
          const ax = T[0] + wo, az = T[2], bx = T2[0] + wo, by = T2[1] - 0.15, bz = T2[2];
          if (snap > 0 && hash1(k * 7.3 + x * 3.1 + wo * 11) < snap * 0.6) {
            for (const [ox, oy, oz, dir] of [[ax, ay, az, 1], [bx, by, bz, -1]]) {     // snapped: both ends hang and whip
              let px = ox, py = oy, pz = oz;
              for (let i = 1; i <= 4; i++) {
                const u = i / 4, whip = Math.sin(t * 9 + k * 1.7 + i + dir) * 0.7 * u;
                const qx = ox + whip, qy = oy - u * 2.2, qz = oz + dir * u * POLE_GAP * 0.18;
                seg3(px, py, pz, qx, qy, qz, b); px = qx; py = qy; pz = qz;
              }
            }
          } else {                                                                      // a catenary, swaying when strange
            let px = ax, py = ay, pz = az;
            const sway = 1 + w * 0.8 * Math.sin(t * 3 + k + wo * 5);
            for (let i = 1; i <= NS; i++) {
              const u = i / NS, sag = WIRE_SAG * 4 * u * (1 - u) * sway;
              const qx = lerp(ax, bx, u), qy = lerp(ay, by, u) - sag, qz = lerp(az, bz, u);
              seg3(px, py, pz, qx, qy, qz, b * 0.85); px = qx; py = qy; pz = qz;
            }
          }
        }
      }
      T = T2;
    }
  }
}

// Overpasses: a deck across each road on pillars, every OVERPASS_GAP
function drawOverpasses() {
  const m0 = Math.ceil((travel - VIEW_FAR * 0.3 - OVERPASS_AT) / OVERPASS_GAP), m1 = Math.floor((travel + VIEW_FAR - OVERPASS_AT) / OVERPASS_GAP);
  for (const rx of roadsNear()) for (let m = m0; m <= m1; m++) {
    const z = OVERPASS_AT + m * OVERPASS_GAP, b = fadeAt(rx, z) * 0.9;
    if (b <= 0.02) continue;
    const y = 2.6, half = 14, th = 0.45, dz = 1.2;
    for (const zz of [z - dz, z + dz]) {
      seg3(rx - half, y, zz, rx + half, y, zz, b); seg3(rx - half, y + th, zz, rx + half, y + th, zz, b);   // deck
      seg3(rx - half, y + th + 0.5, zz, rx + half, y + th + 0.5, zz, b * 0.6);                              // railing
    }
    for (const px of [-HWY_HALF - 1, HWY_HALF + 1, -10, 10]) {
      seg3(rx + px, 0, z - dz, rx + px, y, z - dz, b); seg3(rx + px, 0, z + dz, rx + px, y, z + dz, b);     // pillars
    }
  }
}

// Queue a sign's lettering: the top-left, top-right and bottom-left corners of its face (world)
function queueSign(tl, tr, bl, lines, blue, seed, b) {
  const a = toCam(...tl), c = toCam(...tr), d = toCam(...bl);
  if (a[2] < NEAR * 4 || c[2] < NEAR * 4 || d[2] < NEAR * 4) return;
  const p0 = toScreen(a), p1 = toScreen(c), p3 = toScreen(d);
  if (Math.hypot(p1[0] - p0[0], p1[1] - p0[1]) < 30) return;          // too small to read
  if (signText.length < 12) signText.push({ pts: [p0, p1, p3], lines, blue, seed, b });
}

// Billboards: frame, legs, catwalk. Strange: they rise on impossible legs to meet you, and the ads turn to you.
function drawBillboards() {
  const w = weirdNow(), rise = Math.pow(w, 1.5);
  let nearest = Infinity;
  for (const bb of billboards) {
    respawn(bb, spawnBillboard, -1, 45);
    const d = distOf(bb), b = sceneryB(d);
    if (b <= 0.02) continue;
    bb.reroll -= dtWorld;
    if (bb.reroll <= 0) { bb.reroll = 3 + Math.random() * 5; if (Math.random() < 0.15 + w) pickAd(bb); }
    const L = bb.leg + rise * Math.max(0, view.h - bb.h * 0.6 - bb.leg) * (0.75 + 0.25 * hash1(bb.seed));
    const ax = bb.ax, az = bb.az;
    const corner = (u, v) => [bb.x + ax * u, L + v, bb.z + az * u];
    const c = [corner(0, bb.h), corner(bb.w, bb.h), corner(bb.w, 0), corner(0, 0)];
    nearest = Math.min(nearest, Math.hypot(d, L + bb.h / 2 - view.h));
    wireBlue = bb.blue;
    for (let i = 0; i < 4; i++) seg3(...c[i], ...c[(i + 1) % 4], b);
    for (const u of [bb.w * 0.25, bb.w * 0.75]) { const p = corner(u, 0); seg3(p[0], 0, p[2], p[0], L, p[2], b * 0.8); }   // legs
    seg3(...corner(-0.2, -0.25), ...corner(bb.w + 0.2, -0.25), b * 0.6);                                                    // catwalk
    for (const u of [0.15, 0.5, 0.85]) seg3(...corner(bb.w * u, -0.25), ...corner(bb.w * u - 0.25, -0.6), b * 0.6);         // lamps
    wireBlue = false;
    queueSign(c[0], c[1], c[3], bb.ad, bb.blue, bb.seed, b);
  }
  for (const m of motels) nearest = Math.min(nearest, Math.hypot(distOf(m), m.h - view.h));
  neonNear = clamp(1 - nearest / 14, 0, 1);
}

function drawMotels() {
  for (const m of motels) {
    respawn(m, spawnMotel, -1, 45);
    const b = sceneryB(distOf(m));
    if (b <= 0.02) continue;
    const P = (u, y) => [m.x + m.ax * u, y, m.z + m.az * u];
    const sw = 2.6, y0 = m.h - 1.1;
    seg3(...P(0, 0), ...P(0, y0), b);                                     // the pole
    wireBlue = true;
    const box = [P(-sw / 2, m.h), P(sw / 2, m.h), P(sw / 2, y0), P(-sw / 2, y0)];
    for (let i = 0; i < 4; i++) seg3(...box[i], ...box[(i + 1) % 4], b);
    const ar = [P(sw / 2 + 0.2, y0 - 0.1), P(sw / 2 + 0.9, y0 - 0.45), P(sw / 2 + 0.2, y0 - 0.8)];   // the arrow
    seg3(...ar[0], ...ar[1], b); seg3(...ar[1], ...ar[2], b);
    wireBlue = false;
    queueSign(box[0], box[1], box[3], ["MOTEL", m.vacancy ? "VACANCY" : "NO VACANCY"], true, m.seed, b);
  }
}

function drawGas() {
  for (const g of gasStations) {
    respawn(g, spawnGas, -1, 45);
    const b = sceneryB(distOf(g));
    if (b <= 0.02) continue;
    const ax = g.ax, az = g.az, fx = -az, fz = ax;                 // across, and away along the heading
    const P = (u, y, v) => [g.x + ax * u + fx * v, y, g.z + az * u + fz * v];
    const c = [P(0, g.h, 0), P(g.w, g.h, 0), P(g.w, g.h, g.d), P(0, g.h, g.d)];
    const top = c.map(p => [p[0], p[1] + 0.9, p[2]]);               // the tall fascia
    for (let i = 0; i < 4; i++) { seg3(...c[i], ...c[(i + 1) % 4], b); seg3(...top[i], ...top[(i + 1) % 4], b * 0.7); seg3(...c[i], ...top[i], b * 0.7); }
    for (const [u, v] of [[0.4, 0.4], [g.w - 0.4, 0.4], [0.4, g.d - 0.4], [g.w - 0.4, g.d - 0.4]]) seg3(...P(u, 0, v), ...P(u, g.h, v), b * 0.8);
    wireBlue = true;
    for (const u of [g.w * 0.33, g.w * 0.66]) {                    // pumps
      const a = P(u - 0.2, 0, g.d / 2), q = P(u + 0.2, 0, g.d / 2);
      seg3(a[0], 0, a[2], a[0], 1.1, a[2], b * 0.7); seg3(q[0], 0, q[2], q[0], 1.1, q[2], b * 0.7); seg3(a[0], 1.1, a[2], q[0], 1.1, q[2], b * 0.7);
    }
    wireBlue = false;
    queueSign(top[0], top[1], c[0], ["GAS · 24 HRS", "feelings extra."], false, g.seed, b);
  }
}

// The lettering, after the wires: the site's bold italic serif with its hard black outline, mapped onto
// each face. Neon buzz: a sign cuts out for a beat now and then. Strange: letters turn Greek.
// Near the top: the ads melt, letters sliding down and stretching.
function drawSigns(now) {
  if (!signText.length) return;
  const BWv = 400, BHv = 168, w = weirdNow();
  const melt = clamp((viewAlt - MELT_ADS) / (1 - MELT_ADS), 0, 1);
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  for (const s of signText) {
    if (hash1(s.seed + Math.floor(now / 70)) < 0.04 + 0.12 * w) continue;     // neon buzz: off for a beat
    const [p0, p1, p3] = s.pts;
    ctx.setTransform((p1[0] - p0[0]) / BWv, (p1[1] - p0[1]) / BWv, (p3[0] - p0[0]) / BHv, (p3[1] - p0[1]) / BHv, p0[0], p0[1]);
    ctx.globalAlpha = clamp(s.b * 1.3, 0, 1) * (0.85 + 0.15 * Math.random());
    signLine(s.lines[0], BWv / 2, 66, 54, s.blue ? BLUE : RED, melt, s.seed, w, now);
    signLine(s.lines[1], BWv / 2, 126, 28, s.blue ? RED : BLUE, melt, s.seed + 9, w, now);
  }
  ctx.restore();
  signText = [];
}
function signLine(str, cx, cy, size, col, melt, seed, w, now) {
  let txt = str;
  if (w > 0) {
    const tick = Math.floor(now / 140);
    txt = [...txt].map((ch, i) => (ch !== " " && hash1(seed + i * 13 + tick) < w * 0.14 ? GREEK[(i * 7 + tick) % GREEK.length] : ch)).join("");
  }
  txt = glitchText(txt);
  ctx.font = `italic 700 ${size}px ${SF}`;
  let width = ctx.measureText(txt).width;
  if (width > 380) { size = Math.floor(size * 380 / width); ctx.font = `italic 700 ${size}px ${SF}`; width = ctx.measureText(txt).width; }
  ctx.lineWidth = Math.max(3, size * 0.16); ctx.strokeStyle = "#000"; ctx.fillStyle = col;
  if (melt <= 0) { ctx.strokeText(txt, cx, cy); ctx.fillText(txt, cx, cy); return; }
  // melting: letter by letter, each sliding down and stretching at its own pace
  const chars = [...txt], a0 = ctx.globalAlpha;
  let x = cx - width / 2;
  for (let i = 0; i < chars.length; i++) {
    const cw = ctx.measureText(chars[i]).width, k = hash1(seed + i * 3.7);
    const drop = melt * melt * (40 + 200 * k) * (0.7 + 0.3 * Math.sin(now / 900 + i));
    ctx.save();
    ctx.globalAlpha = a0 * (1 - melt * 0.6 * k);
    ctx.translate(x + cw / 2, cy + drop);
    ctx.scale(1, 1 + melt * 1.8 * k);
    ctx.strokeText(chars[i], 0, 0); ctx.fillText(chars[i], 0, 0);
    ctx.restore();
    x += cw;
  }
}

// ---------- The sun melting: drips fall off its sagging rim and past you ----------
function updateDrips(dt, s) {
  const m = s.melt || 0;
  if ((mode === "live" || mode === "melt") && s.r > 4 && m > 0.05) {
    const n = Math.min(4, Math.floor(m * m * 45 * dt + Math.random()));
    for (let i = 0; i < n && sunDrips.length < DRIP_CAP; i++) {
      const a = (0.12 + 0.76 * Math.random()) * Math.PI;           // somewhere on the lower rim
      const sag = m * 0.55 * Math.pow(Math.max(0, Math.sin(a) + 0.25), 2);
      sunDrips.push({ x: s.x + Math.cos(a) * s.r * (1 + m * 0.12), y: s.y + Math.sin(a) * s.r * (1 + sag),
                      vx: (Math.random() - 0.5) * 30, vy: 20 + Math.random() * 80, size: 1.5 + Math.random() * 2.5 * (1 + m) });
    }
  }
  const g = 500 + 900 * m;
  sunDrips = sunDrips.filter(d => { d.vy += g * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.size *= 1 + 0.25 * dt; return d.y < H + 100; });
  // The wings' wax: drops running in from the edges of the frame, with the hands' burning
  const hot = Math.max(heat, burnAmt);
  if ((mode === "live" || mode === "melt") && hot > 0.1 && edgeDrips.length < EDGE_CAP && Math.random() < hot * hot * 14 * dt) {
    const left = Math.random() < 0.5;
    edgeDrips.push({ x: left ? Math.random() * W * 0.08 : W - Math.random() * W * 0.08, y: -10 - Math.random() * H * 0.2,
                     vy: 40 + Math.random() * 90, size: 2.5 + Math.random() * 3.5, c: WAX_COLORS[(Math.random() * WAX_COLORS.length) | 0] });
  }
  edgeDrips = edgeDrips.filter(d => { d.vy += 480 * dt; d.y += d.vy * dt; return d.y < H + 80; });
}
function drawDrips() {
  if (!sunDrips.length && !edgeDrips.length) return;
  ctx.save();
  ctx.lineCap = "round";
  if (sunDrips.length) {
    const p = new Path2D();
    for (const d of sunDrips) { const len = clamp(d.vy * 0.05, 4, 90) * (1 + d.size * 0.15); p.moveTo(d.x - d.vx * 0.03, d.y - len); p.lineTo(d.x, d.y); }
    ctx.globalAlpha = 0.28; ctx.strokeStyle = RED; ctx.lineWidth = 8; ctx.stroke(p);           // glow
    ctx.globalAlpha = 0.95; ctx.strokeStyle = "rgb(255, 160, 70)"; ctx.lineWidth = 2.4; ctx.stroke(p);   // hot core
  }
  ctx.globalAlpha = 0.9;
  for (const d of edgeDrips) {
    const len = clamp(d.vy * 0.06, 6, 70);
    ctx.strokeStyle = d.c; ctx.lineWidth = d.size;
    ctx.beginPath(); ctx.moveTo(d.x, d.y - len); ctx.lineTo(d.x, d.y); ctx.stroke();
  }
  ctx.restore();
}

// ============================================================
// THE ORACLE: a digital magic 8-ball rising out of dark water
// ============================================================
const ICO = (() => {
  const p = (1 + Math.sqrt(5)) / 2;
  const v = [[-1, p, 0], [1, p, 0], [-1, -p, 0], [1, -p, 0], [0, -1, p], [0, 1, p], [0, -1, -p], [0, 1, -p], [p, 0, -1], [p, 0, 1], [-p, 0, -1], [-p, 0, 1]]
    .map(a => { const l = Math.hypot(...a); return a.map(c => c / l); });
  const e = [];
  for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) if (Math.hypot(v[i][0] - v[j][0], v[i][1] - v[j][1], v[i][2] - v[j][2]) < 1.1) e.push([i, j]);
  return { v, e };   // 12 vertices, 30 edges
})();

function wrapText(txt, maxW) {
  const lines = [];
  let cur = "";
  for (const wd of txt.split(" ")) {
    const t = cur ? cur + " " + wd : wd;
    if (cur && ctx.measureText(t).width > maxW) { lines.push(cur); cur = wd; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawOracle(now) {
  const o = oracle, t = (now - o.start) / 1000;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  if (t < ORACLE_DARK) return;                               // black, and quiet
  const u = smooth01(clamp((t - ORACLE_DARK) / ORACLE_RISE, 0, 1));
  const R = Math.min(W, H) * 0.3, waterY = H * 0.74;
  const cx = W / 2, cy = lerp(H + R * 1.3, H * 0.4, u) + (u >= 1 ? Math.sin(t * 0.9) * R * 0.02 : 0);
  ctx.save();
  // the ball: a dark blue liquid window, specks drifting in it
  const g = ctx.createRadialGradient(cx, cy - R * 0.25, R * 0.1, cx, cy, R);
  g.addColorStop(0, "rgb(16, 16, 96)"); g.addColorStop(1, "#000");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.7; ctx.strokeStyle = BLUE; ctx.lineWidth = 2; ctx.stroke();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R - 2, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = BLUE;
  for (let i = 0; i < 40; i++) {
    const px = cx + (hash1(i) - 0.5) * 2 * R + Math.sin(t * 0.3 + i) * 10;
    const py = cy - R + ((hash1(i + 50) * 2 * R + t * 8 * (0.5 + hash1(i + 90))) % (2 * R));
    ctx.globalAlpha = 0.25 + 0.2 * Math.sin(t + i); ctx.fillRect(px, py, 2, 2);
  }
  // the icosahedron, turning slowly, glowing
  const rs = R * 0.7, ay = t * 0.35, ax = 0.45 + Math.sin(t * 0.21) * 0.25;
  const cyA = Math.cos(ay), syA = Math.sin(ay), cxA = Math.cos(ax), sxA = Math.sin(ax);
  const P = ICO.v.map(([x, y, z]) => {
    const x1 = x * cyA + z * syA, z1 = -x * syA + z * cyA;
    const y1 = y * cxA - z1 * sxA, z2 = y * sxA + z1 * cxA;
    const k = 3 / (3 + z2);
    return [cx + x1 * rs * k, cy + y1 * rs * k, z2];
  });
  ctx.lineWidth = 2; ctx.strokeStyle = BLUE; ctx.shadowColor = BLUE; ctx.shadowBlur = 18;
  for (const back of [true, false]) {
    ctx.globalAlpha = back ? 0.25 : 0.95;
    ctx.beginPath();
    for (const [i, j] of ICO.e) if ((P[i][2] + P[j][2] > 0) === back) { ctx.moveTo(P[i][0], P[i][1]); ctx.lineTo(P[j][0], P[j][1]); }
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  // the window: the triangle facing you, where the answer floats up
  const tr = R * 0.66;
  ctx.globalAlpha = 0.9; ctx.fillStyle = "rgb(8, 8, 48)"; ctx.strokeStyle = BLUE; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 3; i++) { const a = Math.PI / 2 + (i * Math.PI * 2) / 3; ctx[i ? "lineTo" : "moveTo"](cx + Math.cos(a) * tr, cy - tr * 0.2 + Math.sin(a) * tr); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();   // (the ball's clip)
  // the water, over the ball's lower part: slow blue swell lines
  ctx.globalAlpha = 1; ctx.fillStyle = "#000"; ctx.fillRect(0, waterY, W, H - waterY);
  ctx.strokeStyle = BLUE; ctx.lineWidth = 1.5;
  for (let k = 0; k < 7; k++) {
    const y = waterY + k * k * 7;
    ctx.globalAlpha = 0.45 * (1 - k / 7) * clamp(t - ORACLE_DARK, 0, 1);
    ctx.beginPath();
    for (let x = 0; x <= W; x += 16) { const yy = y + Math.sin(x * 0.01 + t * 0.8 + k) * (3 + k); x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); }
    ctx.stroke();
  }
  // the truth, letter by letter, glitching in: the site's type with its hard outline
  const T0 = ORACLE_DARK + ORACLE_RISE;
  if (t >= T0) {
    const text = o.truth.text, n = Math.min(text.length, Math.floor(((t - T0) * 1000) / LETTER_MS));
    let shown = [...text.slice(0, n)].map(c => (c !== " " && Math.random() < 0.025 ? GREEK[(Math.random() * GREEK.length) | 0] : c)).join("");
    if (n < text.length) shown += GREEK[(Math.random() * GREEK.length) | 0];        // the next letter, still static
    const fs = Math.round(R * 0.12);
    ctx.font = `italic 700 ${fs}px ${SF}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    const lines = wrapText(shown, tr * 1.05);
    ctx.globalAlpha = 1;
    lines.forEach((ln, i) => {
      const y = cy - tr * 0.42 + (i - (lines.length - 1) / 2) * fs * 1.1;
      ctx.lineWidth = Math.max(4, fs * 0.18); ctx.strokeStyle = "#000"; ctx.strokeText(ln, cx, y);
      ctx.fillStyle = RED; ctx.fillText(ln, cx, y);
    });
    // tiny text under it (on the canvas, so it's in the clip too)
    ctx.font = `16px "Courier New", Courier, monospace`;
    ctx.fillStyle = BLUE; ctx.globalAlpha = clamp((t - T0) / 1.5, 0, 1);
    const count = o.final ? `ALL ${o.total} LEARNED · THE CYCLE BEGINS AGAIN`
      : `TRUTH ${String(o.learned).padStart(2, "0")} OF ${o.total} LEARNED`;
    ctx.fillText(count, cx, waterY + 26);
    if (o.hint) { ctx.fillStyle = RED; ctx.fillText(o.hint, cx, waterY + 48); }
    ctx.fillStyle = "rgb(170, 0, 0)"; ctx.font = `12px "Courier New", Courier, monospace`;
    ctx.fillText("ICARUS · LIVE.AND.DIE", cx, 24);
  }
  ctx.restore();
}

// The Oracle's timeline: speak as the letters start; the buttons once it's complete; then end the clip
function updateOracle(now) {
  const o = oracle, t = (now - o.start) / 1000, T0 = ORACLE_DARK + ORACLE_RISE;
  if (!o.spoken && t >= T0) { o.spoken = true; speakTruth(o.truth.text); }
  const done = T0 + (o.truth.text.length * LETTER_MS) / 1000;
  if (!o.shown && t >= done + 0.8) {
    o.shown = true;
    $("voiceBtn").textContent = voiceOn ? "VOICE: ON" : "VOICE: OFF";
    $("results").classList.remove("hidden");
  }
  if (recorder && t >= done + CLIP_TAIL) stopRecording();
}

// The whole world, in one batched stroke pass, then scanlines
function drawWorld(now, dt, sun) {
  beginWire();
  dtWorld = dt;
  // During the long fall the land gives way to the sea once the nose is down
  const fallT = mode === "melt" ? (now - meltStart) / 1000 : -1;
  const land = fallT < FALL_UP * 0.8;
  if (land) {
    drawRidge();
    drawGround();
    drawHighway();
    drawCars(dt);
    drawPoles(now);
    drawOverpasses();
    drawBillboards();
    drawMotels();
    drawGas();
    drawClouds();
    drawSpeedLines();
  } else { neonNear = 0; signText = []; }
  if (fallT >= FALL_UP * 0.5) drawSea(now, clamp((fallT - FALL_UP * 0.5) / 0.6, 0, 1));
  drawHorizon();
  drawGhosts();
  drawFather();
  drawFigures();
  drawSunWithLies(now, sun);
  flushWire();
  drawSigns(now);                     // the lettering, over its own sign frames
  drawScanlines();
}

// ---------- Wax ----------
function spawnWax(dt) {
  const hot = Math.max(heat, burnAmt);
  if (hot < 0.04 || !handTips.length) return;
  const rate = hot * hot * 6;             // drops per second, per fingertip
  for (const tip of handTips) {
    if (wax.length >= WAX_CAP) return;
    if (Math.random() < rate * dt) {
      wax.push({
        x: tip.x + (Math.random() - 0.5) * 4, y: tip.y,
        vx: (Math.random() - 0.5) * 30, vy: 20 + Math.random() * 60,
        size: 2 + Math.random() * 1.5 + heat, c: WAX_COLORS[(Math.random() * WAX_COLORS.length) | 0], life: 0,
      });
    }
  }
}

function drawWax(dt) {
  ctx.globalAlpha = 0.9;
  wax = wax.filter(p => {
    p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life += dt;
    if (p.y > H + 10 || p.life > 3) return false;
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    return true;
  });
  ctx.globalAlpha = 1;
}

// ---------- Feathers ----------
function drawFeathers(dt) {
  ctx.fillStyle = "#fff";
  feathers = feathers.filter(p => {
    p.life += dt;
    if (p.life > p.max) return false;
    p.vy += 60 * dt; p.vx *= 1 - 1.5 * dt; p.vy *= 1 - 1.5 * dt;
    p.x += p.vx * dt + Math.sin(p.life * 4 + p.ph) * 25 * dt;
    p.y += p.vy * dt;
    ctx.globalAlpha = 0.85 * (1 - p.life / p.max);
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    return true;
  });
  ctx.globalAlpha = 1;
}

function render(now, dt) {
  // Renderer failing: sometimes it just doesn't draw a new frame (the world keeps moving)
  if (stutterLeft > 0) { stutterLeft--; return; }
  if (Math.random() < glitchAmt() * 0.05) stutterLeft = 1 + ((Math.random() * 3) | 0);

  if (mode === "oracle" && oracle) { drawOracle(now); updateOracle(now); return; }

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  drawRain();                         // Greek rain, behind everything

  const sun = sunState(now);
  updateDrips(dt, sun);

  if (mode === "melt") {
    const t = (now - meltStart) / 1000;
    drawWorld(now, dt, sun);
    drawDrips();                      // the sun's drips and the wings' wax, falling with you
    drawBody(now);                    // CRASH: bones over the camera; you fall through the gaps
    drawWax(dt);
    drawFeathers(dt);
    drawVisor();                      // the drops slide off as you fall
    // Just before the water, one line (and its whisper)
    if (t >= FALL_TEXT_AT) {
      if (!fallWhispered) { fallWhispered = true; whisper(); }
      caption("he also flew.", (t - FALL_TEXT_AT) / 0.5);
    }
    return;
  }

  drawWorld(now, dt, sun);
  tearFrame();                        // lines tear and offset at high heat
  drawDrips();                        // the sun melting past you; wax running off the wings at the edges
  drawBody(now);                      // the hands, burning to the bone as heat rises
  drawWax(dt);
  drawFeathers(dt);
  drawVisor();                        // wax on the lens, over everything
  if (mode === "live" && now < lieTextUntil) caption("that's not the sun", Math.min(1, (lieTextUntil - now) / 600), H * 0.6);
}

// ============================================================
// Main loop
// ============================================================
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  step(now, dt);
  render(now, dt);
}

// ============================================================
// Setup
// ============================================================
$("reach").onclick = async () => {
  const btn = $("reach");
  btn.disabled = true;
  try {
    const motion = requestMotion();   // first: iOS only allows the permission prompt inside the tap
    primeSpeech();                    // speech is only allowed after a tap: unlock it now for the Oracle
    loadTruths();
    recalibrate();                    // "level" = however the phone is held right now
    audio = initAudio();              // must happen inside the tap
    await audio.ac.resume();
    await motion;

    // Go fullscreen and landscape (both must start inside the tap), then resize to match
    try { await document.documentElement.requestFullscreen({ navigationUI: "hide" }); } catch (e) { console.warn("Fullscreen failed", e); }
    try { await screen.orientation.lock("landscape"); } catch (e) { console.warn("Orientation lock failed", e); }
    await new Promise(res => setTimeout(res, 150));
    fit();

    $("intro").classList.add("hidden");
    mode = "live";
    loop();
  } catch (e) {
    console.error(e);
    btn.textContent = "Error · retry";
    btn.disabled = false;
  }
};

$("again").onclick = () => {
  if (!document.fullscreenElement) {
    try { document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(e => console.warn("Fullscreen failed", e)); }
    catch (e) { console.warn("Fullscreen failed", e); }
  }
  $("results").classList.add("hidden");
  $("truthsPage").hidden = true;
  oracle = null;
  try { speechSynthesis.cancel(); } catch (e) { /* no speech */ }
  stopRecording();
  altitude = 0; altVel = 0; heat = 0; seaSince = 0;
  wax = []; feathers = []; figures = []; visorDrops = []; frags = []; burnt.clear();
  lie = null; lieTextUntil = 0; tilt = null;
  barrel = null; vloop = null; barrelCool = 0; rollHist.length = 0; pitchHist.length = 0;
  embers = []; burnAmt = 0;
  // Back to the start, facing the sun; the world is laid out fresh ahead
  view.x = 0; travel = 0; view.yaw = 0; view.hx = 0; view.hz = 1; view.cy = 1; view.sy = 0;
  view.h = CAM_H_SEA; view.pitch = 0; bank = 0; yawRate = 0; fwdSpeed = SPEED_BASE;
  father.x = 0; father.z = FATHER_AHEAD;
  respawnAll();
  recalibrate();                      // "level" = however the phone is held when you tap
  releaseVoice();                     // drop any leftover melt automation
  if (audio) audio.oracleGain.gain.setTargetAtTime(0, audio.ac.currentTime, 0.3);
  sunDrips = []; edgeDrips = [];
  mode = "live";
};

$("voiceBtn").onclick = () => {
  voiceOn = !voiceOn;
  try { localStorage.setItem(VOICE_KEY, voiceOn ? "1" : "0"); } catch (e) { /* private mode */ }
  $("voiceBtn").textContent = voiceOn ? "VOICE: ON" : "VOICE: OFF";
  if (!voiceOn) { try { speechSynthesis.cancel(); } catch (e) { /* no speech */ } }
  else if (oracle) speakTruth(oracle.truth.text);
};
$("saveClip").onclick = () => saveClip();
$("truthsBtn").onclick = $("truthsBtn2").onclick = () => showTruths();
$("truthsClose").onclick = () => { $("truthsPage").hidden = true; };

// Browsers may suspend audio in the background; wake it on return
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && audio) audio.ac.resume();
});
</script>
