const GREEK = "ΓΔΘΛΞΠΣΦΨΩαβδλμπ";   // the Greek the panel's font has

const LATIN = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*+=<>/\\|?!";

// The body: two rendered wireframe hands at the lower corners
const HAND_BASE = [0.42, -0.62, 1.0]; // right hand's wrist in camera space (left is mirrored)
const HAND_SCALE = 0.42;              // hand length in camera units
const HAND_PITCH = 0.6;               // fingers tipped forward, away from you (radians about x)
const HAND_INWARD = 0.25;             // tilted in toward the centre (radians about z)
const BURN_TIP = 0.15, BURN_WRIST = 0.95;            // burn amount where fingertips / wrist flesh burns away
const BURN_LIVE = 0.3;                // how far the sun's heat alone chars them (the rest burns in the fall)

const COVER_IN = 0.8;                 // melt: seconds for the hands to rise over the camera
const COVER_OUT_AT = FALL_TIME - 1.2, COVER_OUT = 0.6;   // ...and when / how fast they drop away
const FEATHER_CAP = 50;
const WAX_CAP = 110;
const WAX_COLORS = [255, 170, 255, 170];   // brightness levels on the panel

// ---------- v3: the highway (all in world units) ----------
const SF = '"Times New Roman", Times, "Liberation Serif", serif';   // (the title logo only)
const HWY_SPACING = 48;               // parallel highways every this far across x: wherever you turn, there's a road
const HWY_HALF = 3.2, DASH = 2;       // road half-width, centre-line dash length
const POLE_GAP = 7, POLE_X = 6.4, POLE_H = 3.4, ARM = 0.75, WIRE_SAG = 0.5;   // telephone poles + wires
const OVERPASS_GAP = 120, OVERPASS_AT = 70;
const CAR_N = 6, BILL_N = 6, MOTEL_N = 2, GAS_N = 2;
// The site's own classifieds, [big, small]
const ADS = [
  ["HOT SINGLES IN YOUR AREA", "they have been waiting since 2007."], ["WE BUY TEETH", "top dollar. bring your own."],
  ["BAIL BONDS — 24 HRS", "we come to you."], ["JESUS SAVES", "terms apply."], ["COMBO #4", "burger, fries, dissociative. $6.99"],
  ["NO CREDIT CHECK", "cash today. 2,000% APR."], ["ANGEL DUST® — FAMILY SIZE", "operators are standing by."],
  ["YOUR CHILDHOOD — RESTOCKED", "while supplies last."], ["ASK YOUR DOCTOR", "if it is right for you."],
  ["SCRATCH & WIN", "everyone is a winner."], ["YOU ARE THE 1,000,000TH VISITOR", "you have won a feeling."],
  ["FREEDOM™ — NOW IN RED", "zero down. zero APR. zero."], ["ACID BY THE SHEET", "buy 9, get the 10th free."],
  ["THIS SPACE FOR RENT", "high traffic. low feelings."], ["REVISIT KIT: ONE TUESDAY, 2007", "relive it. again. again."],
  ["YOUR COMPUTER MAY BE INFECTED", "with a feeling. tap to remove."], ["HE VOTED AGAINST YOUR FEELINGS", "paid for by Americans for America."],
  ["XXX ¤ LIVE ¤ UNCENSORED", "must be 18+. must be something."],
];
// ...until they start talking about you
const YOU_ADS = [
  ["WE SEE YOU", "you are flying too high."], ["YOU LOOK TIRED", "have you tried landing?"], ["TURN BACK", "this is your last exit."],
  ["YOU ARE ALREADY HERE", "next exit: you."], ["WE BUY WINGS", "any condition. cash."], ["SMILE", "the sun is watching."],
  ["YOUR FATHER CALLED", "he says come down."], ["HOT SUN IN YOUR AREA", "it has been waiting for you."],
];
const WEIRD_FROM = 0.45, WEIRD_FULL = 0.78;   // altitude where the world starts getting strange / is fully strange
const MELT_ADS = 0.82;                // altitude where the ads melt
const DRIP_CAP = 140, EDGE_CAP = 60;  // sun drips, wing-wax drips from the frame edges
// ---------- v3: the Oracle ----------
const TRUTH_KEY = "icarus.truths.v1", VOICE_KEY = "icarus.voice.v1";
const ORACLE_DARK = 1.6;              // seconds of black and quiet after the water
const ORACLE_RISE = 3.4;              // seconds for the 8-ball to rise
const LETTER_MS = 75;                 // the truth fades on, letter by letter
const DEEP_HEAT = 0.9;                // max heat a flight needs for a deep truth
const CLIP_TAIL = 3;                  // seconds the clip holds on the truth once it's complete

// ============================================================
// DOM + state
// ============================================================
const $ = id => document.getElementById(id);
const canvas = $("canvas"), ctx = canvas.getContext("2d");

// The visible canvas: the panel upscaled x3 (x2 per eye in 3D), shown as large as fits, letterboxed.
// (It's also what the clip records, so shares stay crisp.)
function fit() {
  const eyes = stereo ? 2 : 1, k = stereo ? 2 : 3;
  const cw = FB_W * eyes * k, ch = FB_H * k;
  if (canvas.width !== cw) canvas.width = cw;
  if (canvas.height !== ch) canvas.height = ch;
  const iw = innerWidth || cw, ih = innerHeight || ch, sc = Math.min(iw / cw, ih / ch);
  canvas.style.width = Math.floor(cw * sc) + "px";
  canvas.style.height = Math.floor(ch * sc) + "px";
  ctx.imageSmoothingEnabled = false;
}
const portrait = () => innerHeight > innerWidth * 1.05;
let audio = null;

let mode = "title";           // title | boot | warning | align | live | melt | oracle
let altitude = 0;             // 0..1, a physics value driven by the phone's pitch
let altVel = 0;               // altitude units / s
let heat = 0;                 // 0..1
let flight = null;            // { start } while a flight is in progress
let seaSince = 0;             // when you last sank back to sea level during a flight
let meltStart = 0, meltSunR = 0;
let lastFrame = performance.now();

// Gyro input: raw orientation, the "level" it's measured from, and the shaped inputs
const gyro = { beta: null, gamma: null, beta0: 0, gamma0: 0, calibrate: true, seen: false };
const keys = new Set();       // desktop fallback: arrow keys / WASD
let pitchIn = 0, rollIn = 0;  // −1..1: climb(+)/dive(−), roll right(+)/left(−)

// Camera (updated every frame in updateView). pitch > 0 looks up; roll > 0 = banked left.
// yaw > 0 = heading right. The camera flies along its heading (hx, hz).
const view = { x: 0, h: CAM_H_SEA, yaw: 0, pitch: 0, roll: 0, cy: 1, sy: 0, hx: 0, hz: 1, cp: 1, sp: 0, cr: 1, sr: 0 };
let focal = FOCAL;                    // widens (smaller) in a dive
let viewAlt = 0;                      // altitude the camera shows (falls during the melt)
let travel = 0;                       // the camera's world z
const camOff = { x: 0, y: 0, z: 0 };  // temporary camera displacement (the barrel roll's helix)
let barrel = null;                    // { start, dir }: a barrel roll in progress (dir +1 right, −1 left)
let barrelCool = 0;                   // seconds until another may start
const rollHist = [], pitchHist = [];  // recent [time, input] pairs, for flick detection
let lastTap = { t: -1e9, x: 0 };      // for double-tap barrel rolls
let swipe = null;                     // { t, y } pointer-down, for swipe-up loops
let vloop = null;                     // { start }: a loop in progress
let burnAmt = 0;                      // 0..1+: how far the hands have burnt (tips first, wrist last)
let embers = [];                      // sparks off the burning edge: { x, y, vx, vy, life, max }
let fwdSpeed = SPEED_BASE;            // world units / s, always forward
let bank = 0, bankTarget = 0;         // camera roll from the phone's roll
let yawRate = 0, yawTarget = 0;       // turn rate from the phone's roll
let thrustEff = 0;                    // 0..1: how hard you're diving (drives speed, FOV, speed lines, engine)
let sunAim = 0;                      // 1 = sun dead centre, 0 = outside the aim cone
let meltAlt0 = 0, meltPitch0 = 0, meltH0 = CAM_H_SEA, meltBurn0 = 0;
let meltX0 = 0, meltZ0 = 0, meltYaw0 = 0, meltHx = 0, meltHz = 1;   // where the fall began

let figures = [];                     // the ones before you
const father = { x: 0, z: FATHER_AHEAD };
let ghosts = loadGhosts();            // past flights: flat [fwd, lat, h, fwd, lat, h, ...]
let ghostPath = [], lastGhostRec = 0; // the flight being recorded
let flightOrigin = null;              // { x, z, hx, hz } at take-off; ghosts are laid out from here
let lie = null;                       // { start, end, kind, dx, dy }: the sun lying to you
let lieTextUntil = 0;
let fallWhispered = false;

let visorDrops = [];                  // wax on the lens
let stutterLeft = 0;                  // frames to hold (renderer failing)
let tilt = null;                      // { start, end, amt }: the horizon tilting on its own

// The body: rendered hands (screen-space results kept for wax, feathers and burn fragments)
let handTips = [];                    // fingertip screen points this frame
let handPtsScreen = [];               // a few screen points on the hands, for feathers
const burnt = new Set();              // flesh segment ids already burnt off (so fragments spawn once)
let frags = [];                       // burnt flesh falling away: { cx, cy, hx, hy, vx, vy, spin, life, max }
let rain = [];                        // Greek rain columns
let lastScore = 0;                    // highest altitude of the last flight (0..1)
const scoreOf = a => String(Math.round(a * 9999)).padStart(4, "0");

// Wire scenery in world coordinates (spawned ahead along the current heading; recycled as it passes)
const cloudShapes = Array.from({ length: CLOUD_N }, (_, i) => spawnCloud({}, 8 + i * 8 + Math.random() * 4));
const speedLines = Array.from({ length: SPEED_N }, () => spawnSpeed({}, 1 + Math.random() * 20));
const billboards = Array.from({ length: BILL_N }, (_, i) => spawnBillboard({}, 8 + i * 8 + Math.random() * 4));
const motels = Array.from({ length: MOTEL_N }, () => spawnMotel({}, 10 + Math.random() * 40));
const gasStations = Array.from({ length: GAS_N }, () => spawnGas({}, 14 + Math.random() * 36));
// Cars on the nearest highway: lane offset from its centre, z, speed (+ = your way, red tail lights; − = oncoming, blue)
const cars = Array.from({ length: CAR_N }, (_, i) => {
  const away = i % 2 === 0;
  return { lane: away ? 1.6 : -1.6, z: (Math.random() - 0.3) * VIEW_FAR, v: away ? 5 + Math.random() * 4 : -(7 + Math.random() * 5) };
});
const RIDGE_SEED = Math.random() * 100;
let signText = [];                    // sign faces queued during the wire pass, lettered after it
let sunDrips = [], edgeDrips = [];
let neonNear = 0;                     // 0..1: how close the nearest neon sign is (its buzz)
let dtWorld = 1 / 60;
let oracle = null;                    // { start, truth, learned, total, hint, final, spoken, shown }

let voiceOn = true;
try { voiceOn = localStorage.getItem(VOICE_KEY) !== "0"; } catch (e) { /* private mode: default on */ }
let recorder = null, recChunks = [], lastClip = null;

let feathers = [], wax = [];

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ============================================================
// 3D helpers (function declarations: hoisted, used during init)
// ============================================================

// ---------- Scenery spawners (placed `ahead` units in front of the camera) ----------
function side() { return Math.random() < 0.5 ? -1 : 1; }   // hoisted: used during init

// Put o at `ahead` units along the heading and `lat` units to the right of it
function place(o, ahead, lat) {
  o.x = view.x + view.hx * ahead + view.hz * lat;
  o.z = travel + view.hz * ahead - view.hx * lat;
  return o;
}
// Forward / sideways distance of a world point from the camera, along the heading
function fwdOf(x, z) { return (x - view.x) * view.hx + (z - travel) * view.hz; }
function latOf(x, z) { return (x - view.x) * view.hz - (z - travel) * view.hx; }

// Jagged cloud outline at eye level (yRel = height relative to the camera), flattish bottom
function spawnCloud(c, ahead) {
  place(c, ahead, (Math.random() - 0.5) * 5);
  c.yRel = -0.3 + Math.random() * 0.8;
  const rx = 1.5 + Math.random() * 1.5, ry = rx * (0.3 + Math.random() * 0.15);
  c.pts = [];
  const n = 16;                       // index 0 = right, n/4 = top, n/2 = left, 3n/4 = bottom
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, j = 0.8 + Math.random() * 0.4;
    c.pts.push([Math.cos(a) * rx * j, Math.max(Math.sin(a) * ry * j, -ry * 0.35)]);
  }
  return c;
}

function spawnSpeed(p, ahead) {
  place(p, ahead, (Math.random() - 0.5) * 10);
  p.y = Math.max(0.05, view.h + (Math.random() - 0.5) * 6);
  return p;
}

// Billboards: a face across your heading, off to the side, selling the site's ads
function pickAd(b) {
  const you = Math.min(1, Math.max(0, (viewAlt - WEIRD_FROM) / (WEIRD_FULL - WEIRD_FROM)));   // higher: about you (no clamp: runs at init)
  const list = Math.random() < you * 0.85 ? YOU_ADS : ADS;
  b.ad = list[(Math.random() * list.length) | 0];
  return b;
}
function spawnBillboard(b, ahead) {
  b.ax = view.hz; b.az = -view.hx;
  b.w = 5.5 + Math.random() * 1.5; b.h = b.w * 0.42;   // the sign's own 400×168
  b.leg = 2.2 + Math.random() * 1.6;
  place(b, ahead, side() * (POLE_X + 2.5 + Math.random() * 10) - b.w / 2);
  b.blue = Math.random() < 0.4;
  b.seed = Math.random() * 1000;
  b.reroll = 2 + Math.random() * 4;
  return pickAd(b);
}
// Motel sign on a tall pole, with an arrow
function spawnMotel(m, ahead) {
  m.ax = view.hz; m.az = -view.hx;
  place(m, ahead, side() * (POLE_X + 4 + Math.random() * 12));
  m.h = 4.5 + Math.random() * 1.5;
  m.vacancy = Math.random() < 0.6;
  m.seed = Math.random() * 1000;
  return m;
}
// Gas station canopy on four posts, with pumps
function spawnGas(g, ahead) {
  g.ax = view.hz; g.az = -view.hx;
  g.w = 5 + Math.random() * 2; g.d = 3 + Math.random(); g.h = 2.4;
  place(g, ahead, side() * (POLE_X + 3 + Math.random() * 9) - g.w / 2);
  g.seed = Math.random() * 1000;
  return g;
}

// Respawn an object that left the view: far ahead if it passed behind you, anywhere ahead if a
// turn swept it off to the side (so the scene refills instead of leaving a gap after a turn)
function respawn(o, fn, behind, wide) {
  if (vloop) return;                                   // mid-loop you look backward: keep the world where it is
  const f = fwdOf(o.x, o.z);
  if (f < behind) fn(o, VIEW_FAR * (0.8 + 0.3 * Math.random()));
  else if (Math.abs(latOf(o.x, o.z)) > wide) fn(o, 8 + Math.random() * (VIEW_FAR - 8));
}
// Everything, anywhere ahead (after the position resets on "Fly again")
function respawnAll() {
  const any = () => 6 + Math.random() * (VIEW_FAR - 6);
  cloudShapes.forEach((c, i) => spawnCloud(c, 8 + i * 8 + Math.random() * 4));
  for (const p of speedLines) spawnSpeed(p, 1 + Math.random() * 20);
  billboards.forEach((b, i) => spawnBillboard(b, 8 + i * 8 + Math.random() * 4));
  for (const m of motels) spawnMotel(m, any());
  for (const g of gasStations) spawnGas(g, any());
  for (const c of cars) c.z = travel + (Math.random() - 0.3) * VIEW_FAR;
  sunDrips = []; edgeDrips = []; signText = [];
}

// ---------- Camera projection ----------
// World offset → camera space [x, y, depth]: yaw, then pitch; roll is applied on screen.
function dirCam(dx, dy, dz) {          // also used directly for directions (points at infinity)
  const rx = dx * view.cy - dz * view.sy, rz = dx * view.sy + dz * view.cy;
  return [rx, dy * view.cp - rz * view.sp, dy * view.sp + rz * view.cp];
}
function toCam(x, y, z) { return dirCam(x - view.x - camOff.x, y - view.h - camOff.y, z - travel - camOff.z); }
function toScreen(c) {
  const k = focal / c[2], sx = c[0] * k, sy = -c[1] * k;
  return [W / 2 + sx * view.cr - sy * view.sr, H / 2 + sx * view.sr + sy * view.cr];
}
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR];
}
// One 3D line segment, clipped to the near plane, into the wire batch
function seg3(x1, y1, z1, x2, y2, z2, b) {
  if (b <= 0.02) return;
  let a = toCam(x1, y1, z1), c = toCam(x2, y2, z2);
  if (a[2] < NEAR && c[2] < NEAR) return;
  if (a[2] < NEAR) a = clipNear(a, c); else if (c[2] < NEAR) c = clipNear(c, a);
  const p = toScreen(a), q = toScreen(c);
  wire(p[0], p[1], q[0], q[1], b);
}

// Per-frame camera: altitude pitches it up and lifts it; the phone's roll banks it; the melt dives it
function updateView(now, dt) {
  const k = 1 - Math.exp(-dt / CAM_TAU);           // ~100 ms camera easing
  if (mode === "melt") {
    // THE LONG FALL: nose comes down while the ground drops far below (hidden by the pitch),
    // then free fall toward the father, the sea rushing up, ending just above the water facing him.
    const t = (now - meltStart) / 1000;
    const smooth = v => v * v * (3 - 2 * v);
    viewAlt = meltAlt0 * Math.max(0, 1 - t / MELT_TIME);
    const s = smooth(clamp((t - 0.3) / (FALL_TIME - 1), 0, 1));
    view.x = lerp(meltX0, father.x - meltHx * 2.5, s);
    travel = lerp(meltZ0, father.z - meltHz * 2.5, s);
    if (t < FALL_UP) view.h = lerp(meltH0, FALL_H, smooth(t / FALL_UP));
    else { const tt = t - FALL_UP; view.h = Math.max(0.25, FALL_H - 0.5 * FALL_G * tt * tt); }
    const dx = father.x - view.x, dz = father.z - travel;
    const lookPitch = clamp(Math.atan2(0.6 - view.h, Math.hypot(dx, dz)), -1.5, 0.9);
    let dyaw = Math.atan2(dx, dz) - meltYaw0;
    dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));                // shortest way round
    const blend = smooth(clamp(t / 1.6, 0, 1));
    view.pitch = lerp(meltPitch0, lookPitch, blend);
    view.yaw = meltYaw0 + dyaw * blend;
    bank = Math.sin(t * 2.3) * 0.25 * (1 - t / FALL_TIME) * blend + Math.sin(t * 7) * 0.08 * (1 - blend);
    yawRate = 0;
    focal += (FOCAL - focal) * k;
  } else {
    viewAlt = altitude;
    const sky = clamp((viewAlt - SEA_LINE) / (1 - SEA_LINE), 0, 1);
    const ease = sky * sky * (3 - 2 * sky);
    // The nose turns toward the sun as you rise, as far as you're heading its way; level when you look away
    const dxs = SUN_X - view.x, dzs = SUN_Z - travel, hd = Math.hypot(dxs, dzs);
    const facing = clamp((dxs * view.hx + dzs * view.hz) / Math.max(hd, 1e-3), 0, 1);
    const elev = clamp(Math.atan2(SUN_Y - view.h, hd), -0.55, PITCH_MAX);
    view.pitch += (elev * ease * facing + CAM_PITCH_TILT * pitchIn - view.pitch) * k;   // + nose follows the phone
    view.h += (lerp(CAM_H_SEA, CAM_H_TOP, Math.pow(sky, 1.35)) - view.h) * k;
    bank += (bankTarget - bank) * k;
    yawRate += (yawTarget - yawRate) * k;
    focal += (FOCAL / (1 + FOV_WIDEN * thrustEff) - focal) * k;   // wider view in a dive
    // The father keeps his distance ahead, catching up slowly so your turns sweep him across the view
    const kf = 1 - Math.exp(-dt / FATHER_FOLLOW);
    father.x += (view.x + view.hx * FATHER_AHEAD - father.x) * kf;
    father.z += (travel + view.hz * FATHER_AHEAD - father.z) * kf;
  }
  view.yaw += yawRate * dt;
  view.cy = Math.cos(view.yaw); view.sy = Math.sin(view.yaw);
  view.hx = view.sy; view.hz = view.cy;
  // Barrel roll: a full turn about the heading while the camera flies a helix around its line
  let bRoll = 0;
  camOff.x = camOff.y = camOff.z = 0;
  if (barrel) {
    const u = clamp((now - barrel.start) / 1000 / BARREL_TIME, 0, 1);
    const th = Math.PI * 2 * u * u * (3 - 2 * u);           // eased: slow in, fast through, slow out
    bRoll = -barrel.dir * th;                                 // (roll > 0 = banked left)
    const lat = barrel.dir * BARREL_R * Math.sin(th), up = BARREL_R * (1 - Math.cos(th));
    camOff.x = view.hz * lat; camOff.z = -view.hx * lat; camOff.y = up;
    if (u >= 1) { barrel = null; barrelCool = BARREL_COOL; }
  }
  // Loop: a full vertical circle in the heading plane; upside-down over the top
  let lPitch = 0;
  if (vloop) {
    const u = clamp((now - vloop.start) / 1000 / LOOP_TIME, 0, 1);
    const th = Math.PI * 2 * (u < 0.5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u));   // eased in and out
    lPitch = th;
    const fwd = LOOP_R * Math.sin(th), up = LOOP_R * (1 - Math.cos(th));
    camOff.x += view.hx * fwd; camOff.z += view.hz * fwd; camOff.y += up;
    if (u >= 1) { vloop = null; barrelCool = BARREL_COOL; }
  }
  view.roll = bank + tiltNow(now) + bRoll;    // the horizon sometimes tilts on its own (renderer failing)
  const pitch = view.pitch + lPitch;
  view.cp = Math.cos(pitch); view.sp = Math.sin(pitch);
  view.cr = Math.cos(view.roll);  view.sr = Math.sin(view.roll);
}

// Start a loop
function triggerLoop(now = performance.now()) {
  if (mode !== "live" || barrel || vloop || barrelCool > 0) return;
  vloop = { start: now };
  barrelWhoosh(LOOP_TIME);
}
function loopNow() { return vloop ? 1 : 0; }

// Start a barrel roll (dir +1 = to the right)
function triggerBarrel(dir, now = performance.now()) {
  if (mode !== "live" || barrel || vloop || barrelCool > 0) return;
  barrel = { start: now, dir };
  barrelWhoosh(BARREL_TIME);
}
function barrelNow() { return barrel ? 1 : 0; }

// The whoosh: a burst of wind sweeping up and back down
function barrelWhoosh(T) {
  if (!audio) return;
  const a = audio, t = a.ac.currentTime;
  hold(a.windGain.gain, t); hold(a.windFilter.frequency, t);
  a.windGain.gain.linearRampToValueAtTime(0.16, t + T * 0.35);
  a.windGain.gain.linearRampToValueAtTime(0.0001, t + T);
  a.windFilter.frequency.setValueAtTime(Math.max(120, a.windFilter.frequency.value), t);
  a.windFilter.frequency.exponentialRampToValueAtTime(2600, t + T * 0.45);
  a.windFilter.frequency.exponentialRampToValueAtTime(300, t + T);
  // the voice dips and swoops with it
  hold(a.wobblePitch.gain, t);
  a.wobblePitch.gain.linearRampToValueAtTime(60, t + T * 0.4);
  a.wobblePitch.gain.linearRampToValueAtTime(0, t + T);
}

// ============================================================
// Pitch: continuous, soft-snapped to a major pentatonic scale
// ============================================================
function softSnap(semis) {
  const oct = Math.floor(semis / 12);
  let best = 0, bestDist = Infinity;
  for (let o = oct - 1; o <= oct + 1; o++) {
    for (const d of PENTATONIC) {
      const n = o * 12 + d, dist = Math.abs(n - semis);
      if (dist < bestDist) { best = n; bestDist = dist; }
    }
  }
  return best + (semis - best) * (1 - SNAP);
}
const hzOf = semis => ROOT_HZ * Math.pow(2, semis / 12);

// ============================================================
// Audio: one voice. Two detuned oscillators + a sub, lowpass,
// soft saturation, an octave shimmer, and a light reverb.
// ============================================================
function makeImpulse(ac, seconds = 2.8, decay = 3) {
  const len = Math.floor(ac.sampleRate * seconds);
  const buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}

function makeSaturationCurve(drive = 3) {
  const n = 1024, curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * 2 - 1;
    curve[i] = Math.tanh(drive * x) / Math.tanh(drive);
  }
  return curve;
}

function initAudio() {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const node = {
    osc1: ac.createOscillator(), osc2: ac.createOscillator(),
    sub: ac.createOscillator(), shim: ac.createOscillator(),
    g1: ac.createGain(), g2: ac.createGain(), gSub: ac.createGain(), gShim: ac.createGain(),
    mix: ac.createGain(), filter: ac.createBiquadFilter(),
    dry: ac.createGain(), shaper: ac.createWaveShaper(), wet: ac.createGain(),
    amp: ac.createGain(), revSend: ac.createGain(), reverb: ac.createConvolver(),
    hallSend: ac.createGain(), hall: ac.createConvolver(),   // long reverb that opens with heat
    master: ac.createGain(), comp: ac.createDynamicsCompressor(),
    // Modulation: a slow "underwater" LFO and a vibrato LFO, summed on a pitch bus
    wobble: ac.createOscillator(), wobblePitch: ac.createGain(), wobbleFilter: ac.createGain(),
    vib: ac.createOscillator(), vibDepth: ac.createGain(), pitchBus: ac.createGain(),
    // Engine: a low filtered saw that follows speed and thrust
    engine: ac.createOscillator(), engFilter: ac.createBiquadFilter(), engGain: ac.createGain(),
    // Falling wind: looped noise through a bandpass, silent until the long fall
    wind: ac.createBufferSource(), windFilter: ac.createBiquadFilter(), windGain: ac.createGain(),
    // THE FATHER: a low drone one and two octaves below, tuned flat (strongest at sea)
    drone1: ac.createOscillator(), drone2: ac.createOscillator(), droneG2: ac.createGain(), droneGain: ac.createGain(),
    // THE SUN: two beating sines with a tremolo; harmonic from afar, inharmonic and screaming up close
    sunV1: ac.createOscillator(), sunV2: ac.createOscillator(), sunGain: ac.createGain(),
    sunTrem: ac.createOscillator(), sunTremDepth: ac.createGain(),
    // Its anger: a roar of filtered noise and a sub-bass rumble, both rising with nearness
    roar: ac.createBufferSource(), roarFilter: ac.createBiquadFilter(), roarGain: ac.createGain(),
    roarLfo: ac.createOscillator(), roarLfoDepth: ac.createGain(),
    rumble: ac.createOscillator(), rumble2: ac.createOscillator(), rumbleGain: ac.createGain(),
    // v3 world: power-line hum (rises with altitude), the distant highway, neon buzz near the signs
    hum1: ac.createOscillator(), hum2: ac.createOscillator(), humFilter: ac.createBiquadFilter(), humGain: ac.createGain(),
    hwy: ac.createBufferSource(), hwyFilter: ac.createBiquadFilter(), hwyGain: ac.createGain(),
    neon: ac.createOscillator(), neonFilter: ac.createBiquadFilter(), neonGain: ac.createGain(),
    // The Oracle: a quiet sub-bass under the truth
    oracle1: ac.createOscillator(), oracle2: ac.createOscillator(), oracleGain: ac.createGain(),
    recDest: ac.createMediaStreamDestination(),   // the clip's soundtrack
  };
  const n = node;

  // Chip voices only: triangle + square, and the noise channel below
  n.osc1.type = "triangle";     // the clean core
  n.osc2.type = "square";       // brightness, brought in by the sun
  n.sub.type  = "triangle";
  n.shim.type = "square";       // one octave up, for shimmer

  n.g1.gain.value = 0.5; n.g2.gain.value = 0; n.gSub.gain.value = 0.4; n.gShim.gain.value = 0;
  n.filter.type = "lowpass"; n.filter.frequency.value = 300; n.filter.Q.value = 0.8;
  n.shaper.curve = makeSaturationCurve(3); n.shaper.oversample = "2x";
  n.dry.gain.value = 1; n.wet.gain.value = 0;
  n.amp.gain.value = 0;
  n.reverb.buffer = makeImpulse(ac, 2.2, 3);
  n.hall.buffer = makeImpulse(ac, 5.5, 2);
  n.revSend.gain.value = 0.12; n.hallSend.gain.value = 0;
  n.master.gain.value = 0.6;
  // Safety limiter only: high threshold so the heat swell isn't squashed
  n.comp.threshold.value = -6; n.comp.knee.value = 6; n.comp.ratio.value = 3;
  n.comp.attack.value = 0.005; n.comp.release.value = 0.25;

  n.wobble.frequency.value = 0.3; n.wobblePitch.gain.value = 0; n.wobbleFilter.gain.value = 0;
  n.vib.frequency.value = 5.5; n.vibDepth.gain.value = 0;

  // Voice
  n.osc1.connect(n.g1).connect(n.mix);
  n.osc2.connect(n.g2).connect(n.mix);
  n.sub.connect(n.gSub).connect(n.mix);
  n.mix.connect(n.filter);
  n.filter.connect(n.dry).connect(n.amp);
  n.filter.connect(n.shaper).connect(n.wet).connect(n.amp);
  n.shim.connect(n.gShim).connect(n.amp);      // shimmer skips the filter

  // Output: dry + reverb → compressor → speakers and the recorder
  n.amp.connect(n.master);
  n.amp.connect(n.revSend).connect(n.reverb).connect(n.master);
  n.amp.connect(n.hallSend).connect(n.hall).connect(n.master);

  n.engine.type = "square"; n.engine.frequency.value = 50;
  n.engFilter.type = "lowpass"; n.engFilter.frequency.value = 400; n.engFilter.Q.value = 2;
  n.engGain.gain.value = 0;
  n.engine.connect(n.engFilter).connect(n.engGain).connect(n.master);

  // The noise channel: a 15-bit LFSR, each value held for a few samples (that gritty chip hiss)
  const noise = ac.createBuffer(2, ac.sampleRate * 2, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = noise.getChannelData(ch);
    let lfsr = 0x4a3 + ch * 977, v = 0;
    for (let i = 0; i < d.length; i++) {
      if (i % 5 === 0) { const bit = (lfsr ^ (lfsr >> 1)) & 1; lfsr = (lfsr >> 1) | (bit << 14); v = lfsr & 1 ? 0.8 : -0.8; }
      d[i] = v;
    }
  }
  n.wind.buffer = noise; n.wind.loop = true;
  n.windFilter.type = "bandpass"; n.windFilter.frequency.value = 300; n.windFilter.Q.value = 0.7;
  n.windGain.gain.value = 0;
  n.wind.connect(n.windFilter).connect(n.windGain).connect(n.master);
  n.wind.start();
  n.noiseBuf = noise;                           // reused by the whispers

  // The father: into the main voice chain, so the filter, reverb and melt collapse apply to him too
  n.drone1.type = "triangle"; n.drone2.type = "square";
  n.drone1.detune.value = n.drone2.detune.value = -DRONE_FLAT;
  n.droneG2.gain.value = 0.6; n.droneGain.gain.value = 0;
  n.drone1.connect(n.droneGain);
  n.drone2.connect(n.droneG2).connect(n.droneGain);
  n.droneGain.connect(n.mix);

  // The sun: skips the filter (like the shimmer), trembling
  n.sunV1.type = n.sunV2.type = "square";   // the sun's sizzle
  n.sunGain.gain.value = 0;
  n.sunTrem.frequency.value = 6.5; n.sunTremDepth.gain.value = 0;
  n.sunV1.connect(n.sunGain); n.sunV2.connect(n.sunGain);
  n.sunTrem.connect(n.sunTremDepth).connect(n.sunGain.gain);
  n.sunGain.connect(n.amp);

  // The roar: the same noise through a wandering bandpass, straight to the master and the hall
  n.roar.buffer = noise; n.roar.loop = true;
  n.roarFilter.type = "bandpass"; n.roarFilter.frequency.value = 220; n.roarFilter.Q.value = 0.6;
  n.roarGain.gain.value = 0;
  n.roarLfo.frequency.value = 0.9; n.roarLfoDepth.gain.value = 0;
  n.roarLfo.connect(n.roarLfoDepth).connect(n.roarFilter.frequency);
  n.roar.connect(n.roarFilter).connect(n.roarGain);
  n.roarGain.connect(n.master); n.roarGain.connect(n.hall);
  n.roar.start();
  // The rumble: two sub sines a few Hz apart, beating slowly
  n.rumble.type = n.rumble2.type = "triangle";
  n.rumble.frequency.value = 31; n.rumble2.frequency.value = 34.5;
  n.rumbleGain.gain.value = 0;
  n.rumble.connect(n.rumbleGain); n.rumble2.connect(n.rumbleGain);
  n.rumbleGain.connect(n.master);

  // Power lines: 60 Hz mains hum + its buzzy 120 Hz overtone, through a bandpass
  n.hum1.type = "square"; n.hum1.frequency.value = 60;
  n.hum2.type = "square"; n.hum2.frequency.value = 120;
  n.humFilter.type = "bandpass"; n.humFilter.frequency.value = 180; n.humFilter.Q.value = 1.5;
  n.humGain.gain.value = 0;
  n.hum1.connect(n.humFilter); n.hum2.connect(n.humFilter);
  n.humFilter.connect(n.humGain).connect(n.master);
  // The highway: low rumbling noise, far off
  n.hwy.buffer = noise; n.hwy.loop = true; n.hwy.playbackRate.value = 0.5;
  n.hwyFilter.type = "lowpass"; n.hwyFilter.frequency.value = 220;
  n.hwyGain.gain.value = 0;
  n.hwy.connect(n.hwyFilter).connect(n.hwyGain).connect(n.master);
  n.hwy.start();
  // Neon: a thin 120 Hz buzz, high and narrow
  n.neon.type = "square"; n.neon.frequency.value = 120;
  n.neonFilter.type = "bandpass"; n.neonFilter.frequency.value = 2400; n.neonFilter.Q.value = 6;
  n.neonGain.gain.value = 0;
  n.neon.connect(n.neonFilter).connect(n.neonGain).connect(n.master);
  // The Oracle's sub: E1 and a fifth above, very quiet, into the hall
  n.oracle1.type = n.oracle2.type = "triangle";
  n.oracle1.frequency.value = 41.2; n.oracle2.frequency.value = 61.7;
  n.oracleGain.gain.value = 0;
  n.oracle1.connect(n.oracleGain); n.oracle2.connect(n.oracleGain);
  n.oracleGain.connect(n.master); n.oracleGain.connect(n.hall);

  n.master.connect(n.comp);
  n.comp.connect(ac.destination);
  n.comp.connect(n.recDest);

  // Modulation routing (cents added to every oscillator's detune)
  n.wobble.connect(n.wobblePitch).connect(n.pitchBus);
  n.wobble.connect(n.wobbleFilter).connect(n.filter.frequency);
  n.vib.connect(n.vibDepth).connect(n.pitchBus);
  for (const o of [n.osc1, n.osc2, n.sub, n.shim, n.drone1, n.drone2, n.sunV1, n.sunV2]) n.pitchBus.connect(o.detune);

  for (const o of [n.osc1, n.osc2, n.sub, n.shim, n.wobble, n.vib, n.engine,
                   n.drone1, n.drone2, n.sunV1, n.sunV2, n.sunTrem, n.roarLfo, n.rumble, n.rumble2,
                   n.hum1, n.hum2, n.neon, n.oracle1, n.oracle2]) o.start();
  setFreq(n, ac, ROOT_HZ, 0.01);
  return { ac, ...n };
}

// Smooth parameter change, no clicks
const glide = (param, value, tc = 0.08) => param.setTargetAtTime(value, audio.ac.currentTime, tc);

function setFreq(n, ac, hz, tc) {
  const t = ac.currentTime;
  n.osc1.frequency.setTargetAtTime(hz, t, tc);
  n.osc2.frequency.setTargetAtTime(hz, t, tc);
  n.sub.frequency.setTargetAtTime(hz / 2, t, tc);
  n.shim.frequency.setTargetAtTime(hz * 2, t, tc);
  n.drone1.frequency.setTargetAtTime(hz / 2, t, tc);
  n.drone2.frequency.setTargetAtTime(hz / 4, t, tc);
  n.sunV1.frequency.setTargetAtTime(hz * 3, t, tc);
  n.sunV2.frequency.setTargetAtTime(hz * 3 * SUN_BEAT, t, tc);
}

// Freeze a parameter at its current value, dropping any scheduled automation
function hold(param, t) {
  if (param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(t);
  else { const v = param.value; param.cancelScheduledValues(t); param.setValueAtTime(v, t); }
}
const voiceParams = a => [
  a.osc1.frequency, a.osc2.frequency, a.sub.frequency, a.shim.frequency,
  a.amp.gain, a.filter.frequency, a.filter.Q, a.g2.gain, a.gSub.gain, a.gShim.gain,
  a.wet.gain, a.dry.gain, a.revSend.gain, a.hallSend.gain, a.vibDepth.gain,
  a.wobblePitch.gain, a.wobbleFilter.gain,
  a.engine.frequency, a.engFilter.frequency, a.engGain.gain,
  a.windGain.gain, a.windFilter.frequency,
  a.drone1.frequency, a.drone2.frequency, a.droneGain.gain,
  a.sunV1.frequency, a.sunV2.frequency, a.sunGain.gain, a.sunTremDepth.gain,
  a.roarGain.gain, a.roarFilter.frequency, a.roarLfoDepth.gain, a.rumbleGain.gain,
  a.humGain.gain, a.hum1.frequency, a.hwyGain.gain, a.neonGain.gain, a.oracleGain.gain,
];
// Before live control resumes (e.g. "Fly again"), clear any melt automation
function releaseVoice() {
  if (!audio) return;
  const t = audio.ac.currentTime;
  for (const p of voiceParams(audio)) hold(p, t);
}

// The signal fails near the sun: dropouts, and the pitch jumping an octave or two for an instant
function sunGlitchAudio(h) {
  const a = audio, t = a.ac.currentTime;
  if (Math.random() < 0.55) {                               // dropout
    const g = a.amp.gain.value, d = 0.03 + Math.random() * 0.09 * h;
    a.amp.gain.setValueAtTime(0.0001, t); a.amp.gain.setValueAtTime(g, t + d);
  } else {                                                  // pitch jump
    const jump = (Math.random() < 0.5 ? -1 : 1) * (1200 + 1200 * Math.round(Math.random() * h));
    const d = 0.04 + Math.random() * 0.1;
    for (const o of [a.osc1, a.osc2, a.sub]) {
      const v = o.detune.value;
      o.detune.setValueAtTime(v + jump, t); o.detune.setValueAtTime(v, t + d);
    }
  }
}

// Map altitude + heat to the voice, every frame
let dtVoice = 1 / 60;
function updateVoice(handsVisible, dt = 1 / 60) {
  dtVoice = dt;
  const a = audio;
  let semis, cutoff, q, saw, sub, shim, rev, hall, wobP, wobF, spread, vib;

  if (altitude < SEA_LINE) {
    // SEA: one low muffled tone with a slow underwater wobble
    semis = 0; cutoff = 260; q = 1.2; saw = 0.25; sub = 0.5; shim = 0;
    rev = 0.15; hall = 0; wobP = 14; wobF = 140; spread = 4; vib = 0;
  } else {
    // SKY: pitch climbs with altitude, pure (triangle + sine, low lowpass, no saw).
    // NEAR THE SUN: the melody sinks back into the root and the voice comes apart:
    // the two oscillators drift a quarter-tone apart, the filter turns resonant and
    // screeching, the vibrato slows to a wide seasick wobble, the hall opens.
    const h = heat;
    const melody = softSnap(RANGE_SEMIS * (altitude - SEA_LINE) / (1 - SEA_LINE));
    semis = lerp(melody, -5, Math.pow(h, 1.3));            // sinks below the root as you close in
    const sky = clamp((altitude - SEA_LINE) / (SUN_LINE - SEA_LINE), 0, 1);
    cutoff = lerp(lerp(700, 1500, sky), 5200, h * h);
    q = lerp(0.5, 7, h * h);                                // resonance rises: a whistle on the edge
    saw = h * 0.3;
    sub = lerp(0.28, 0.55, h);
    shim = h * h * 0.06;
    rev = 0.08 + h * 0.12;
    hall = Math.pow(h, 1.3) * 1.0;                          // long hall opens as you near it
    wobP = h * h * 30; wobF = h * 300;                      // the slow underwater wobble returns, bigger
    spread = 3 + h * 70;                                    // detune: a beating cluster
    vib = h * h * 140;                                      // wide...
  }
  // Loudness rises ~6 dB with heat: the moment before the melt is the loudest
  const level = BASE_GAIN * Math.pow(10, (HEAT_DB * heat) / 20);

  // The father: strongest at sea, fading as you climb; he pulls the main tone slightly flat
  const fatherAmt = lerp(1, 0.15, clamp((altitude - SEA_LINE) / (1 - SEA_LINE), 0, 1));
  const pull = FATHER_PULL * fatherAmt;
  // The sun: from afar a faint harmonic shimmer when you face it; near, an inharmonic scream,
  // a roar of noise and a rumble underneath, and the signal itself starts to fail
  const sunNear = clamp(heat * (0.5 + 0.5 * sunAim), 0, 1);
  glide(a.droneGain.gain, 0.35 * fatherAmt, 0.2);
  glide(a.drone2.detune, -DRONE_FLAT - heat * 95, 0.3);   // the father's low voice slides a semitone flat
  glide(a.sunGain.gain, 0.05 * sunNear + 0.12 * heat * heat, 0.15);
  glide(a.sunTremDepth.gain, 0.03 * sunNear + 0.08 * heat * heat, 0.15);
  glide(a.sunTrem.frequency, lerp(6.5, 17, heat), 0.3);
  glide(a.roarGain.gain, 0.3 * heat * heat * heat, 0.25);
  glide(a.roarFilter.frequency, lerp(180, 1100, heat), 0.3);
  glide(a.roarLfoDepth.gain, 400 * heat, 0.3);
  glide(a.roarLfo.frequency, lerp(0.6, 4, heat), 0.3);
  glide(a.rumbleGain.gain, 0.5 * heat * heat, 0.3);
  if (heat > 0.5 && Math.random() < (heat - 0.5) * 2.2 * dtVoice) sunGlitchAudio(heat);

  setFreq(a, a.ac, hzOf(semis), 0.06);
  const ratio = lerp(3, 5.04, heat);                        // the sun's voice goes inharmonic
  glide(a.sunV1.frequency, hzOf(semis) * ratio, 0.06);
  glide(a.sunV2.frequency, hzOf(semis) * ratio * lerp(SUN_BEAT, 1.41, heat), 0.06);
  glide(a.vib.frequency, lerp(5.5, 0.8, heat), 0.3);
  glide(a.osc1.detune, spread - pull);
  glide(a.osc2.detune, -spread - pull);
  glide(a.shim.detune, spread * 0.5 - pull);
  glide(a.filter.frequency, cutoff, 0.12);
  glide(a.filter.Q, q, 0.2);
  glide(a.g2.gain, saw, 0.15);
  glide(a.gSub.gain, sub, 0.15);
  glide(a.gShim.gain, shim, 0.15);
  glide(a.revSend.gain, rev, 0.3);
  glide(a.hallSend.gain, hall, 0.3);
  glide(a.wobblePitch.gain, wobP, 0.4);
  glide(a.wobbleFilter.gain, wobF, 0.4);
  glide(a.vibDepth.gain, vib, 0.15);
  glide(a.wet.gain, heat * 0.6, 0.15);     // soft saturation creeps in
  glide(a.dry.gain, 1 - heat * 0.3, 0.15);
  glide(a.amp.gain, handsVisible ? level : 0, handsVisible ? 0.08 : 0.25);

  // Engine: pitch and brightness rise with speed; louder when you push forward
  const push = Math.max(0, thrustEff);
  glide(a.engine.frequency, 38 + fwdSpeed * 4 + push * 30, 0.08);
  glide(a.engFilter.frequency, 250 + fwdSpeed * 60 + push * 900, 0.08);
  glide(a.engGain.gain, handsVisible ? 0.035 + push * 0.08 : 0, 0.1);

  // The world: the power lines hum louder (and sour) as you climb, the highway fades below you,
  // and each neon sign buzzes as you pass, cutting out now and then like the lettering
  glide(a.humGain.gain, 0.012 + 0.07 * Math.pow(altitude, 1.4), 0.3);
  glide(a.hum1.frequency, 60 * (1 + 0.04 * weirdNow()), 0.5);
  glide(a.hwyGain.gain, 0.01 + 0.05 * (1 - altitude), 0.4);
  glide(a.neonGain.gain, Math.random() < 0.06 ? 0 : neonNear * 0.03, 0.02);
}

// MELT: pitch falls 2.5 octaves over MELT_TIME while the volume collapses to
// near silence; then the sea tone fades back in, quietly.
function meltVoice() {
  const a = audio, t = a.ac.currentTime, T = MELT_TIME;
  const hz = Math.max(40, a.osc1.frequency.value);
  const g0 = Math.max(0.02, a.amp.gain.value);
  for (const p of voiceParams(a)) hold(p, t);

  // Pitch sweep (exponential = even in octaves)
  const end = hz * Math.pow(2, -MELT_OCTAVES);
  a.osc1.frequency.exponentialRampToValueAtTime(end, t + T);
  a.osc2.frequency.exponentialRampToValueAtTime(end, t + T);
  a.sub.frequency.exponentialRampToValueAtTime(end / 2, t + T);
  a.shim.frequency.exponentialRampToValueAtTime(end * 2, t + T);
  a.drone1.frequency.exponentialRampToValueAtTime(end / 2, t + T);   // the father falls with you
  a.drone2.frequency.exponentialRampToValueAtTime(end / 4, t + T);
  a.sunV1.frequency.exponentialRampToValueAtTime(end * 3, t + T);
  a.sunV2.frequency.exponentialRampToValueAtTime(end * 3 * SUN_BEAT, t + T);
  a.sunGain.gain.linearRampToValueAtTime(0, t + T * 0.4);            // the sun lets go first
  a.sunTremDepth.gain.linearRampToValueAtTime(0, t + T * 0.4);
  a.roarGain.gain.linearRampToValueAtTime(0, t + T * 0.6);           // its roar fades behind you
  a.rumbleGain.gain.linearRampToValueAtTime(0, t + T * 1.5);

  // Volume collapse: -12 dB at 1s, ~-30 dB at 1.7s, near silence at 2s
  a.amp.gain.exponentialRampToValueAtTime(g0 * 0.25, t + T * 0.5);
  a.amp.gain.exponentialRampToValueAtTime(g0 * 0.03, t + T * 0.85);
  a.amp.gain.exponentialRampToValueAtTime(0.0006, t + T);

  // Timbre drains away with it
  a.filter.frequency.exponentialRampToValueAtTime(180, t + T);
  a.wet.gain.linearRampToValueAtTime(0, t + T * 0.5);
  a.dry.gain.linearRampToValueAtTime(1, t + T * 0.5);
  a.g2.gain.linearRampToValueAtTime(0, t + T * 0.7);
  a.gShim.gain.linearRampToValueAtTime(0, t + T * 0.3);
  a.vibDepth.gain.linearRampToValueAtTime(0, t + T * 0.3);
  // Engine dies with the melt: pitch sags, level collapses
  a.engine.frequency.exponentialRampToValueAtTime(25, t + T);
  a.engGain.gain.setTargetAtTime(0, t, T / 4);
  a.humGain.gain.setTargetAtTime(0, t, 1.2);           // the world goes quiet behind you
  a.hwyGain.gain.setTargetAtTime(0, t, 1.5);
  a.neonGain.gain.setTargetAtTime(0, t, 0.3);
  // (the hall send stays open so the fall rings out in the big space)

  // The long fall: nothing but wind, rising in level and pitch all the way down
  a.windGain.gain.setValueAtTime(0.0001, t + 0.6);
  a.windGain.gain.exponentialRampToValueAtTime(0.22, t + FALL_TIME - 0.2);
  a.windFilter.frequency.setValueAtTime(250, t + 0.6);
  a.windFilter.frequency.exponentialRampToValueAtTime(1600, t + FALL_TIME - 0.2);
}

// At the water: everything cuts to black and quiet; then the Oracle's sub-bass rises with the ball
function oracleAudio() {
  if (!audio) return;
  const a = audio, ts = a.ac.currentTime;
  for (const p of voiceParams(a)) hold(p, ts);
  for (const g of [a.windGain, a.amp, a.engGain, a.droneGain, a.sunGain, a.roarGain, a.rumbleGain, a.humGain, a.hwyGain, a.neonGain])
    g.gain.setTargetAtTime(0, ts, 0.05);
  a.hallSend.gain.setTargetAtTime(0, ts, 0.8);
  a.oracleGain.gain.setValueAtTime(0, ts + ORACLE_DARK);
  a.oracleGain.gain.linearRampToValueAtTime(0.16, ts + ORACLE_DARK + ORACLE_RISE);
}

function silence() { glide(audio.amp.gain, 0, 0.15); }

// ---------- One-shot chip sounds ----------
function chipNote(type, f0, f1, dur, gain, delay = 0) {
  if (!audio) return;
  const a = audio, t = a.ac.currentTime + delay;
  const o = a.ac.createOscillator(), g = a.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(gain, t); g.gain.setValueAtTime(0, t + dur);   // hard on, hard off: chip envelope
  o.connect(g).connect(a.master);
  o.start(t); o.stop(t + dur + 0.02);
}
function chipNoise(dur, gain, rate0 = 1, rate1 = 0.2, delay = 0) {
  if (!audio) return;
  const a = audio, t = a.ac.currentTime + delay;
  const s = a.ac.createBufferSource(), g = a.ac.createGain();
  s.buffer = a.noiseBuf; s.playbackRate.setValueAtTime(rate0, t); s.playbackRate.exponentialRampToValueAtTime(rate1, t + dur);
  g.gain.setValueAtTime(gain, t); g.gain.linearRampToValueAtTime(0, t + dur);
  s.connect(g).connect(a.master);
  s.start(t, Math.random()); s.stop(t + dur + 0.02);
}
const blip = () => { chipNote("square", 660, 660, 0.04, 0.06); chipNote("square", 990, 990, 0.05, 0.06, 0.045); };
const letterBeep = i => chipNote("square", i % 2 ? 1320 : 990, i % 2 ? 1320 : 990, 0.022, 0.03);
// The crash (the melt) and the splash (the water)
function chipCrash() { chipNoise(1.4, 0.32, 1, 0.1); chipNote("square", 440, 55, 0.9, 0.12); chipNote("triangle", 220, 30, 1.2, 0.25); }
function chipSplash() { chipNoise(0.9, 0.3, 0.6, 0.05); chipNote("triangle", 110, 28, 0.6, 0.3); }
// Under the spoken truth: the machine's speaker. (The browser's speech voice can't be routed through
// Web Audio, so it can't be bitcrushed itself; instead it plays over a buzz + hiss, with a click per word.)
let speechBedNodes = null;
function speechBed(on) {
  if (!audio) return;
  const a = audio, t = a.ac.currentTime;
  if (on && !speechBedNodes) {
    const o = a.ac.createOscillator(), n = a.ac.createBufferSource(), hp = a.ac.createBiquadFilter(), g = a.ac.createGain();
    o.type = "square"; o.frequency.value = 50;
    n.buffer = a.noiseBuf; n.loop = true; n.playbackRate.value = 1.6;
    hp.type = "highpass"; hp.frequency.value = 3000;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.018, t + 0.05);
    o.connect(g); n.connect(hp).connect(g); g.connect(a.master);
    o.start(t); n.start(t);
    speechBedNodes = { o, n, g };
  } else if (!on && speechBedNodes) {
    const { o, n, g } = speechBedNodes;
    g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + 0.1);
    o.stop(t + 0.15); n.stop(t + 0.15);
    speechBedNodes = null;
  }
}

// A whispered syllable for each line of text: a hiss, then a gliding vowel formant,
// filtered noise shaped by short envelopes, with a little reverb.
const VOWELS = [[700, 1200], [400, 2200], [300, 900], [600, 1700], [500, 1000]];
function whisper() {
  if (!audio) return;
  const a = audio, ac = a.ac, t = ac.currentTime;
  const src = ac.createBufferSource();
  src.buffer = a.noiseBuf; src.playbackRate.value = 0.8 + Math.random() * 0.4;
  const hiss = ac.createBiquadFilter(); hiss.type = "highpass"; hiss.frequency.value = 3500;
  const vowel = ac.createBiquadFilter(); vowel.type = "bandpass"; vowel.Q.value = 5;
  const F = VOWELS[(Math.random() * VOWELS.length) | 0];
  vowel.frequency.setValueAtTime(F[0] * 1.4, t + 0.03);
  vowel.frequency.exponentialRampToValueAtTime(F[1], t + 0.28);
  const gH = ac.createGain(), gV = ac.createGain();
  gH.gain.setValueAtTime(0, t);
  gH.gain.linearRampToValueAtTime(0.07, t + 0.015);
  gH.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  gV.gain.setValueAtTime(0.0001, t + 0.03);
  gV.gain.exponentialRampToValueAtTime(0.22, t + 0.08);
  gV.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  src.connect(hiss).connect(gH);
  src.connect(vowel).connect(gV);
  for (const g of [gH, gV]) { g.connect(a.master); g.connect(a.reverb); }
  src.start(t, Math.random() * 1.5);
  src.stop(t + 0.4);
}

// Flight lifecycle

// ---------- The Oracle's truths: truths.json, shuffled without repeats ----------
const FALLBACK = { truths: [{ id: "t01", text: "there is no end" }], deep: [], final: { id: "final", text: "ask again." } };
async function loadTruths() {
  if (truthsData) return truthsData;
  try {
    const r = await fetch("truths.json", { cache: "no-cache" });
    const j = await r.json();
    if (!Array.isArray(j.truths) || !j.truths.length) throw new Error("no truths");
    truthsData = { truths: j.truths, deep: Array.isArray(j.deep) ? j.deep : [], final: j.final || FALLBACK.final };
  } catch (e) { console.warn("Couldn't load truths.json", e); truthsData = FALLBACK; }
  return truthsData;
}
// seen: this cycle's ids; ever: every id ever learned (for the TRUTHS page); cycles: times it went round
function loadSeen() {
  try {
    const s = JSON.parse(localStorage.getItem(TRUTH_KEY) || "{}");
    return { seen: Array.isArray(s.seen) ? s.seen : [], ever: Array.isArray(s.ever) ? s.ever : [], cycles: s.cycles | 0 };
  } catch (e) { return { seen: [], ever: [], cycles: 0 }; }
}
function saveSeen(s) { try { localStorage.setItem(TRUTH_KEY, JSON.stringify(s)); } catch (e) { console.warn("Couldn't save truths", e); } }

// One truth for this flight. Deep ones only if you got very close to the sun.
function pickTruth(maxHeat) {
  const d = truthsData || FALLBACK, s = loadSeen();
  const all = [...d.truths, ...d.deep], total = all.length;
  const ids = new Set(all.map(t => t.id));
  s.seen = s.seen.filter(id => ids.has(id));
  const fresh = list => list.filter(t => !s.seen.includes(t.id));
  const normal = fresh(d.truths), deep = fresh(d.deep);
  const any = l => l[(Math.random() * l.length) | 0];
  let truth, hint = "";
  if (!normal.length && !deep.length) {                     // all learned: the final one, then round again
    s.seen = []; s.cycles++;
    if (!s.ever.includes(d.final.id)) s.ever.push(d.final.id);
    saveSeen(s);
    return { truth: d.final, learned: total, total, hint: "", final: true };
  }
  const nearSun = maxHeat >= DEEP_HEAT;
  if (nearSun && deep.length && (!normal.length || Math.random() < 0.5)) truth = any(deep);
  else if (normal.length) truth = any(normal);
  else {                                                     // only deep ones left, and you didn't get close enough
    const seenList = all.filter(t => s.seen.includes(t.id));
    return { truth: any(seenList.length ? seenList : d.truths), learned: s.seen.length, total, hint: "THE REST ARE CLOSER TO THE SUN", final: false, repeat: true };
  }
  s.seen.push(truth.id);
  if (!s.ever.includes(truth.id)) s.ever.push(truth.id);
  saveSeen(s);
  return { truth, learned: s.seen.length, total, hint, final: false };
}

// ---------- The voice: speechSynthesis, low and slow, the most neutral voice there is ----------
let ttsVoice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return null;
  const vs = speechSynthesis.getVoices();
  if (!vs.length) return null;
  const en = vs.filter(v => /^en(-|_|$)/i.test(v.lang));
  const pool = en.length ? en : vs;
  const pref = [/google us english/i, /samantha/i, /daniel/i, /alex/i, /microsoft (david|mark|zira)/i, /en-us/i];
  for (const re of pref) { const v = pool.find(v => re.test(v.name) || re.test(v.lang)); if (v) return v; }
  return pool.find(v => v.default) || pool[0];
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => { ttsVoice = pickVoice(); };
function speakTruth(text) {
  if (!voiceOn || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    ttsVoice = ttsVoice || pickVoice();
    if (ttsVoice) { u.voice = ttsVoice; u.lang = ttsVoice.lang; }
    u.pitch = 0.6; u.rate = 0.8; u.volume = 1;
    u.onstart = () => speechBed(true);
    u.onend = u.onerror = () => speechBed(false);
    u.onboundary = () => chipNote("square", 2200, 2200, 0.012, 0.02);
    speechSynthesis.speak(u);
  } catch (e) { console.warn("Speech failed", e); }
}
// Browsers only let speech start from a tap: say nothing, inside the tap, so later it's allowed
function primeSpeech() {
  if (!("speechSynthesis" in window)) return;
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); ttsVoice = pickVoice(); }
  catch (e) { console.warn("Speech prime failed", e); }
}

// ---------- The clip: the canvas + the game's sound, from take-off to the truth on the 8-ball ----------
// (speechSynthesis can't be captured by the page, so the truth is also written on the canvas)
function startRecording() {
  if (recorder || !audio || typeof MediaRecorder === "undefined" || !canvas.captureStream) return;
  try {
    const stream = canvas.captureStream(30);
    for (const t of audio.recDest.stream.getAudioTracks()) stream.addTrack(t);
    const types = ["video/mp4;codecs=avc1,mp4a", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
    const mimeType = types.find(t => MediaRecorder.isTypeSupported?.(t)) || "";
    recorder = new MediaRecorder(stream, mimeType ? { mimeType, videoBitsPerSecond: 4e6 } : { videoBitsPerSecond: 4e6 });
    recChunks = [];
    recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
    recorder.onstop = () => {
      const type = recorder?.mimeType || mimeType || "video/webm";
      lastClip = recChunks.length ? new Blob(recChunks, { type }) : null;
      recChunks = []; recorder = null;
      for (const t of stream.getVideoTracks()) t.stop();       // (the audio track belongs to the recDest: keep it)
      // (SAVE CLIP appears in the Oracle's menu once lastClip exists)
    };
    recorder.start(1000);
  } catch (e) { console.warn("Recording failed", e); recorder = null; }
}
function stopRecording() { try { if (recorder && recorder.state !== "inactive") recorder.stop(); } catch (e) { recorder = null; } }
async function saveClip() {
  if (!lastClip) return;
  const ext = lastClip.type.includes("mp4") ? "mp4" : "webm";
  const file = new File([lastClip], `icarus-${Date.now()}.${ext}`, { type: lastClip.type });
  try {
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: "ICARUS — LIVE.AND.DIE" }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const url = URL.createObjectURL(file), a = document.createElement("a");
  a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// ---------- TRUTHS: what you've learned; the rest blacked out (a paged list on the panel) ----------
let truthsView = null;                // { page, rows, count } while the TRUTHS pages are open
async function showTruths() {
  const d = await loadTruths(), s = loadSeen();
  const rows = [...d.truths.map(t => [t, false]), ...d.deep.map(t => [t, true]), [d.final, false]];
  let known = 0;
  const list = rows.map(([t, deep], i) => {
    const has = s.ever.includes(t.id);
    if (has && t !== d.final) known++;
    const num = t === d.final ? "--" : (deep ? "D" : "") + String(i + 1 - (deep ? d.truths.length : 0)).padStart(2, "0");
    return { num, text: has ? t.text : "█".repeat(Math.max(4, Math.min(40, Math.round(t.text.length * 0.8)))), has, deep };
  });
  truthsView = { page: 0, rows: list,
    count: `${known} OF ${d.truths.length + d.deep.length} LEARNED` + (s.cycles ? ` · CYCLE ${s.cycles + 1}` : "") };
}

// Flight lifecycle (cont.)

function startFlight(now) {
  flight = { start: now, maxHeat: 0, maxAlt: 0 };
  lastClip = null;
  startRecording();
  flightOrigin = { x: view.x, z: travel, hx: view.hx, hz: view.hz };
  ghostPath = []; lastGhostRec = 0;
}

function startMelt(now) {
  mode = "melt";
  meltStart = now;
  flight.flown = now - flight.start;
  meltSunR = sunRadius();
  meltAlt0 = altitude; meltPitch0 = view.pitch; meltH0 = view.h; meltBurn0 = burnAmt;
  barrel = null; vloop = null;
  meltX0 = view.x; meltZ0 = travel; meltYaw0 = view.yaw; meltHx = view.hx; meltHz = view.hz;
  lie = null; lieTextUntil = 0;       // all text goes silent
  tilt = null; stutterLeft = 0; fallWhispered = false;
  meltVoice();
  chipCrash();

}

// The water: black, quiet, and then the Oracle rises
function endFlight(flownMs) {
  mode = "oracle";
  const maxHeat = flight ? flight.maxHeat : 0;
  lastScore = flight ? flight.maxAlt : 0;
  saveGhost(ghostPath);
  ghostPath = [];
  flight = null; flightOrigin = null;
  heat = 0; burnAmt = 0;
  wax = []; feathers = []; embers = []; frags = []; visorDrops = []; sunDrips = []; edgeDrips = [];
  oracle = { start: performance.now(), ...pickTruth(maxHeat), spoken: false, shown: false };

// ============================================================
// Gyroscope input (DeviceOrientation)
// ============================================================
// beta/gamma are in the device's portrait frame. Turn them into the device "up" vector,
// rotate it into the screen's frame (so sideways works), and read pitch/roll from that.
// gyro.beta = pitch, gyro.gamma = roll (degrees). "Level" is captured from the first
// reading after you tap Reach up (or Fly again).
function onOrientation(e) {
  if (e.beta == null || e.gamma == null) return;

  const t = (screen.orientation?.angle ?? window.orientation ?? 0) * Math.PI / 180;
  const ux = dx * Math.cos(t) - dy * Math.sin(t), uy = dx * Math.sin(t) + dy * Math.cos(t), uz = dz;
  const pitch = Math.atan2(uy, uz) * 180 / Math.PI;

// iOS needs explicit permission, and only from inside a tap

      const r = await DOE.requestPermission();
      if (r !== "granted") console.warn("Motion permission:", r);
    }

// Tilt in degrees → −1..1, with a small dead zone
function shape(deg, range) {
  const a = Math.max(0, Math.abs(deg) - TILT_DEAD) / (range - TILT_DEAD);
  return Math.sign(deg) * clamp(a, 0, 1);
}

// Per frame: phone tilt (or keys on a desktop) → pitch and roll inputs → targets
function readControls(now, dt) {
  let p = 0, r = 0;

    if (db > 180) db -= 360; else if (db < -180) db += 360;   // pitch (atan2) wraps at ±180
    p = PITCH_SIGN * shape(db, PITCH_RANGE);

  if (keys.has("ArrowUp") || keys.has("w")) p = 1;
  if (keys.has("ArrowDown") || keys.has("s")) p = -1;
  if (keys.has("ArrowLeft") || keys.has("a")) r = -1;
  if (keys.has("ArrowRight") || keys.has("d")) r = 1;
  if (detectFlick(rollHist, now, dt, r)) triggerBarrel(Math.sign(r), now);
  if (detectFlick(pitchHist, now, dt, p) && p > 0) triggerLoop(now);   // top edge flicked toward you
  pitchIn = p; rollIn = r;

  bankTarget = -rollIn * BANK_MAX;               // (bank > 0 = banked left)

}

// A hard, fast flick of the phone sideways: the roll input shoots past BARREL_FLICK,
// quickly, having been near level a moment before → barrel roll that way
function detectFlick(hist, now, dt, r) {
  hist.push([now, r]);
  while (hist.length && hist[0][0] < now - 400) hist.shift();
  const prev = hist.length > 1 ? hist[hist.length - 2][1] : r;
  const rate = (r - prev) / Math.max(dt, 1e-3);
  if (Math.abs(r) < BARREL_FLICK || Math.sign(rate) !== Math.sign(r) || Math.abs(rate) < BARREL_FLICK_RATE) return false;
  const earlier = hist.filter(([t]) => t < now - 180 && t > now - 400);
  if (!earlier.length || earlier.some(([, v]) => Math.abs(v) > BARREL_FLICK_FROM)) return false;
  hist.length = 0;
  return true;
}

addEventListener("keydown", e => {
  keys.add(e.key.length === 1 ? e.key.toLowerCase() : e.key);
  if (e.key === "q") triggerBarrel(-1);
  if (e.key === "e") triggerBarrel(1);
  if (e.key === "l") triggerLoop();
  if (e.key === " ") { e.preventDefault(); triggerBarrel(rollIn < 0 ? -1 : 1); }
});
addEventListener("keyup", e => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
// Double-tap one half of the screen: barrel roll toward that side. Swipe up: loop.
canvas.addEventListener("pointerdown", e => {
  const now = performance.now();
  swipe = { t: now, y: e.clientY };
  if (now - lastTap.t < DOUBLE_TAP && Math.abs(e.clientX - lastTap.x) < 80) {
    triggerBarrel(e.clientX < innerWidth / 2 ? -1 : 1, now);
    lastTap.t = -1e9;
  } else lastTap = { t: now, x: e.clientX };
});
canvas.addEventListener("pointerup", e => {
  const now = performance.now();
  if (swipe && now - swipe.t < SWIPE_MS && swipe.y - e.clientY > SWIPE_MIN) { triggerLoop(now); lastTap.t = -1e9; }
  swipe = null;

// Altitude physics: climb rate follows the tilt (with a little lag); gravity sinks you slowly
function updateAltitude(dt) {
  const target = pitchIn * CLIMB_RATE - SINK_RATE;
  altVel += (target - altVel) * (1 - Math.exp(-dt / ALT_TAU));
  altitude += altVel * dt;
  if (altitude <= 0) { altitude = 0; altVel = Math.max(0, altVel); }
  if (altitude >= 1) { altitude = 1; altVel = Math.min(0, altVel); }
}

// ============================================================
// Game logic (per frame)
// ============================================================
function step(now, dt) {
  if (mode === "live") { readControls(now, dt); updateAltitude(dt); }
  else if (mode === "oracle") { thrustEff = 0; }

  // Always flying forward along the heading: base speed, faster with altitude and when diving.
  // The melt keeps your momentum.
  if (mode !== "melt") {
    const target = (SPEED_BASE + SPEED_ALT * altitude) * (1 + DIVE_GAIN * thrustEff);
    fwdSpeed += (target - fwdSpeed) * (1 - Math.exp(-dt / CAM_TAU));
    // Banking drifts the world sideways (camera slides along -right = (-hz, +hx))
    view.x -= bank * DRIFT * dt * view.hz;
    travel += bank * DRIFT * dt * view.hx;
    view.x += view.hx * fwdSpeed * dt;
    travel += view.hz * fwdSpeed * dt;
  }
  updateGlitch(now, dt);
  updateView(now, dt);                    // (during the long fall it places the camera itself)
  sunAim = sunAimNow();
  updateFigures(dt);
  updateVisor(dt);

  updateRain(dt);
  updateFrags(dt);
  updateEmbers(dt);

  if (mode === "live") {
    spawnWax(dt);
    spawnFeathers(dt);
    spawnFigures(dt);
    recordGhost(now);
    updateLie(now, dt);

    // Heat is nearness: it builds as you close on the sun and fades as you back off.
    // Touch it (full heat) and you melt.
    const near = Math.pow(clamp((HEAT_FAR - sunDist()) / (HEAT_FAR - HEAT_NEAR), 0, 1), 1.4);
    heat += (near - heat) * (1 - Math.exp(-dt / (near > heat ? HEAT_RISE : HEAT_FALL)));
    if (near >= 1) heat = 1;
    burnAmt = heat * BURN_LIVE;
    if (flight) { flight.maxHeat = Math.max(flight.maxHeat, heat); flight.maxAlt = Math.max(flight.maxAlt, altitude); }

    if (!flight && altitude > SEA_LINE) { startFlight(now); seaSince = 0; }

    if (flight && heat >= 0.995) { startMelt(now); return; }
    // Sank back into the sea and stayed there: the flight is over
    if (flight) {
      if (altitude <= 0.001) {
        if (!seaSince) seaSince = now;
        else if (now - seaSince > SEA_END * 1000) { endFlight(seaSince - flight.start); return; }
      } else seaSince = 0;
    }

    updateVoice(true, dt);
  } else if (mode === "melt") {
    // The hands burn through on the way down: tips first, bone by the time the water's near
    const u = clamp((now - meltStart) / 1000 / (FALL_TIME * BURN_FALL_END), 0, 1);
    burnAmt = lerp(meltBurn0, 1.08, u * u * (3 - 2 * u));
    spawnWax(dt);
    if (now - meltStart > FALL_TIME * 1000) {
      altitude = 0;                   // in the water: cut to black, then the Oracle
      endFlight(flight.flown);
    }
  }
}

// ============================================================
// Rendering: black, dots only, sun, horizon
// ============================================================
// ---------- Sun: a fixed place in the world; it grows as you actually get nearer ----------
const sunDist = () => Math.hypot(SUN_X - view.x, SUN_Y - view.h, SUN_Z - travel);

  const byDist = clamp(focal * SUN_WORLD_R / sunDist(), SUN_MIN_R, SUN_MAX_R);
  return lerp(byDist, SUN_MAX_R, heat * 0.3);          // and swells with heat
}

  let r = sunRadius(), flare = heat;
  if (mode === "melt") {

    const u = clamp((now - meltStart) / 1000 / MELT_TIME, 0, 1);
    r = meltSunR * Math.pow(1 - u, 1.6); flare = 1 - u * 0.6;
  }

  if (c[2] <= 0.05) return { x: 0, y: 0, r: 0, flare, face: 0 };     // behind you
  const [x, y] = toScreen(c);
  // Its face resolves as you near it
  const face = mode === "melt" ? 0 : clamp((r / SUN_FACE_R - FACE_FROM) / (1 - FACE_FROM), 0, 1);
  // It melts as you near it: 0 far off, 1 when you touch it (and all through the fall)
  const melt = mode === "melt" ? 1 : Math.pow(clamp((heat - 0.12) / 0.88, 0, 1), 1.3);
  return { x, y, r, flare, face, melt };
}

// The sun is a fixed point in the world: turn away and it slides off; fly past and it's behind you

// 1 with the sun dead centre, falling to 0 at AIM_CONE off-centre
function sunAimNow() {
  const c = sunCam();
  if (c[2] <= 0) return 0;
  const off = Math.atan2(Math.hypot(c[0], c[1]), c[2]);
  return clamp(1 - off / AIM_CONE, 0, 1);

// ============================================================
// THE PANEL: a 384x224 red LED screen, drawn pixel by pixel
// ============================================================
// Everything is drawn into fb (one brightness byte per pixel; painter's order: later covers earlier,
// and solids are filled black, so near shapes hide the lines behind them). present() then snaps every
// pixel to the panel's only four colours, #000000 #550000 #aa0000 #ff0000 (ordered dithering for
// anything in between), adds the LED scan flicker and a faint trace of the last frame, and blows it

function present(eye, ox) {

  const flick = Math.random() < 0.12 ? (Math.random() * FB_H) | 0 : -1; // now and then one row flickers
  let i = 0;

    for (let x = 0; x < FB_W; x++, i++) {

      const p = prev[i]; prev[i] = l;

let LT0 = 0, LT1 = 1;

// ---------- The panel's own type: an original 5x7 pixel font ----------

// ---------- Low-poly shapes ----------
const ICO_V = (() => {
  const t = (1 + Math.sqrt(5)) / 2;
  return [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t], [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]]
    .map(a => { const l = Math.hypot(...a); return a.map(c => c / l); });
})();
const ICO_F = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],

const GEO = (() => {
  const v = ICO_V.map(p => p.slice()), f = [], cache = new Map();
  const mid = (a, b) => {
    const k = a < b ? a * 100 + b : b * 100 + a;
    if (cache.has(k)) return cache.get(k);
    const p = v[a].map((c, i) => (c + v[b][i]) / 2), l = Math.hypot(...p);
    v.push(p.map(c => c / l)); cache.set(k, v.length - 1);
    return v.length - 1;
  };
  for (const [a, b, c] of ICO_F) { const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a); f.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]); }
  return { v, f };
})();

// ---------- Sun: a solid low-poly sphere; it warps and jitters with heat, and melts ----------
function drawSun(now, s) {
  if (s.r < 2) return;
  const f = s.flare, R = s.r, mf = s.melt || 0, mt = now / 1000, tw = now / 110, spin = now / 5000;
  const ct = Math.cos(0.4), st = Math.sin(0.4), cs = Math.cos(spin), ss = Math.sin(spin);
  const P = GEO.v.map(([x0, y, z0]) => {
    const x = x0 * cs + z0 * ss, z = -x0 * ss + z0 * cs;           // turning
    const y2 = y * ct - z * st, z2 = y * st + z * ct;              // axis tilted toward you
    const w = 1 + f * (0.07 * Math.sin(y * 6 + x0 * 4 + tw) + 0.04 * Math.sin(z0 * 9 - tw * 1.7)) + f * f * (Math.random() - 0.5) * 0.05;
    let xx = x * w, yy = y2 * w;
    if (mf > 0) {                                                  // melting: bulges, the lower half sags like wax
      xx *= 1 + mf * 0.18 * (1 - Math.abs(yy));
      const low = Math.max(0, -yy);
      yy -= mf * 0.55 * low * low * (1 + 0.35 * Math.sin(x0 * 5 + mt * 0.8));
    }
    return [(s.x + xx * R) * FBS, (s.y - yy * R) * FBS, z2];
  });

  for (const t of GEO.f) { const z = P[t[0]][2] + P[t[1]][2] + P[t[2]][2]; if (z > -0.3) fr.push([z, t]); }
  fr.sort((a, b) => a[0] - b[0]);

    const p = [P[t[0]][0], P[t[0]][1], P[t[1]][0], P[t[1]][1], P[t[2]][0], P[t[2]][1]];
    pxFill(p, 0); pxOutline(p, v);
  }
  if (!s.dim) drawCorona(s, now);
  if (s.face > 0.02) drawSunFace(s, now);
}

// The corona: a few flame tongues off the limb, short and lazy from afar, long and roaring up close
function drawCorona(s, now) {
  const f = s.flare, R = s.r, t = now / 1000;
  const n = Math.round(lerp(8, 20, f)), b = 0.3 + 0.7 * f;
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * Math.PI * 2 + t * 0.15 * (1 + 2 * f);
    const len = R * (0.08 + 0.5 * f * (0.5 + 0.5 * Math.sin(t * (6 + 9 * f) + i * 1.7)) + 0.04 * Math.random() * f);
    const lean = 0.25 * Math.sin(t * 3 + i) * f;
    const x0 = s.x + Math.cos(a0) * R * 1.02, y0 = s.y + Math.sin(a0) * R * 1.02;
    const x1 = s.x + Math.cos(a0 + lean * 0.5) * (R + len * 0.55), y1 = s.y + Math.sin(a0 + lean * 0.5) * (R + len * 0.55);
    const x2 = s.x + Math.cos(a0 + lean) * (R + len), y2 = s.y + Math.sin(a0 + lean) * (R + len);
    wire(x0, y0, x1, y1, b); wire(x1, y1, x2, y2, b * 0.6);
    if (f > 0.5 && Math.random() < (f - 0.5) * 0.5) wireDot(x2 + (Math.random() - 0.5) * 20, y2 + (Math.random() - 0.5) * 20, 4, b);
  }
}

// The face: eyes, nose, mouth. Far off it's scattered fragments; very close, they pull together.
// With heat the brows come down, the eyes narrow, the mouth opens: it does not want you here.
function drawSunFace(s, now) {
  const R = s.r, a = s.face, f = s.flare, scatter = (1 - a) * R * 0.45, tw = now / 110;
  const J = () => (Math.random() - 0.5) * (scatter + f * f * R * 0.025);
  const P = (u, v) => [s.x + u * R + J(), s.y + v * R + J()];
  const b = 0.4 + 0.6 * a;
  for (const sd of [-1, 1]) {
    const ex = sd * 0.32, eye = [];
    const h = 0.05 + 0.02 * Math.sin(tw * 0.3) - 0.03 * f;
    for (let i = 0; i <= 8; i++) { const t = (i / 8) * Math.PI * 2; eye.push(P(ex + Math.cos(t) * 0.13, -0.18 + Math.sin(t) * Math.max(0.012, h))); }
    wirePoly(eye, b);
    if (f > 0.15) { const k = (f - 0.15) / 0.85; wirePoly([P(ex - sd * 0.18, -0.34 + 0.02 * k), P(ex + sd * 0.1, -0.32 + 0.1 * k)], b * k); }
    if (f > 0.6) wireDot(s.x + ex * R, s.y - 0.18 * R, 6 + 6 * f, b);
  }
  wirePoly([P(0, -0.1), P(0.05, 0.12), P(-0.03, 0.15)], b * 0.8);
  const open = 0.22 * f * (0.7 + 0.3 * Math.sin(tw * 0.5)), top = [], bot = [];
  for (let i = 0; i <= 8; i++) {
    const u = -0.3 + (i / 8) * 0.6, e = 1 - (u / 0.3) ** 2;
    top.push(P(u, 0.42 - 0.06 * e - open * 0.25 * e));
    bot.push(P(u, 0.42 - 0.06 * e + open * e));
  }
  wirePoly(top, b);
  if (open > 0.01) {
    wirePoly(bot, b);
    for (let i = 1; i < 8; i += 2) wire(top[i][0], top[i][1], top[i][0], top[i][1] + open * R * 0.4 * (1 - ((i / 8 - 0.5) * 2) ** 2), b * 0.6);
  }
}

// ---------- The sun lies: at high heat it briefly duplicates or drifts ----------
function updateLie(now, dt) {
  if (lie && now > lie.end) lie = null;
  const every = lerp(LIE_EVERY, 0.8, clamp((heat - LIE_HEAT) / (1 - LIE_HEAT), 0, 1));
  if (!lie && heat > LIE_HEAT && Math.random() < dt / every) {
    const dur = 700 + Math.random() * 600;
    lie = { start: now, end: now + dur, kind: Math.random() < 0.5 ? "double" : "drift",
            dx: (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.5), dy: (Math.random() - 0.5) * 0.6 };

  }
}
function drawSunWithLies(now, sun) {
  if (!lie || sun.r < 2) { drawSun(now, sun); return; }
  const u = clamp((now - lie.start) / (lie.end - lie.start), 0, 1), env = Math.sin(u * Math.PI);
  if (lie.kind === "double") {
    drawSun(now, { ...sun, x: sun.x + lie.dx * sun.r * 1.4 * env, y: sun.y + lie.dy * sun.r * env, face: 0 });
    drawSun(now, sun);
  } else {
    drawSun(now, { ...sun, x: sun.x + lie.dx * sun.r * 1.2 * env, y: sun.y + lie.dy * sun.r * env });
  }

// ---------- The renderer fails at high heat ----------

// ---------- Wax on the visor: drops land, stick, slip down; behind them the view goes dim and grainy ----------
function updateVisor(dt) {
  if (mode === "live" && heat > VISOR_FROM && visorDrops.length < VISOR_CAP && Math.random() < heat * heat * VISOR_RATE * dt) {
    visorDrops.push({ x: Math.random() * W, y: Math.random() * H * 0.85, r: (8 + Math.random() * 18) * (0.6 + heat * 0.6), vy: 0, stick: 0.3 + Math.random() * 1.5, trail: [] });

    if (mode === "melt") d.vy += 2500 * dt;

      else d.vy *= 1 - 3 * dt;

    const last = d.trail[d.trail.length - 1];
    if (d.vy > 5 && (!last || d.y - last[1] > d.r * 0.6)) { d.trail.push([d.x, d.y - d.r * 0.4]); if (d.trail.length > 6) d.trail.shift(); }

}

    d.trail.forEach(([tx, ty], i) => { const tr = (d.r * 0.25 * (i + 1) / d.trail.length) * FBS; pxWax(tx * FBS, ty * FBS, tr, tr * 1.3); });

// ---------- Greek rain: falling columns behind the world ----------

// letters glitch into Latin and symbols. Three depths: dimmer = further.
const RAIN_SIZES = [27, 27, 27];

    x: Math.round((Math.random() * W) / 27) * 27 + 13, y: anywhere ? Math.random() * H : -Math.random() * 300,
    d, size, v: [45, 75, 115][d] * (0.8 + Math.random() * 0.4),

function updateRain(dt) {

    c.y += c.v * speed * dt;
    c.t += dt;
    if (c.t > c.swap) { c.t = 0; c.swap = (0.05 + Math.random() * 0.3) / (1 + dens * 2); c.chars[(Math.random() * c.chars.length) | 0] = rainChar(); }
  }

    if (rain.length > want) return false;

function drawRain() {
  const g = sunGlitch();
  for (const c of rain) {

// ---------- The body: two hands at the lower corners, solid, burning to the bone ----------
// Built in hand-local space (right hand; y along the fingers, x across with the thumb at -x,
// z forward), then posed and projected. Flesh is black polygons with red edges (so the hands block
// the world); as heat rises it burns off from the fingertips and the bones show.
const FINGERS = [   // knuckle position, splay, segment lengths, half-width
  { x: -0.17,  y: 0.56, splay: -0.10, len: [0.25, 0.15, 0.11],  w: 0.045 },   // index
  { x: -0.055, y: 0.58, splay: -0.02, len: [0.28, 0.17, 0.12],  w: 0.047 },   // middle
  { x: 0.06,   y: 0.56, splay: 0.06,  len: [0.26, 0.16, 0.115], w: 0.044 },   // ring
  { x: 0.165,  y: 0.51, splay: 0.15,  len: [0.20, 0.125, 0.10], w: 0.038 },   // pinky
