<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Icarus</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  /* Fixed 720x1280 canvas, scaled to fit the screen with letterboxing */
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; object-fit: contain; }

  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
  }
  .hidden { display: none; }
  #results { background: rgba(0, 0, 0, .72); }

  button {
    font: inherit; font-size: 18px; letter-spacing: .12em; text-transform: uppercase;
    color: #fff; background: transparent; border: 1px solid #e0301e;
    padding: 16px 38px; border-radius: 40px; min-width: 200px;
    box-shadow: 0 0 24px rgba(224, 48, 30, .35);
  }
  button:active { background: rgba(224, 48, 30, .25); }
  button:disabled { opacity: .45; }
  button.blue { border-color: #3d7bff; box-shadow: 0 0 24px rgba(61, 123, 255, .3); }

  #flew { font-size: 64px; font-weight: 200; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<canvas id="canvas" width="720" height="1280"></canvas>

<!-- First screen: one button. It unlocks audio, asks for motion access and sets "level". -->
<div id="intro" class="screen">
  <button id="reach">Reach up</button>
</div>

<!-- After a flight: duration, Save, Fly again. Nothing else. -->
<div id="results" class="screen hidden">
  <div id="flew">0.0s</div>
  <button id="save">Save</button>
  <button id="again" class="blue">Fly again</button>
</div>

<script type="module">
// ============================================================
// Constants
// ============================================================

// Gyroscope controls (DeviceOrientation). "Level" = how the phone is held when you tap.
const PITCH_SIGN = 1;         // +1: tilting the top edge toward you climbs. Flip to -1 for the other way.
const PITCH_RANGE = 30;       // degrees of tilt for full climb / dive
const ROLL_RANGE = 30;        // degrees of roll for a full bank / turn
const TILT_DEAD = 3;          // degrees of dead zone around level
const CLIMB_RATE = 0.35;      // altitude units / s at full climb
const SINK_RATE = 0.03;       // gravity: holding level slowly sinks
const ALT_TAU = 0.4;          // seconds for the climb rate to follow the tilt
const DIVE_GAIN = 1.3;        // speed × (1 + 1.3) in a full dive
const SEA_END = 3.0;          // seconds back at sea level that end a flight

// Zones (altitude: 0 = the sea, 1 = the top)
const SEA_LINE = 0.30;        // below this: the sea
const SUN_LINE = 0.70;        // above this: the sun

// Heat / melt
const HEAT_TIME   = 4.0;      // seconds in the sun to reach full heat
const COOL_TIME   = 3.0;      // seconds out of the sun to cool fully
const MELT_TIME   = 2.0;      // length of the melt sweep (the fall itself is FALL_TIME)

// Pitch
const ROOT_HZ = 110;          // A2: the sea tone and the bottom of the sky
const RANGE_SEMIS = 36;       // ~3 octaves from the sea line to the top of the frame
const PENTATONIC = [0, 2, 4, 7, 9];   // major pentatonic degrees
const SNAP = 0.75;            // 0 = fully continuous, 1 = hard snap to the scale

// Loudness / melt sound
const BASE_GAIN = 0.32;       // voice level at zero heat
const HEAT_DB = 6;            // extra gain at full heat (the moment before the melt)
const MELT_OCTAVES = 2.5;     // how far the pitch falls during the melt
const SEA_AFTER_GAIN = 0.08;  // quiet sea tone that returns after the fall

// Canvas
const W = 720, H = 1280;
const SUN_MIN_R = 50;
const SUN_MAX_R = H * 0.2 / 1.12;     // sphere ≈ 40% of the frame at most (incl. heat warp)

// First-person flight. World axes: x right, y up (ground at 0), z forward.
// Red wireframe vectors on black.
const RED = "rgb(255, 0, 0)";
const FOCAL = 560;                    // px per world unit at distance 1
const NEAR = 0.15;                    // near clip plane
const PITCH_MAX = Math.atan((H / 2 - 60) / FOCAL);   // near the sun the horizon sits at the bottom edge
const CAM_H_SEA = 0.45, CAM_H_TOP = 4.5;             // eye height over the ground
const SPEED_BASE = 4, SPEED_ALT = 10;                // forward speed when hovering, + extra at the top
const BANK_MAX = 0.6;                 // radians of camera roll at full phone roll
const DRIFT = 7;                      // sideways world units / s per radian of bank
const YAW_RATE = 1.3;                 // radians / s of turn at full phone roll
const CAM_PITCH_TILT = 0.25;          // extra camera nose up/down from the phone's pitch (radians at full)
const FOV_WIDEN = 0.35;               // field of view widens in a dive (focal / 1.35 at full)
const CAM_TAU = 0.1;                  // camera easing time constant, seconds
const SUN_ELEV = 41 * Math.PI / 180;  // the sun: fixed in the world, this far above the horizon
const AIM_CONE = 14 * Math.PI / 180;  // heat only builds with the sun within this angle of centre
const GRID = 2, GRID_LINES = 20;      // ground grid spacing, lines per axis
const VIEW_FAR = 36;                  // depth-fade distance
const MOUNTAIN_N = 8, TOWER_N = 5, CLOUD_N = 4, SPEED_N = 50;
const CLOUD_SPLIT = 5;                // clouds start parting this far ahead
const WIRE_LEVELS = 8;                // brightness buckets for batched line drawing

// The ones before you: dot figures falling past (more the higher you are)
const FIG_MAX = 6;
const FIG_RATE_LOW = 0.04, FIG_RATE_HIGH = 0.5;      // spawns / s at the bottom / top
const FIG_CLIMBER = 0.15;             // chance one is still climbing beside you first
const FIG_GRAVITY = 6;

// Your own ghosts: every past flight's path, in localStorage
const GHOST_KEY = "icarus.ghosts.v1";
const GHOST_MAX = 50;                 // flights kept
const GHOST_STEP = 250;               // ms between recorded points
const GHOST_POINTS = 600;             // per flight (2.5 min)

// The father, standing on the ground ahead
const FATHER_AHEAD = 12;              // units ahead along your heading
const FATHER_FOLLOW = 1.5;            // seconds to catch up when you turn (so turns sweep him)

// The long fall
const FALL_TIME = 10;                 // seconds from the melt to the water
const FALL_UP = 0.6;                  // while the nose comes down, the ground drops far below
const FALL_H = 40;                    // ...to this height
const FALL_G = 2 * (FALL_H - 0.3) / Math.pow(FALL_TIME - FALL_UP, 2);   // reach the water at FALL_TIME
const FALL_TEXT_AT = FALL_TIME - 1.6; // "he also flew." appears
const SEA_SPACING = 4, SEA_LINES = 31, SEA_HALF = 60;

// The sun's face and its lies
const FACE_FROM = 0.75;               // sun size (of max) where the face starts to resolve
const LIE_HEAT = 0.75;                // anomalies only above this heat
const LIE_EVERY = 4;                  // average seconds between them

// Two voices
const DRONE_FLAT = 18;                // cents: the father's drone sits flat...
const FATHER_PULL = 12;               // ...and pulls the main tone this many cents flat (at sea)
const SUN_BEAT = 1.006;               // the sun's two sines beat against each other: shimmer

// Wax on the visor
const VISOR_CAP = 40;
const VISOR_FROM = 0.15;              // heat where drops start landing
const VISOR_RATE = 3;                 // drops / s at full heat

// The renderer fails at high heat
const GLITCH_FROM = 0.55;             // heat where it starts; worst at full heat
const GREEK = "αβγδεζηθικλμνξοπρστυφχψωΓΔΘΛΞΠΣΦΨΩ";

// Greek rain, behind everything
const RAIN_MAX = 30;                  // columns at full density
const RAIN_MIN = 6;                   // columns at sea
const LATIN = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*+=<>/\\|?!";

// The body: two rendered wireframe hands at the lower corners
const HAND_BASE = [0.42, -0.62, 1.0]; // right hand's wrist in camera space (left is mirrored)
const HAND_SCALE = 0.42;              // hand length in camera units
const HAND_PITCH = 0.6;               // fingers tipped forward, away from you (radians about x)
const HAND_INWARD = 0.25;             // tilted in toward the centre (radians about z)
const BONE = "rgb(255, 215, 200)";    // white-red bones
const CHAR = "rgb(255, 120, 40)";     // flesh about to burn
const BURN_TIP = 0.15, BURN_WRIST = 0.95;            // heat where fingertips / wrist flesh burns away
const FRAG_CAP = 160;                 // burnt flesh fragments in the air
const COVER_IN = 0.8;                 // melt: seconds for the hands to rise over the camera
const COVER_OUT_AT = FALL_TIME - 1.2, COVER_OUT = 0.6;   // ...and when / how fast they drop away
const FEATHER_CAP = 50;
const WAX_CAP = 110;
const WAX_COLORS = ["rgb(255, 70, 30)", "rgb(255, 105, 40)", "rgb(235, 45, 25)", "rgb(255, 135, 60)"];

// ============================================================
// DOM + state
// ============================================================
const $ = id => document.getElementById(id);
const canvas = $("canvas"), ctx = canvas.getContext("2d");
let audio = null;
let recStream = null, recorder = null, chunks = [];
let lastBlob = null;

let mode = "intro";           // intro | live | melt | results
let altitude = 0;             // 0..1, a physics value driven by the phone's pitch
let altVel = 0;               // altitude units / s
let heat = 0;                 // 0..1
let flight = null;            // { start } while a flight is in progress
let seaSince = 0;             // when you last sank back to sea level during a flight
let meltStart = 0, meltSunR = 0;
let lastFrame = performance.now();

// Gyro input: raw orientation, the "level" it's measured from, and the shaped inputs
const gyro = { beta: null, gamma: null, beta0: 0, gamma0: 0, calibrate: true, seen: false };
const keys = new Set();       // desktop fallback: arrow keys / WASD
let pitchIn = 0, rollIn = 0;  // −1..1: climb(+)/dive(−), roll right(+)/left(−)

// Camera (updated every frame in updateView). pitch > 0 looks up; roll > 0 = banked left.
// yaw > 0 = heading right. The camera flies along its heading (hx, hz).
const view = { x: 0, h: CAM_H_SEA, yaw: 0, pitch: 0, roll: 0, cy: 1, sy: 0, hx: 0, hz: 1, cp: 1, sp: 0, cr: 1, sr: 0 };
let focal = FOCAL;                    // widens (smaller) in a dive
let viewAlt = 0;                      // altitude the camera shows (falls during the melt)
let travel = 0;                       // the camera's world z
let fwdSpeed = SPEED_BASE;            // world units / s, always forward
let bank = 0, bankTarget = 0;         // camera roll from the phone's roll
let yawRate = 0, yawTarget = 0;       // turn rate from the phone's roll
let thrustEff = 0;                    // 0..1: how hard you're diving (drives speed, FOV, speed lines, engine)
let sunAim = 0;                      // 1 = sun dead centre, 0 = outside the aim cone
let meltAlt0 = 0, meltPitch0 = 0, meltH0 = CAM_H_SEA;
let meltX0 = 0, meltZ0 = 0, meltYaw0 = 0, meltHx = 0, meltHz = 1;   // where the fall began

let figures = [];                     // the ones before you
const father = { x: 0, z: FATHER_AHEAD };
let ghosts = loadGhosts();            // past flights: flat [fwd, lat, h, fwd, lat, h, ...]
let ghostPath = [], lastGhostRec = 0; // the flight being recorded
let flightOrigin = null;              // { x, z, hx, hz } at take-off; ghosts are laid out from here
let lie = null;                       // { start, end, kind, dx, dy }: the sun lying to you
let lieTextUntil = 0;
let fallWhispered = false;

let visorDrops = [];                  // wax on the lens
let blurCanvas = null, blurCtx = null;
let stutterLeft = 0;                  // frames to hold (renderer failing)
let tilt = null;                      // { start, end, amt }: the horizon tilting on its own

// The body: rendered hands (screen-space results kept for wax, feathers and burn fragments)
let handTips = [];                    // fingertip screen points this frame
let handPtsScreen = [];               // a few screen points on the hands, for feathers
const burnt = new Set();              // flesh segment ids already burnt off (so fragments spawn once)
let frags = [];                       // burnt flesh falling away: { cx, cy, hx, hy, vx, vy, spin, life, max }
let rain = [];                        // Greek rain columns

// Wire scenery in world coordinates (spawned ahead along the current heading)
const mountains = Array.from({ length: MOUNTAIN_N }, () => spawnMountain({}, 6 + Math.random() * 34));
const towers = Array.from({ length: TOWER_N }, () => spawnTower({}, 4 + Math.random() * 30));
const cloudShapes = Array.from({ length: CLOUD_N }, (_, i) => spawnCloud({}, 8 + i * 8 + Math.random() * 4));
const speedLines = Array.from({ length: SPEED_N }, () => spawnSpeed({}, 1 + Math.random() * 20));

let feathers = [], wax = [];

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ============================================================
// 3D helpers (function declarations: hoisted, used during init)
// ============================================================

// ---------- Scenery spawners (placed `ahead` units in front of the camera) ----------
function side() { return Math.random() < 0.5 ? -1 : 1; }   // hoisted: used during init

// Put o at `ahead` units along the heading and `lat` units to the right of it
function place(o, ahead, lat) {
  o.x = view.x + view.hx * ahead + view.hz * lat;
  o.z = travel + view.hz * ahead - view.hx * lat;
  return o;
}
// Forward / sideways distance of a world point from the camera, along the heading
const fwdOf = (x, z) => (x - view.x) * view.hx + (z - travel) * view.hz;
const latOf = (x, z) => (x - view.x) * view.hz - (z - travel) * view.hx;

// Jagged mountain ridge at the side, facing the heading it was spawned on:
// profile of (u 0..1 across, h 0..1 up), laid out along (ax, az)
function spawnMountain(m, ahead) {
  m.w = 4 + Math.random() * 7;
  m.h = 1.5 + Math.random() * 4.5;
  m.ax = view.hz; m.az = -view.hx;
  place(m, ahead, side() * (5 + Math.random() * 16) - m.w / 2);
  const n = 7 + ((Math.random() * 5) | 0), peak = 1 + ((Math.random() * (n - 2)) | 0);
  m.prof = [];
  for (let i = 0; i <= n; i++) {
    const h = i === 0 || i === n ? 0 : i === peak ? 1 : 0.25 + Math.random() * 0.6;
    m.prof.push([i / n + (i && i < n ? (Math.random() - 0.5) * 0.5 / n : 0), h]);
  }
  return m;
}

// Lattice tower, some close enough to pass right beside you
function spawnTower(t, ahead) {
  place(t, ahead, side() * (1.5 + Math.random() * 9));
  t.h = 2 + Math.random() * 3.5;
  t.levels = 4 + ((Math.random() * 3) | 0);
  return t;
}

// Jagged cloud outline at eye level (yRel = height relative to the camera), flattish bottom
function spawnCloud(c, ahead) {
  place(c, ahead, (Math.random() - 0.5) * 5);
  c.yRel = -0.3 + Math.random() * 0.8;
  const rx = 1.5 + Math.random() * 1.5, ry = rx * (0.3 + Math.random() * 0.15);
  c.pts = [];
  const n = 16;                       // index 0 = right, n/4 = top, n/2 = left, 3n/4 = bottom
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, j = 0.8 + Math.random() * 0.4;
    c.pts.push([Math.cos(a) * rx * j, Math.max(Math.sin(a) * ry * j, -ry * 0.35)]);
  }
  return c;
}

function spawnSpeed(p, ahead) {
  place(p, ahead, (Math.random() - 0.5) * 10);
  p.y = Math.max(0.05, view.h + (Math.random() - 0.5) * 6);
  return p;
}

// ---------- Camera projection ----------
// World offset → camera space [x, y, depth]: yaw, then pitch; roll is applied on screen.
function dirCam(dx, dy, dz) {          // also used directly for directions (points at infinity)
  const rx = dx * view.cy - dz * view.sy, rz = dx * view.sy + dz * view.cy;
  return [rx, dy * view.cp - rz * view.sp, dy * view.sp + rz * view.cp];
}
function toCam(x, y, z) { return dirCam(x - view.x, y - view.h, z - travel); }
function toScreen(c) {
  const k = focal / c[2], sx = c[0] * k, sy = -c[1] * k;
  return [W / 2 + sx * view.cr - sy * view.sr, H / 2 + sx * view.sr + sy * view.cr];
}
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR];
}
// One 3D line segment, clipped to the near plane, into the wire batch
function seg3(x1, y1, z1, x2, y2, z2, b) {
  if (b <= 0.02) return;
  let a = toCam(x1, y1, z1), c = toCam(x2, y2, z2);
  if (a[2] < NEAR && c[2] < NEAR) return;
  if (a[2] < NEAR) a = clipNear(a, c); else if (c[2] < NEAR) c = clipNear(c, a);
  const p = toScreen(a), q = toScreen(c);
  wire(p[0], p[1], q[0], q[1], b);
}

// Per-frame camera: altitude pitches it up and lifts it; the phone's roll banks it; the melt dives it
function updateView(now, dt) {
  const k = 1 - Math.exp(-dt / CAM_TAU);           // ~100 ms camera easing
  if (mode === "melt") {
    // THE LONG FALL: nose comes down while the ground drops far below (hidden by the pitch),
    // then free fall toward the father, the sea rushing up, ending just above the water facing him.
    const t = (now - meltStart) / 1000;
    const smooth = v => v * v * (3 - 2 * v);
    viewAlt = meltAlt0 * Math.max(0, 1 - t / MELT_TIME);
    const s = smooth(clamp((t - 0.3) / (FALL_TIME - 1), 0, 1));
    view.x = lerp(meltX0, father.x - meltHx * 2.5, s);
    travel = lerp(meltZ0, father.z - meltHz * 2.5, s);
    if (t < FALL_UP) view.h = lerp(meltH0, FALL_H, smooth(t / FALL_UP));
    else { const tt = t - FALL_UP; view.h = Math.max(0.25, FALL_H - 0.5 * FALL_G * tt * tt); }
    const dx = father.x - view.x, dz = father.z - travel;
    const lookPitch = clamp(Math.atan2(0.6 - view.h, Math.hypot(dx, dz)), -1.5, 0.9);
    let dyaw = Math.atan2(dx, dz) - meltYaw0;
    dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));                // shortest way round
    const blend = smooth(clamp(t / 1.6, 0, 1));
    view.pitch = lerp(meltPitch0, lookPitch, blend);
    view.yaw = meltYaw0 + dyaw * blend;
    bank = Math.sin(t * 2.3) * 0.25 * (1 - t / FALL_TIME) * blend + Math.sin(t * 7) * 0.08 * (1 - blend);
    yawRate = 0;
    focal += (FOCAL - focal) * k;
  } else {
    viewAlt = altitude;
    const sky = clamp((viewAlt - SEA_LINE) / (1 - SEA_LINE), 0, 1);
    const ease = sky * sky * (3 - 2 * sky);
    view.pitch += (PITCH_MAX * ease + CAM_PITCH_TILT * pitchIn - view.pitch) * k;   // + nose follows the phone
    view.h += (lerp(CAM_H_SEA, CAM_H_TOP, Math.pow(sky, 1.2)) - view.h) * k;
    bank += (bankTarget - bank) * k;
    yawRate += (yawTarget - yawRate) * k;
    focal += (FOCAL / (1 + FOV_WIDEN * thrustEff) - focal) * k;   // wider view in a dive
    // The father keeps his distance ahead, catching up slowly so your turns sweep him across the view
    const kf = 1 - Math.exp(-dt / FATHER_FOLLOW);
    father.x += (view.x + view.hx * FATHER_AHEAD - father.x) * kf;
    father.z += (travel + view.hz * FATHER_AHEAD - father.z) * kf;
  }
  view.yaw += yawRate * dt;
  view.cy = Math.cos(view.yaw); view.sy = Math.sin(view.yaw);
  view.hx = view.sy; view.hz = view.cy;
  view.roll = bank + tiltNow(now);            // the horizon sometimes tilts on its own (renderer failing)
  view.cp = Math.cos(view.pitch); view.sp = Math.sin(view.pitch);
  view.cr = Math.cos(view.roll);  view.sr = Math.sin(view.roll);
}

// ============================================================
// Pitch: continuous, soft-snapped to a major pentatonic scale
// ============================================================
function softSnap(semis) {
  const oct = Math.floor(semis / 12);
  let best = 0, bestDist = Infinity;
  for (let o = oct - 1; o <= oct + 1; o++) {
    for (const d of PENTATONIC) {
      const n = o * 12 + d, dist = Math.abs(n - semis);
      if (dist < bestDist) { best = n; bestDist = dist; }
    }
  }
  return best + (semis - best) * (1 - SNAP);
}
const hzOf = semis => ROOT_HZ * Math.pow(2, semis / 12);

// ============================================================
// Audio: one voice. Two detuned oscillators + a sub, lowpass,
// soft saturation, an octave shimmer, and a light reverb.
// ============================================================
function makeImpulse(ac, seconds = 2.8, decay = 3) {
  const len = Math.floor(ac.sampleRate * seconds);
  const buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}

function makeSaturationCurve(drive = 3) {
  const n = 1024, curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * 2 - 1;
    curve[i] = Math.tanh(drive * x) / Math.tanh(drive);
  }
  return curve;
}

function initAudio() {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const node = {
    osc1: ac.createOscillator(), osc2: ac.createOscillator(),
    sub: ac.createOscillator(), shim: ac.createOscillator(),
    g1: ac.createGain(), g2: ac.createGain(), gSub: ac.createGain(), gShim: ac.createGain(),
    mix: ac.createGain(), filter: ac.createBiquadFilter(),
    dry: ac.createGain(), shaper: ac.createWaveShaper(), wet: ac.createGain(),
    amp: ac.createGain(), revSend: ac.createGain(), reverb: ac.createConvolver(),
    hallSend: ac.createGain(), hall: ac.createConvolver(),   // long reverb that opens with heat
    master: ac.createGain(), comp: ac.createDynamicsCompressor(),
    // Modulation: a slow "underwater" LFO and a vibrato LFO, summed on a pitch bus
    wobble: ac.createOscillator(), wobblePitch: ac.createGain(), wobbleFilter: ac.createGain(),
    vib: ac.createOscillator(), vibDepth: ac.createGain(), pitchBus: ac.createGain(),
    // Engine: a low filtered saw that follows speed and thrust
    engine: ac.createOscillator(), engFilter: ac.createBiquadFilter(), engGain: ac.createGain(),
    // Falling wind: looped noise through a bandpass, silent until the long fall
    wind: ac.createBufferSource(), windFilter: ac.createBiquadFilter(), windGain: ac.createGain(),
    // THE FATHER: a low drone one and two octaves below, tuned flat (strongest at sea)
    drone1: ac.createOscillator(), drone2: ac.createOscillator(), droneG2: ac.createGain(), droneGain: ac.createGain(),
    // THE SUN: a shimmering high harmonic, two beating sines with a tremolo (strongest near the sun)
    sunV1: ac.createOscillator(), sunV2: ac.createOscillator(), sunGain: ac.createGain(),
    sunTrem: ac.createOscillator(), sunTremDepth: ac.createGain(),
    recDest: ac.createMediaStreamDestination(),
  };
  const n = node;

  n.osc1.type = "triangle";     // the clean, pure core
  n.osc2.type = "sawtooth";     // brightness, brought in by the sun
  n.sub.type  = "sine";
  n.shim.type = "sine";         // one octave up, for shimmer

  n.g1.gain.value = 0.5; n.g2.gain.value = 0; n.gSub.gain.value = 0.4; n.gShim.gain.value = 0;
  n.filter.type = "lowpass"; n.filter.frequency.value = 300; n.filter.Q.value = 0.8;
  n.shaper.curve = makeSaturationCurve(3); n.shaper.oversample = "2x";
  n.dry.gain.value = 1; n.wet.gain.value = 0;
  n.amp.gain.value = 0;
  n.reverb.buffer = makeImpulse(ac, 2.2, 3);
  n.hall.buffer = makeImpulse(ac, 5.5, 2);
  n.revSend.gain.value = 0.3; n.hallSend.gain.value = 0;
  n.master.gain.value = 0.6;
  // Safety limiter only: high threshold so the heat swell isn't squashed
  n.comp.threshold.value = -6; n.comp.knee.value = 6; n.comp.ratio.value = 3;
  n.comp.attack.value = 0.005; n.comp.release.value = 0.25;

  n.wobble.frequency.value = 0.3; n.wobblePitch.gain.value = 0; n.wobbleFilter.gain.value = 0;
  n.vib.frequency.value = 5.5; n.vibDepth.gain.value = 0;

  // Voice
  n.osc1.connect(n.g1).connect(n.mix);
  n.osc2.connect(n.g2).connect(n.mix);
  n.sub.connect(n.gSub).connect(n.mix);
  n.mix.connect(n.filter);
  n.filter.connect(n.dry).connect(n.amp);
  n.filter.connect(n.shaper).connect(n.wet).connect(n.amp);
  n.shim.connect(n.gShim).connect(n.amp);      // shimmer skips the filter

  // Output: dry + reverb → compressor → speakers and the recorder
  n.amp.connect(n.master);
  n.amp.connect(n.revSend).connect(n.reverb).connect(n.master);
  n.amp.connect(n.hallSend).connect(n.hall).connect(n.master);

  n.engine.type = "sawtooth"; n.engine.frequency.value = 50;
  n.engFilter.type = "lowpass"; n.engFilter.frequency.value = 400; n.engFilter.Q.value = 2;
  n.engGain.gain.value = 0;
  n.engine.connect(n.engFilter).connect(n.engGain).connect(n.master);

  const noise = ac.createBuffer(2, ac.sampleRate * 2, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = noise.getChannelData(ch);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  n.wind.buffer = noise; n.wind.loop = true;
  n.windFilter.type = "bandpass"; n.windFilter.frequency.value = 300; n.windFilter.Q.value = 0.7;
  n.windGain.gain.value = 0;
  n.wind.connect(n.windFilter).connect(n.windGain).connect(n.master);
  n.wind.start();
  n.noiseBuf = noise;                           // reused by the whispers

  // The father: into the main voice chain, so the filter, reverb and melt collapse apply to him too
  n.drone1.type = "sine"; n.drone2.type = "triangle";
  n.drone1.detune.value = n.drone2.detune.value = -DRONE_FLAT;
  n.droneG2.gain.value = 0.6; n.droneGain.gain.value = 0;
  n.drone1.connect(n.droneGain);
  n.drone2.connect(n.droneG2).connect(n.droneGain);
  n.droneGain.connect(n.mix);

  // The sun: skips the filter (like the shimmer), trembling
  n.sunV1.type = n.sunV2.type = "sine";
  n.sunGain.gain.value = 0;
  n.sunTrem.frequency.value = 6.5; n.sunTremDepth.gain.value = 0;
  n.sunV1.connect(n.sunGain); n.sunV2.connect(n.sunGain);
  n.sunTrem.connect(n.sunTremDepth).connect(n.sunGain.gain);
  n.sunGain.connect(n.amp);

  n.master.connect(n.comp);
  n.comp.connect(ac.destination);
  n.comp.connect(n.recDest);

  // Modulation routing (cents added to every oscillator's detune)
  n.wobble.connect(n.wobblePitch).connect(n.pitchBus);
  n.wobble.connect(n.wobbleFilter).connect(n.filter.frequency);
  n.vib.connect(n.vibDepth).connect(n.pitchBus);
  for (const o of [n.osc1, n.osc2, n.sub, n.shim, n.drone1, n.drone2, n.sunV1, n.sunV2]) n.pitchBus.connect(o.detune);

  for (const o of [n.osc1, n.osc2, n.sub, n.shim, n.wobble, n.vib, n.engine,
                   n.drone1, n.drone2, n.sunV1, n.sunV2, n.sunTrem]) o.start();
  setFreq(n, ac, ROOT_HZ, 0.01);
  return { ac, ...n };
}

// Smooth parameter change, no clicks
const glide = (param, value, tc = 0.08) => param.setTargetAtTime(value, audio.ac.currentTime, tc);

function setFreq(n, ac, hz, tc) {
  const t = ac.currentTime;
  n.osc1.frequency.setTargetAtTime(hz, t, tc);
  n.osc2.frequency.setTargetAtTime(hz, t, tc);
  n.sub.frequency.setTargetAtTime(hz / 2, t, tc);
  n.shim.frequency.setTargetAtTime(hz * 2, t, tc);
  n.drone1.frequency.setTargetAtTime(hz / 2, t, tc);
  n.drone2.frequency.setTargetAtTime(hz / 4, t, tc);
  n.sunV1.frequency.setTargetAtTime(hz * 3, t, tc);
  n.sunV2.frequency.setTargetAtTime(hz * 3 * SUN_BEAT, t, tc);
}

// Freeze a parameter at its current value, dropping any scheduled automation
function hold(param, t) {
  if (param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(t);
  else { const v = param.value; param.cancelScheduledValues(t); param.setValueAtTime(v, t); }
}
const voiceParams = a => [
  a.osc1.frequency, a.osc2.frequency, a.sub.frequency, a.shim.frequency,
  a.amp.gain, a.filter.frequency, a.filter.Q, a.g2.gain, a.gSub.gain, a.gShim.gain,
  a.wet.gain, a.dry.gain, a.revSend.gain, a.hallSend.gain, a.vibDepth.gain,
  a.wobblePitch.gain, a.wobbleFilter.gain,
  a.engine.frequency, a.engFilter.frequency, a.engGain.gain,
  a.windGain.gain, a.windFilter.frequency,
  a.drone1.frequency, a.drone2.frequency, a.droneGain.gain,
  a.sunV1.frequency, a.sunV2.frequency, a.sunGain.gain, a.sunTremDepth.gain,
];
// Before live control resumes (e.g. "Fly again"), clear any melt automation
function releaseVoice() {
  if (!audio) return;
  const t = audio.ac.currentTime;
  for (const p of voiceParams(audio)) hold(p, t);
}

// Map altitude + heat to the voice, every frame
function updateVoice(handsVisible) {
  const a = audio;
  let semis, cutoff, q, saw, sub, shim, rev, hall, wobP, wobF, spread, vib;

  if (altitude < SEA_LINE) {
    // SEA: one low muffled tone with a slow underwater wobble
    semis = 0; cutoff = 260; q = 1.2; saw = 0.25; sub = 0.5; shim = 0;
    rev = 0.4; hall = 0; wobP = 14; wobF = 140; spread = 4; vib = 0;
  } else {
    // SKY → SUN: pitch climbs with altitude. The sky stays pure (triangle + sine,
    // low lowpass, no saw); the sun opens the filter and brings in the saw.
    semis = softSnap(RANGE_SEMIS * (altitude - SEA_LINE) / (1 - SEA_LINE));
    const sky = clamp((altitude - SEA_LINE) / (SUN_LINE - SEA_LINE), 0, 1);
    const sun = clamp((altitude - SUN_LINE) / (1 - SUN_LINE), 0, 1);
    const inSun = altitude >= SUN_LINE;
    cutoff = inSun ? lerp(2200, 4500, sun) + heat * 6000 : lerp(700, 1500, sky);
    q = inSun ? 0.7 : 0.5;
    saw = inSun ? 0.1 + sun * 0.1 + heat * 0.3 : 0;
    sub = inSun ? 0.2 : 0.28;
    shim = inSun ? 0.03 + heat * 0.14 : 0;
    rev = 0.22 + heat * 0.3;               // short room, a little wetter with heat
    hall = Math.pow(heat, 1.5) * 0.9;      // long hall opens as heat rises
    wobP = 0; wobF = 0;
    spread = inSun ? 3 + heat * 24 : 0;    // detune widens with heat
    vib = heat * heat * 38;                // pitch wobble grows near the melt
  }
  // Loudness rises ~6 dB with heat: the moment before the melt is the loudest
  const level = BASE_GAIN * Math.pow(10, (HEAT_DB * heat) / 20);

  // The father: strongest at sea, fading as you climb; he pulls the main tone slightly flat
  const fatherAmt = lerp(1, 0.15, clamp((altitude - SEA_LINE) / (1 - SEA_LINE), 0, 1));
  const pull = FATHER_PULL * fatherAmt;
  // The sun: strongest high up and aimed at it
  const sunNear = clamp((altitude - 0.5) / 0.5, 0, 1) * (0.35 + 0.65 * sunAim);
  glide(a.droneGain.gain, 0.35 * fatherAmt, 0.2);
  glide(a.sunGain.gain, 0.07 * sunNear, 0.15);
  glide(a.sunTremDepth.gain, 0.035 * sunNear, 0.15);

  setFreq(a, a.ac, hzOf(semis), 0.06);
  glide(a.osc1.detune, spread - pull);
  glide(a.osc2.detune, -spread - pull);
  glide(a.shim.detune, spread * 0.5 - pull);
  glide(a.filter.frequency, cutoff, 0.12);
  glide(a.filter.Q, q, 0.2);
  glide(a.g2.gain, saw, 0.15);
  glide(a.gSub.gain, sub, 0.15);
  glide(a.gShim.gain, shim, 0.15);
  glide(a.revSend.gain, rev, 0.3);
  glide(a.hallSend.gain, hall, 0.3);
  glide(a.wobblePitch.gain, wobP, 0.4);
  glide(a.wobbleFilter.gain, wobF, 0.4);
  glide(a.vibDepth.gain, vib, 0.15);
  glide(a.vib.frequency, 5.5 + heat * 2, 0.3);
  glide(a.wet.gain, heat * 0.6, 0.15);     // soft saturation creeps in
  glide(a.dry.gain, 1 - heat * 0.3, 0.15);
  glide(a.amp.gain, handsVisible ? level : 0, handsVisible ? 0.08 : 0.25);

  // Engine: pitch and brightness rise with speed; louder when you push forward
  const push = Math.max(0, thrustEff);
  glide(a.engine.frequency, 38 + fwdSpeed * 4 + push * 30, 0.08);
  glide(a.engFilter.frequency, 250 + fwdSpeed * 60 + push * 900, 0.08);
  glide(a.engGain.gain, handsVisible ? 0.035 + push * 0.08 : 0, 0.1);
}

// MELT: pitch falls 2.5 octaves over MELT_TIME while the volume collapses to
// near silence; then the sea tone fades back in, quietly.
function meltVoice() {
  const a = audio, t = a.ac.currentTime, T = MELT_TIME;
  const hz = Math.max(40, a.osc1.frequency.value);
  const g0 = Math.max(0.02, a.amp.gain.value);
  for (const p of voiceParams(a)) hold(p, t);

  // Pitch sweep (exponential = even in octaves)
  const end = hz * Math.pow(2, -MELT_OCTAVES);
  a.osc1.frequency.exponentialRampToValueAtTime(end, t + T);
  a.osc2.frequency.exponentialRampToValueAtTime(end, t + T);
  a.sub.frequency.exponentialRampToValueAtTime(end / 2, t + T);
  a.shim.frequency.exponentialRampToValueAtTime(end * 2, t + T);
  a.drone1.frequency.exponentialRampToValueAtTime(end / 2, t + T);   // the father falls with you
  a.drone2.frequency.exponentialRampToValueAtTime(end / 4, t + T);
  a.sunV1.frequency.exponentialRampToValueAtTime(end * 3, t + T);
  a.sunV2.frequency.exponentialRampToValueAtTime(end * 3 * SUN_BEAT, t + T);
  a.sunGain.gain.linearRampToValueAtTime(0, t + T * 0.4);            // the sun lets go first
  a.sunTremDepth.gain.linearRampToValueAtTime(0, t + T * 0.4);

  // Volume collapse: -12 dB at 1s, ~-30 dB at 1.7s, near silence at 2s
  a.amp.gain.exponentialRampToValueAtTime(g0 * 0.25, t + T * 0.5);
  a.amp.gain.exponentialRampToValueAtTime(g0 * 0.03, t + T * 0.85);
  a.amp.gain.exponentialRampToValueAtTime(0.0006, t + T);

  // Timbre drains away with it
  a.filter.frequency.exponentialRampToValueAtTime(180, t + T);
  a.wet.gain.linearRampToValueAtTime(0, t + T * 0.5);
  a.dry.gain.linearRampToValueAtTime(1, t + T * 0.5);
  a.g2.gain.linearRampToValueAtTime(0, t + T * 0.7);
  a.gShim.gain.linearRampToValueAtTime(0, t + T * 0.3);
  a.vibDepth.gain.linearRampToValueAtTime(0, t + T * 0.3);
  // Engine dies with the melt: pitch sags, level collapses
  a.engine.frequency.exponentialRampToValueAtTime(25, t + T);
  a.engGain.gain.setTargetAtTime(0, t, T / 4);
  // (the hall send stays open so the fall rings out in the big space)

  // The long fall: nothing but wind, rising in level and pitch all the way down
  a.windGain.gain.setValueAtTime(0.0001, t + 0.6);
  a.windGain.gain.exponentialRampToValueAtTime(0.22, t + FALL_TIME - 0.2);
  a.windFilter.frequency.setValueAtTime(250, t + 0.6);
  a.windFilter.frequency.exponentialRampToValueAtTime(1600, t + FALL_TIME - 0.2);
}

// At the water: the wind cuts and the sea tone fades back in, quietly
function seaReturn() {
  const a = audio, ts = a.ac.currentTime;
  for (const p of voiceParams(a)) hold(p, ts);
  a.windGain.gain.setTargetAtTime(0, ts, 0.04);
  const hallNow = a.hallSend.gain.value;
  a.osc1.frequency.setValueAtTime(ROOT_HZ, ts);
  a.osc2.frequency.setValueAtTime(ROOT_HZ, ts);
  a.sub.frequency.setValueAtTime(ROOT_HZ / 2, ts);
  a.shim.frequency.setValueAtTime(ROOT_HZ * 2, ts);
  a.drone1.frequency.setValueAtTime(ROOT_HZ / 2, ts);
  a.drone2.frequency.setValueAtTime(ROOT_HZ / 4, ts);
  a.sunV1.frequency.setValueAtTime(ROOT_HZ * 3, ts);
  a.sunV2.frequency.setValueAtTime(ROOT_HZ * 3 * SUN_BEAT, ts);
  a.droneGain.gain.setValueAtTime(0.35, ts);        // at sea, the father is strongest
  a.sunGain.gain.setValueAtTime(0, ts);
  a.osc1.detune.setValueAtTime(4 - FATHER_PULL, ts);
  a.osc2.detune.setValueAtTime(-4 - FATHER_PULL, ts);
  a.shim.detune.setValueAtTime(2 - FATHER_PULL, ts);
  a.filter.frequency.setValueAtTime(260, ts);
  a.filter.Q.setValueAtTime(1.2, ts);
  a.g2.gain.setValueAtTime(0.25, ts);
  a.gSub.gain.setValueAtTime(0.5, ts);
  a.wobblePitch.gain.setValueAtTime(14, ts);
  a.wobbleFilter.gain.setValueAtTime(140, ts);
  a.revSend.gain.setValueAtTime(0.4, ts);
  a.hallSend.gain.setValueAtTime(hallNow, ts);    // big space stays open through the fall
  a.hallSend.gain.linearRampToValueAtTime(0, ts + 1.5);
  a.amp.gain.setValueAtTime(0.0006, ts);
  a.amp.gain.exponentialRampToValueAtTime(SEA_AFTER_GAIN, ts + 2.0);
}

function silence() { glide(audio.amp.gain, 0, 0.15); }

// A whispered syllable for each line of text: a hiss, then a gliding vowel formant,
// filtered noise shaped by short envelopes, with a little reverb.
const VOWELS = [[700, 1200], [400, 2200], [300, 900], [600, 1700], [500, 1000]];
function whisper() {
  if (!audio) return;
  const a = audio, ac = a.ac, t = ac.currentTime;
  const src = ac.createBufferSource();
  src.buffer = a.noiseBuf; src.playbackRate.value = 0.8 + Math.random() * 0.4;
  const hiss = ac.createBiquadFilter(); hiss.type = "highpass"; hiss.frequency.value = 3500;
  const vowel = ac.createBiquadFilter(); vowel.type = "bandpass"; vowel.Q.value = 5;
  const F = VOWELS[(Math.random() * VOWELS.length) | 0];
  vowel.frequency.setValueAtTime(F[0] * 1.4, t + 0.03);
  vowel.frequency.exponentialRampToValueAtTime(F[1], t + 0.28);
  const gH = ac.createGain(), gV = ac.createGain();
  gH.gain.setValueAtTime(0, t);
  gH.gain.linearRampToValueAtTime(0.07, t + 0.015);
  gH.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  gV.gain.setValueAtTime(0.0001, t + 0.03);
  gV.gain.exponentialRampToValueAtTime(0.22, t + 0.08);
  gV.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  src.connect(hiss).connect(gH);
  src.connect(vowel).connect(gV);
  for (const g of [gH, gV]) { g.connect(a.master); g.connect(a.reverb); }
  src.start(t, Math.random() * 1.5);
  src.stop(t + 0.4);
}

// ============================================================
// Recording: canvas video + the audio output in one webm
// ============================================================
function pickMime() {
  const types = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
  return types.find(t => window.MediaRecorder?.isTypeSupported?.(t)) ?? "";
}

function startRecording() {
  if (!window.MediaRecorder || !recStream) return;
  chunks = []; lastBlob = null;
  const mimeType = pickMime();
  try {
    recorder = new MediaRecorder(recStream, mimeType ? { mimeType, videoBitsPerSecond: 2_500_000 } : {});
  } catch (e) { console.warn("MediaRecorder failed", e); recorder = null; return; }
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.start(1000);
}

function stopRecording() {
  return new Promise(resolve => {
    if (!recorder || recorder.state === "inactive") return resolve(null);
    recorder.onstop = () => resolve(chunks.length ? new Blob(chunks, { type: recorder.mimeType || "video/webm" }) : null);
    recorder.stop();
  });
}

async function saveFlight() {
  if (!lastBlob) return;
  const secs = $("flew").textContent.replace(/[^\d.]/g, "");
  const file = new File([lastBlob], `icarus-${secs}s.webm`, { type: lastBlob.type });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "Icarus" }); return; }
    catch (e) { if (e.name === "AbortError") return; console.warn("Share failed, downloading", e); }
  }
  const url = URL.createObjectURL(file);
  const link = Object.assign(document.createElement("a"), { href: url, download: file.name });
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10_000);
}

// ============================================================
// Flight lifecycle
// ============================================================
function startFlight(now) {
  flight = { start: now };
  flightOrigin = { x: view.x, z: travel, hx: view.hx, hz: view.hz };
  ghostPath = []; lastGhostRec = 0;
  startRecording();
}

function startMelt(now) {
  mode = "melt";
  meltStart = now;
  flight.flown = now - flight.start;
  meltSunR = sunRadius();
  meltAlt0 = altitude; meltPitch0 = view.pitch; meltH0 = view.h;
  meltX0 = view.x; meltZ0 = travel; meltYaw0 = view.yaw; meltHx = view.hx; meltHz = view.hz;
  lie = null; lieTextUntil = 0;       // all text goes silent
  tilt = null; stutterLeft = 0; fallWhispered = false;
  meltVoice();
  // (the hands now rise and cover the camera: see handPose)
}

// fromMelt: the wind cuts and the quiet sea tone plays under the results
async function endFlight(flownMs, fromMelt = false) {
  mode = "results";
  if (fromMelt) seaReturn(); else silence();
  saveGhost(ghostPath);
  ghostPath = [];
  flight = null; flightOrigin = null;
  heat = 0;
  $("flew").textContent = (flownMs / 1000).toFixed(1) + "s";
  $("save").disabled = true;
  $("save").classList.toggle("hidden", !window.MediaRecorder);
  $("results").classList.remove("hidden");
  lastBlob = await stopRecording();
  $("save").disabled = !lastBlob;
}

// ============================================================
// Gyroscope input (DeviceOrientation)
// ============================================================
// beta = front/back tilt, gamma = left/right roll (portrait). "Level" is captured from
// the first reading after you tap Reach up (or Fly again).
function onOrientation(e) {
  if (e.beta == null || e.gamma == null) return;
  gyro.beta = e.beta; gyro.gamma = e.gamma; gyro.seen = true;
  if (gyro.calibrate) { gyro.beta0 = e.beta; gyro.gamma0 = e.gamma; gyro.calibrate = false; }
}
function recalibrate() { gyro.calibrate = true; }

// iOS needs explicit permission, and only from inside a tap
async function requestMotion() {
  try {
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === "function") {
      const r = await DOE.requestPermission();
      if (r !== "granted") console.warn("Motion permission:", r);
    }
  } catch (e) { console.warn("Motion permission failed", e); }
  window.addEventListener("deviceorientation", onOrientation);
}

// Tilt in degrees → −1..1, with a small dead zone
function shape(deg, range) {
  const a = Math.max(0, Math.abs(deg) - TILT_DEAD) / (range - TILT_DEAD);
  return Math.sign(deg) * clamp(a, 0, 1);
}

// Per frame: phone tilt (or keys on a desktop) → pitch and roll inputs → targets
function readControls() {
  let p = 0, r = 0;
  if (gyro.seen && !gyro.calibrate) {
    p = PITCH_SIGN * shape(gyro.beta - gyro.beta0, PITCH_RANGE);
    let dg = gyro.gamma - gyro.gamma0;
    if (dg > 90) dg -= 180; else if (dg < -90) dg += 180;     // gamma wraps near upright
    r = shape(dg, ROLL_RANGE);
  }
  if (keys.has("ArrowUp") || keys.has("w")) p = 1;
  if (keys.has("ArrowDown") || keys.has("s")) p = -1;
  if (keys.has("ArrowLeft") || keys.has("a")) r = -1;
  if (keys.has("ArrowRight") || keys.has("d")) r = 1;
  pitchIn = p; rollIn = r;
  yawTarget = rollIn * YAW_RATE;                 // roll right → turn right
  bankTarget = -rollIn * BANK_MAX;               // (bank > 0 = banked left)
  thrustEff = Math.max(0, -pitchIn);             // diving is thrust
}
addEventListener("keydown", e => keys.add(e.key.length === 1 ? e.key.toLowerCase() : e.key));
addEventListener("keyup", e => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));

// Altitude physics: climb rate follows the tilt (with a little lag); gravity sinks you slowly
function updateAltitude(dt) {
  const target = pitchIn * CLIMB_RATE - SINK_RATE;
  altVel += (target - altVel) * (1 - Math.exp(-dt / ALT_TAU));
  altitude += altVel * dt;
  if (altitude <= 0) { altitude = 0; altVel = Math.max(0, altVel); }
  if (altitude >= 1) { altitude = 1; altVel = Math.min(0, altVel); }
}

// ============================================================
// Game logic (per frame)
// ============================================================
function step(now, dt) {
  if (mode === "live") { readControls(); updateAltitude(dt); }
  else if (mode === "results") { readControls(); thrustEff = 0; }

  // Always flying forward along the heading: base speed, faster with altitude and when diving.
  // The melt keeps your momentum.
  if (mode !== "melt") {
    const target = (SPEED_BASE + SPEED_ALT * altitude) * (1 + DIVE_GAIN * thrustEff);
    fwdSpeed += (target - fwdSpeed) * (1 - Math.exp(-dt / CAM_TAU));
    // Banking drifts the world sideways (camera slides along -right = (-hz, +hx))
    view.x -= bank * DRIFT * dt * view.hz;
    travel += bank * DRIFT * dt * view.hx;
    view.x += view.hx * fwdSpeed * dt;
    travel += view.hz * fwdSpeed * dt;
  }
  updateGlitch(now, dt);
  updateView(now, dt);                    // (during the long fall it places the camera itself)
  sunAim = sunAimNow();
  updateFigures(dt);
  updateVisor(dt);

  updateRain(dt);
  updateFrags(dt);

  if (mode === "live") {
    spawnWax(dt);
    spawnFeathers(dt);
    spawnFigures(dt);
    recordGhost(now);
    updateLie(now, dt);

    // Heat builds only when you're up in the sun zone AND aiming at it
    // (faster the closer to dead centre); otherwise it cools
    if (altitude >= SUN_LINE && sunAim > 0) heat = clamp(heat + sunAim * dt / HEAT_TIME, 0, 1);
    else heat = clamp(heat - dt / COOL_TIME, 0, 1);

    if (!flight && altitude > SEA_LINE) { startFlight(now); seaSince = 0; }

    if (flight && heat >= 1) { startMelt(now); return; }
    // Sank back into the sea and stayed there: the flight is over
    if (flight) {
      if (altitude <= 0.001) {
        if (!seaSince) seaSince = now;
        else if (now - seaSince > SEA_END * 1000) { endFlight(seaSince - flight.start); return; }
      } else seaSince = 0;
    }

    updateVoice(true);
  } else if (mode === "melt") {
    if (now - meltStart > FALL_TIME * 1000) {
      altitude = 0;                   // in the water: cut to the results
      endFlight(flight.flown, true);
    }
  }
}

// ============================================================
// Rendering: black, dots only, sun, horizon
// ============================================================
// ---------- Sun: ahead and above; you approach it (it grows) as you climb ----------
function sunRadius() {
  return lerp(SUN_MIN_R, SUN_MAX_R, clamp(altitude * 0.75 + heat * 0.25, 0, 1));
}

function sunState(now) {
  let r = sunRadius(), flare = heat;
  if (mode === "melt") {
    // Shrinks away; the dive pitches it up and out of the frame
    const u = clamp((now - meltStart) / 1000 / MELT_TIME, 0, 1);
    r = meltSunR * Math.pow(1 - u, 1.6); flare = 1 - u * 0.6;
  }
  const c = sunCam();
  if (c[2] <= 0.05) return { x: 0, y: 0, r: 0, flare, face: 0 };     // behind you
  const [x, y] = toScreen(c);
  // Its face only resolves when you're very close
  const face = mode === "melt" ? 0 : clamp((r / SUN_MAX_R - FACE_FROM) / (1 - FACE_FROM), 0, 1);
  return { x, y, r, flare, face };
}

// The sun is a fixed direction in the world (world +z, SUN_ELEV up): turn away and it slides off
function sunCam() { return dirCam(0, Math.sin(SUN_ELEV), Math.cos(SUN_ELEV)); }

// 1 with the sun dead centre, falling to 0 at AIM_CONE off-centre
function sunAimNow() {
  const c = sunCam();
  if (c[2] <= 0) return 0;
  const off = Math.atan2(Math.hypot(c[0], c[1]), c[2]);
  return clamp(1 - off / AIM_CONE, 0, 1);
}

// ---------- Batched wire drawing ----------
// Every environment line goes into one of WIRE_LEVELS brightness buckets
// (far = dim + 1px, near = bright + 2px) and each bucket is stroked once.
const wrap = (v, m) => ((v % m) + m) % m;
const depthB = (z, far) => Math.pow(clamp(1 - z / far, 0, 1), 1.2);   // depth fade
let wirePaths = [], dotPaths = [];
function beginWire() {
  wirePaths = Array.from({ length: WIRE_LEVELS }, () => new Path2D());
  dotPaths = Array.from({ length: WIRE_LEVELS }, () => new Path2D());
}
// A red dot (for the falling figures), batched by brightness like the lines
function wireDot(x, y, s, b) {
  if (b <= 0.02) return;
  dotPaths[wireLevel(b)].rect(x - s / 2, y - s / 2, s, s);
}
function wireLevel(b) { return Math.round(clamp(b, 0, 1) * (WIRE_LEVELS - 1)); }
function wire(x1, y1, x2, y2, b) {
  if (b <= 0.02) return;
  const p = wirePaths[wireLevel(b)];
  p.moveTo(x1, y1); p.lineTo(x2, y2);
}
function wirePoly(pts, b, closed = false) {
  if (b <= 0.02 || pts.length < 2) return;
  const p = wirePaths[wireLevel(b)];
  p.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]);
  if (closed) p.lineTo(pts[0][0], pts[0][1]);
}
function flushWire() {
  const flick = 0.9 + Math.random() * 0.1;        // slight frame-to-frame flicker
  ctx.strokeStyle = RED;
  for (let i = 0; i < WIRE_LEVELS; i++) {
    const t = i / (WIRE_LEVELS - 1);
    ctx.globalAlpha = (0.12 + 0.88 * t) * flick;
    ctx.lineWidth = 1 + t;                        // 1px far → 2px near
    ctx.stroke(wirePaths[i]);
  }
  ctx.fillStyle = RED;
  for (let i = 0; i < WIRE_LEVELS; i++) {
    ctx.globalAlpha = (0.12 + 0.88 * (i / (WIRE_LEVELS - 1))) * flick;
    ctx.fill(dotPaths[i]);
  }
  ctx.globalAlpha = 1;
}

// Scanlines over the world (not the body): every third row darkened, flickering
let scanPattern = null;
function drawScanlines() {
  if (!scanPattern) {
    const c = document.createElement("canvas");
    c.width = 1; c.height = 3;
    const g = c.getContext("2d");
    g.fillStyle = "#000"; g.fillRect(0, 2, 1, 1);
    scanPattern = ctx.createPattern(c, "repeat");
  }
  ctx.globalAlpha = 0.35 + Math.random() * 0.15;
  ctx.fillStyle = scanPattern;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
}

// ---------- Sun: wireframe sphere, lines warp and jitter with heat ----------
function drawSun(now, s) {
  if (s.r < 2) return;
  const f = s.flare, R = s.r, tilt = 0.4, ct = Math.cos(tilt), st = Math.sin(tilt);
  const spin = now / 5000, tw = now / 110;
  const base = 0.55 + 0.45 * f;
  const P = (lat, lon) => {
    const cl = Math.cos(lat), x = cl * Math.sin(lon), y = Math.sin(lat), z = cl * Math.cos(lon);
    const y2 = y * ct - z * st, z2 = y * st + z * ct;          // axis tilted toward the camera
    const w = 1 + f * (0.08 * Math.sin(lat * 6 + lon * 4 + tw) + 0.04 * Math.sin(lon * 9 - tw * 1.7))
                + f * f * (Math.random() - 0.5) * 0.05;          // warp + jitter
    return [s.x + x * R * w, s.y - y2 * R * w, z2];
  };
  const seg = (a, b) => wire(a[0], a[1], b[0], b[1], a[2] + b[2] > 0 ? base : base * 0.22);  // back half dim
  for (let la = -60; la <= 60; la += 20) {                       // latitudes
    const lat = la * Math.PI / 180;
    let prev = P(lat, spin);
    for (let i = 1; i <= 32; i++) { const q = P(lat, spin + (i / 32) * Math.PI * 2); seg(prev, q); prev = q; }
  }
  for (let k = 0; k < 12; k++) {                                 // longitudes
    const lon = spin + (k / 12) * Math.PI * 2;
    let prev = P(-Math.PI / 2, lon);
    for (let i = 1; i <= 16; i++) { const q = P(-Math.PI / 2 + (i / 16) * Math.PI, lon); seg(prev, q); prev = q; }
  }
  const limb = [];                                               // outline
  for (let i = 0; i <= 40; i++) {
    const a = (i / 40) * Math.PI * 2;
    const w = 1 + f * 0.05 * Math.sin(a * 7 + tw) + f * f * (Math.random() - 0.5) * 0.03;
    limb.push([s.x + Math.cos(a) * R * w, s.y + Math.sin(a) * R * w]);
  }
  wirePoly(limb, Math.min(1, base + 0.15));
  if (s.face > 0.02) drawSunFace(s, now);
}

// The face: eyes, nose, mouth. Far off it's scattered fragments; very close, they pull together.
function drawSunFace(s, now) {
  const R = s.r, a = s.face, scatter = (1 - a) * R * 0.45, tw = now / 110;
  const J = () => (Math.random() - 0.5) * (scatter + s.flare * s.flare * R * 0.02);
  const P = (u, v) => [s.x + u * R + J(), s.y + v * R + J()];
  const b = 0.25 + 0.75 * a;
  for (const ex of [-0.32, 0.32]) {                                // eyes: narrow closed curves
    const eye = [];
    for (let i = 0; i <= 10; i++) {
      const t = (i / 10) * Math.PI * 2;
      eye.push(P(ex + Math.cos(t) * 0.13, -0.18 + Math.sin(t) * (0.05 + 0.02 * Math.sin(tw * 0.3))));
    }
    wirePoly(eye, b);
  }
  wirePoly([P(0, -0.1), P(0.05, 0.12), P(-0.03, 0.15)], b * 0.8);  // nose
  const mouth = [];                                                // mouth: a slight downturn
  for (let i = 0; i <= 10; i++) { const u = -0.3 + (i / 10) * 0.6; mouth.push(P(u, 0.42 - 0.06 * (1 - (u / 0.3) ** 2))); }   // corners lower
  wirePoly(mouth, b);
}

// ---------- The sun lies: at high heat it briefly duplicates or drifts ----------
function updateLie(now, dt) {
  if (lie && now > lie.end) lie = null;
  if (!lie && heat > LIE_HEAT && Math.random() < dt / LIE_EVERY) {
    const dur = 700 + Math.random() * 600;
    lie = { start: now, end: now + dur, kind: Math.random() < 0.5 ? "double" : "drift",
            dx: (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.5), dy: (Math.random() - 0.5) * 0.6 };
    lieTextUntil = now + dur + 900;
    whisper();                                        // each line of text gets a whispered syllable
  }
}

// ---------- The renderer fails at high heat ----------
function glitchAmt() { return mode === "live" ? clamp((heat - GLITCH_FROM) / (1 - GLITCH_FROM), 0, 1) : 0; }

function updateGlitch(now, dt) {
  const g = glitchAmt();
  if (tilt && now > tilt.end) tilt = null;
  if (!tilt && g > 0 && Math.random() < g * 0.25 * dt) {
    tilt = { start: now, end: now + 600 + Math.random() * 600, amt: (Math.random() < 0.5 ? -1 : 1) * (0.1 + 0.25 * g) };
  }
  if (mode !== "live") tilt = null;
}
function tiltNow(now) {
  if (!tilt) return 0;
  return tilt.amt * Math.sin(clamp((now - tilt.start) / (tilt.end - tilt.start), 0, 1) * Math.PI);
}
// Tear: shift a few horizontal bands of the frame sideways
function tearFrame() {
  const g = glitchAmt();
  if (g <= 0 || Math.random() > g * 0.25) return;
  const n = 1 + ((Math.random() * 3 * g) | 0);
  for (let i = 0; i < n; i++) {
    const y = Math.random() * H, h = 4 + Math.random() * 50 * g, dx = (Math.random() - 0.5) * 160 * g;
    ctx.drawImage(canvas, 0, y, W, h, dx, y, W, h);
  }
}
// Text flickers into Greek letters
function glitchText(s) {
  const g = glitchAmt();
  if (g <= 0) return s;
  return [...s].map(c => (c !== " " && Math.random() < g * 0.3 ? GREEK[(Math.random() * GREEK.length) | 0] : c)).join("");
}

// ---------- Wax on the visor: drops land, stick, slip down; the view behind them blurs red ----------
function updateVisor(dt) {
  if (mode === "live" && heat > VISOR_FROM && visorDrops.length < VISOR_CAP &&
      Math.random() < heat * heat * VISOR_RATE * dt) {
    visorDrops.push({
      x: Math.random() * W, y: Math.random() * H * 0.85,
      r: (8 + Math.random() * 18) * (0.6 + heat * 0.6), vy: 0, stick: 0.3 + Math.random() * 1.5, trail: [],
    });
  }
  for (const d of visorDrops) {
    if (mode === "melt") d.vy += 2500 * dt;           // the fall clears them
    else {
      d.stick -= dt;
      if (d.stick <= 0) { d.vy = 20 + Math.random() * 70 * (d.r / 20); d.stick = 0.3 + Math.random() * 1.2; }   // slip
      else d.vy *= 1 - 3 * dt;                                                                                 // stick
    }
    d.y += d.vy * dt;
    const last = d.trail[d.trail.length - 1];
    if (d.vy > 5 && (!last || d.y - last[1] > d.r * 0.6)) { d.trail.push([d.x, d.y - d.r * 0.4]); if (d.trail.length > 6) d.trail.shift(); }
  }
  visorDrops = visorDrops.filter(d => d.y - d.r < H + 40);
}

function drawVisor() {
  if (!visorDrops.length) return;
  // Blur = a scaled-down copy of the frame, drawn back up inside the drops (cheap on phones)
  const f = Math.round(lerp(6, 14, heat)), bw = Math.ceil(W / f), bh = Math.ceil(H / f);
  if (!blurCanvas) { blurCanvas = document.createElement("canvas"); blurCtx = blurCanvas.getContext("2d"); }
  if (blurCanvas.width !== bw || blurCanvas.height !== bh) { blurCanvas.width = bw; blurCanvas.height = bh; }
  blurCtx.imageSmoothingEnabled = true; blurCtx.imageSmoothingQuality = "high";
  blurCtx.drawImage(canvas, 0, 0, bw, bh);

  const clip = new Path2D();
  for (const d of visorDrops) {
    clip.moveTo(d.x + d.r, d.y); clip.ellipse(d.x, d.y, d.r, d.r * 1.15, 0, 0, Math.PI * 2);
    d.trail.forEach(([tx, ty], i) => {
      const tr = d.r * 0.25 * (i + 1) / d.trail.length;
      clip.moveTo(tx + tr, ty); clip.ellipse(tx, ty, tr, tr * 1.3, 0, 0, Math.PI * 2);
    });
  }
  ctx.save();
  ctx.clip(clip);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(blurCanvas, 0, 0, bw, bh, -6, 10, W + 12, H + 12);   // slight lens shift / magnify
  ctx.fillStyle = `rgba(255, 70, 20, ${0.18 + 0.25 * heat})`;          // red-orange tint
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  // A thin bright rim on the upper edge of each drop
  ctx.strokeStyle = "rgba(255, 150, 90, 0.45)"; ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (const d of visorDrops) {
    const a0 = Math.PI * 1.15;
    ctx.moveTo(d.x + Math.cos(a0) * d.r, d.y + Math.sin(a0) * d.r * 1.15);
    ctx.ellipse(d.x, d.y, d.r, d.r * 1.15, 0, a0, Math.PI * 1.85);
  }
  ctx.stroke();
}

// ---------- Greek rain: falling columns behind the world ----------
// Sparse and slow at sea; denser and faster with altitude and heat; near the sun the
// letters glitch into Latin and symbols. Each column has a depth: size + brightness.
const RAIN_SIZES = [11, 15, 21];
function rainDensity() { return mode === "melt" ? 0.6 : clamp(altitude * 0.6 + heat * 0.6, 0, 1); }
function sunGlitch() { return clamp((altitude - 0.6) / 0.4, 0, 1) * (0.3 + 0.7 * sunAim) * 0.6; }
function rainChar() {
  return Math.random() < sunGlitch() ? LATIN[(Math.random() * LATIN.length) | 0] : GREEK[(Math.random() * GREEK.length) | 0];
}
function newColumn(anywhere) {
  const d = (Math.random() * 3) | 0, size = RAIN_SIZES[d];
  const len = 6 + ((Math.random() * 12) | 0);
  return {
    x: Math.round((Math.random() * W) / 18) * 18 + 9, y: anywhere ? Math.random() * H : -Math.random() * 300,
    d, size, alpha: [0.06, 0.11, 0.18][d], v: [45, 75, 115][d] * (0.8 + Math.random() * 0.4),
    chars: Array.from({ length: len }, rainChar), t: 0, swap: 0.1 + Math.random() * 0.3,
  };
}
function updateRain(dt) {
  const dens = rainDensity(), want = Math.round(lerp(RAIN_MIN, RAIN_MAX, dens)), speed = 1 + dens * 3;
  if (!rain.length) for (let i = 0; i < want; i++) rain.push(newColumn(true));
  while (rain.length < want) rain.push(newColumn(false));
  for (const c of rain) {
    c.y += c.v * speed * dt;
    c.t += dt;
    if (c.t > c.swap) {                                   // characters keep changing
      c.t = 0; c.swap = (0.05 + Math.random() * 0.3) / (1 + dens * 2);
      c.chars[(Math.random() * c.chars.length) | 0] = rainChar();
    }
  }
  // Columns that leave the bottom start again at the top, or retire if there are too many
  rain = rain.filter(c => {
    if (c.y - c.chars.length * c.size < H) return true;
    if (rain.length > want) return false;
    Object.assign(c, newColumn(false));
    return true;
  });
}
function drawRain() {
  ctx.save();
  ctx.fillStyle = RED;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const g = sunGlitch();
  for (let d = 0; d < RAIN_SIZES.length; d++) {          // one font per depth layer
    ctx.font = `${RAIN_SIZES[d]}px system-ui, sans-serif`;
    for (const c of rain) {
      if (c.d !== d) continue;
      for (let i = 0; i < c.chars.length; i++) {
        const y = c.y - i * c.size;
        if (y < -c.size || y > H + c.size) continue;
        ctx.globalAlpha = c.alpha * (i === 0 ? 2.2 : 1 - i / c.chars.length);   // bright head, fading tail
        const ch = g > 0 && Math.random() < g * 0.15 ? LATIN[(Math.random() * LATIN.length) | 0] : c.chars[i];
        ctx.fillText(ch, c.x, y);
      }
    }
  }
  ctx.restore();
}

// ---------- The body: two wireframe hands at the lower corners ----------
// Built in hand-local space (right hand; y along the fingers, x across with the thumb at −x,
// z forward), then posed and projected. Every line is either FLESH (red outline) or BONE
// (white-red centre line). Flesh burns off from the fingertips as heat rises.
const FINGERS = [   // knuckle position, splay, segment lengths, half-width
  { x: -0.17,  y: 0.56, splay: -0.10, len: [0.25, 0.15, 0.11],  w: 0.045 },   // index
  { x: -0.055, y: 0.58, splay: -0.02, len: [0.28, 0.17, 0.12],  w: 0.047 },   // middle
  { x: 0.06,   y: 0.56, splay: 0.06,  len: [0.26, 0.16, 0.115], w: 0.044 },   // ring
  { x: 0.165,  y: 0.51, splay: 0.15,  len: [0.20, 0.125, 0.10], w: 0.038 },   // pinky
];
const THUMB = { x: -0.19, y: 0.14, splay: -0.75, len: [0.20, 0.15, 0.12], w: 0.05 };
const smooth01 = v => v * v * (3 - 2 * v);

// Where each hand is and how it's held this frame. side: −1 left, +1 right.
function handPose(now, side) {
  const t = now / 1000;
  const sp = clamp((fwdSpeed - SPEED_BASE) / (SPEED_ALT + SPEED_BASE), 0, 1);
  let cover = 0, drop = 0;
  if (mode === "melt") {                                // CRASH: up over the camera, then away
    const ft = (now - meltStart) / 1000;
    drop = clamp((ft - COVER_OUT_AT) / COVER_OUT, 0, 1);
    cover = smooth01(clamp(ft / COVER_IN, 0, 1));
  }
  const trem = heat * heat * 0.008 + (mode === "melt" ? 0.004 : 0);
  const base = [side * HAND_BASE[0], HAND_BASE[1], HAND_BASE[2]];
  base[1] += 0.012 * Math.sin(t * 1.3 + side * 0.4);                         // breathing
  base[0] += Math.sin(t * 0.8 + side * 2) * 0.01 * (1 + 2 * sp) + side * 0.03 * sp;   // drift with speed
  base[1] += Math.sin(t * 1.1 + side) * 0.008 * (1 + 2 * sp) - 0.04 * sp + (Math.random() - 0.5) * 0.004 * sp;
  base[1] += -side * bank * 0.22;                     // bank left (bank > 0) raises the left hand
  base[0] += (Math.random() - 0.5) * trem; base[1] += (Math.random() - 0.5) * trem;   // trembling with heat
  const cb = [side * 0.16, -0.02, 0.45];
  const b = base.map((v, i) => lerp(v, cb[i], cover));
  b[1] -= drop * drop * 1.4;                          // ...they drop away just before the water
  return {
    base: b,
    pitch: lerp(HAND_PITCH + 0.03 * Math.sin(t * 1.3), 0.05, cover),
    roll: lerp(side * HAND_INWARD, side * 0.1, cover) - bank * 0.35 * (1 - cover),
    splay: lerp(1, 3.2, cover),                       // fingers spread to see through
    curl: (j, fi) => lerp((0.22 + 0.08 * Math.sin(t * 0.9 + fi * 0.7 + side)) * [0.8, 1, 0.7][j], 0, cover),
  };
}

// All segments of one hand in camera space: { a, b, burn, bone, id }, plus fingertip points
function buildHand(side, P) {
  const segs = [], tips = [];
  let id = 0;
  const S = HAND_SCALE, cp = Math.cos(P.pitch), spn = Math.sin(P.pitch), cr = Math.cos(P.roll), sr = Math.sin(P.roll);
  const X = (x, y, z) => {
    x *= side * S; y *= S; z *= S;
    const y1 = y * cp - z * spn, z1 = y * spn + z * cp;           // fingers tipped forward
    return [x * cr - y1 * sr + P.base[0], x * sr + y1 * cr + P.base[1], z1 + P.base[2]];
  };
  const add = (a, b, u, bone) => segs.push({ a: X(...a), b: X(...b), burn: lerp(BURN_TIP, BURN_WRIST, u), bone, id: side * 1000 + id++ });
  const F = (a, b, u) => add(a, b, u, false), B = (a, b, u) => add(a, b, u, true);
  const palmZ = x => 0.06 * (x / 0.2) ** 2;                        // slight cup across the palm
  const L3 = (p, q, t) => [lerp(p[0], q[0], t), lerp(p[1], q[1], t), lerp(p[2], q[2], t)];

  const chain = (fg, fi, isThumb) => {
    const splay = fg.splay * P.splay;
    const dx = Math.sin(splay), dy = Math.cos(splay);             // along the finger
    const sx = Math.cos(splay), sy = -Math.sin(splay);            // across it
    const off = (p, w, z = 0) => [p[0] + sx * w, p[1] + sy * w, p[2] + z];
    let p = [fg.x, fg.y, palmZ(fg.x)], ang = isThumb ? 0.35 : 0;
    const u0 = isThumb ? 0.05 : 0;
    for (let j = 0; j < 3; j++) {
      ang += P.curl(j, fi);                                        // curl toward the palm (+z)
      const Ln = fg.len[j];
      const q = [p[0] + dx * Math.cos(ang) * Ln, p[1] + dy * Math.cos(ang) * Ln, p[2] + Math.sin(ang) * Ln];
      const w0 = fg.w * (1 - 0.12 * j), w1 = fg.w * (1 - 0.12 * (j + 1));
      const u = u0 + (2 - j) * 0.13;                               // fingertips burn first
      F(off(p, -w0), off(q, -w1), u);                              // flesh: both sides
      F(off(p, w0), off(q, w1), u);
      F(off(p, -w0 * 0.7, -0.01), off(p, w0 * 0.7, -0.01), u + 0.03);   // joint crease

        F(off(q, -w1), tc, u); F(tc, off(q, w1), u);              // fingertip

        F(off(n0, -w1 * 0.55, -0.012), off(q, -w1 * 0.55, -0.012), u);

// Burnt flesh breaks into two glowing pieces that tumble away (screen space)
function spawnFrag(a, b) {
  for (let k = 0; k < 2 && frags.length < FRAG_CAP; k++) {
    const x1 = lerp(a[0], b[0], k / 2), y1 = lerp(a[1], b[1], k / 2), x2 = lerp(a[0], b[0], (k + 1) / 2), y2 = lerp(a[1], b[1], (k + 1) / 2);
    frags.push({ cx: (x1 + x2) / 2, cy: (y1 + y2) / 2, hx: (x2 - x1) / 2, hy: (y2 - y1) / 2,
                 vx: (Math.random() - 0.5) * 70, vy: -20 - Math.random() * 50, spin: (Math.random() - 0.5) * 8,
                 life: 0, max: 0.8 + Math.random() * 0.8 });
  }
}
function updateFrags(dt) {
  frags = frags.filter(f => {
    f.life += dt;
    f.vy += 260 * dt; f.cx += f.vx * dt; f.cy += f.vy * dt;
    const c = Math.cos(f.spin * dt), s = Math.sin(f.spin * dt), hx = f.hx;
    f.hx = hx * c - f.hy * s; f.hy = hx * s + f.hy * c;
    return f.life < f.max;

}

// Project, burn and draw both hands, then the falling fragments
function drawBody(now) {
  const fleshP = Array.from({ length: WIRE_LEVELS }, () => new Path2D());
  const boneP = Array.from({ length: WIRE_LEVELS }, () => new Path2D());
  const charP = new Path2D();
  const proj = c => { const z = Math.max(0.2, c[2]); return [W / 2 + c[0] * FOCAL / z, H / 2 - c[1] * FOCAL / z, z]; };
  const depth = z => clamp(1.15 - (z - 0.7) * 0.9, 0.3, 1);      // depth fade, like the world
  const lvl = b => Math.round(clamp(b, 0, 1) * (WIRE_LEVELS - 1));
  handTips = []; handPtsScreen = [];
  for (const side of [-1, 1]) {
    const { segs, tips } = buildHand(side, handPose(now, side));
    for (const tp of tips) { const s = proj(tp); handTips.push({ x: s[0], y: s[1] }); }
    for (const sg of segs) {
      const a = proj(sg.a), b = proj(sg.b), d = depth((a[2] + b[2]) / 2), f = heat - sg.burn;
      if (sg.bone) {                                  // bones show where the flesh has gone
        const reveal = clamp((f + 0.06) / 0.12, 0, 1);
        if (reveal <= 0.02) continue;
        const p = boneP[lvl(d * reveal)]; p.moveTo(a[0], a[1]); p.lineTo(b[0], b[1]);
        continue;
      }
      if (f >= 0) {                                   // burnt away
        if (!burnt.has(sg.id)) { burnt.add(sg.id); spawnFrag(a, b); }
        continue;
      }
      if (f < -0.12) burnt.delete(sg.id);             // cooled: the flesh grows back
      if (f > -0.08) {                                // charring: flickers and darkens first
        if (Math.random() < ((f + 0.08) / 0.08) * 0.5) continue;
        charP.moveTo(a[0], a[1]); charP.lineTo(b[0], b[1]);
        continue;
      }
      const p = fleshP[lvl(d)]; p.moveTo(a[0], a[1]); p.lineTo(b[0], b[1]);
      if (Math.random() < 0.04) handPtsScreen.push({ x: a[0], y: a[1] });
    }
  }
  ctx.save();
  ctx.lineCap = "round";
  for (let i = 0; i < WIRE_LEVELS; i++) {
    const t = i / (WIRE_LEVELS - 1);
    ctx.lineWidth = 1 + t * 1.2;
    ctx.globalAlpha = 0.2 + 0.8 * t;
    ctx.strokeStyle = RED; ctx.stroke(fleshP[i]);
    ctx.strokeStyle = BONE; ctx.stroke(boneP[i]);
  }
  ctx.globalAlpha = 0.55 + Math.random() * 0.4;
  ctx.lineWidth = 1.6; ctx.strokeStyle = CHAR; ctx.stroke(charP);
  ctx.strokeStyle = CHAR; ctx.lineWidth = 1.4;
  for (const f of frags) {                            // embers, cooling as they fall
    ctx.globalAlpha = 1 - f.life / f.max;
    ctx.beginPath(); ctx.moveTo(f.cx - f.hx, f.cy - f.hy); ctx.lineTo(f.cx + f.hx, f.cy + f.hy); ctx.stroke();
  }
  ctx.restore();
}

// Hard turns and dives shed a few feathers off the hands
function spawnFeathers(dt) {
  if (!handPtsScreen.length || feathers.length >= FEATHER_CAP) return;
  const rate = Math.max(0, Math.abs(yawRate) - 0.5) * 4 + thrustEff * 2;
  if (Math.random() >= rate * dt) return;
  const p = handPtsScreen[(Math.random() * handPtsScreen.length) | 0];
  feathers.push({
    x: p.x, y: p.y, vx: -yawRate * 120 + (Math.random() - 0.5) * 40, vy: -20 + Math.random() * 30,
    ph: Math.random() * 6.28, life: 0, max: 1.4 + Math.random() * 1.2, size: 1.4 + Math.random() * 1.2,
  });
}
function drawSunWithLies(now, sun) {
  if (!lie || sun.r < 2) { drawSun(now, sun); return; }
  const u = clamp((now - lie.start) / (lie.end - lie.start), 0, 1), env = Math.sin(u * Math.PI);
  if (lie.kind === "double") {
    drawSun(now, sun);
    drawSun(now, { ...sun, x: sun.x + lie.dx * sun.r * 1.4 * env, y: sun.y + lie.dy * sun.r * env, face: 0 });
  } else {
    drawSun(now, { ...sun, x: sun.x + lie.dx * sun.r * 1.2 * env, y: sun.y + lie.dy * sun.r * env });

// One line of text on the canvas (so it's in the saved video)
function caption(text, a, y = H * 0.42) {
  if (a <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.fillStyle = RED;
  ctx.font = "300 34px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(glitchText(text), W / 2, y);
  ctx.restore();

// ---------- The ones before you: dot figures falling past; some climb beside you first ----------
function spawnFigures(dt) {
  const rate = lerp(FIG_RATE_LOW, FIG_RATE_HIGH, altitude * altitude);
  if (figures.length >= FIG_MAX || Math.random() >= rate * dt) return;
  const f = { t: 0, seed: Math.random() * 10, dropped: false };
  if (Math.random() < FIG_CLIMBER) {        // still climbing beside you, for a few seconds
    place(f, 3 + Math.random() * 3, side() * (2.5 + Math.random() * 1.5));
    f.y = view.h + 0.3 + Math.random() * 0.6; f.vy = 0.4; f.climb = 3 + Math.random() * 2;
    f.ang = 0; f.spin = 0;
  } else {                                  // falling from above, tumbling
    place(f, 8 + Math.random() * 16, side() * (1.5 + Math.random() * 8));
    f.y = view.h + 7 + Math.random() * 4; f.vy = -1 - Math.random() * 2; f.climb = 0;
    f.ang = Math.random() * 6.28; f.spin = (Math.random() - 0.5) * 4;
  }
  figures.push(f);
}

function updateFigures(dt) {
  figures = figures.filter(f => {
    f.t += dt;
    if (f.climb > 0 && f.t < f.climb && mode === "live") {
      f.x += view.hx * fwdSpeed * dt; f.z += view.hz * fwdSpeed * dt;   // keeps pace with you
      f.y += f.vy * dt;
    } else {
      if (f.climb > 0 && !f.dropped) { f.dropped = true; f.vy = 0; f.spin = (Math.random() - 0.5) * 3; }
      f.vy -= FIG_GRAVITY * dt; f.y += f.vy * dt; f.ang += f.spin * dt;
    }
    return f.y > -3 && f.t < 30;
  });
}

// A body like yours was: head ring, torso, arms out, legs, as (u across, v up) points
function figurePoints(f) {
  const climbing = f.climb > 0 && !f.dropped;
  const armLift = climbing ? Math.sin(f.t * 9) * 0.35 : 0.4 + Math.sin(f.t * 13 + f.seed) * 0.25;
  const P = [];
  for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; P.push([Math.cos(a) * 0.14, 1.62 + Math.sin(a) * 0.14]); }
  for (let i = 0; i <= 3; i++) P.push([0, 1.45 - i * 0.22]);
  for (const sd of [-1, 1]) {
    for (let i = 1; i <= 4; i++) P.push([sd * 0.2 * i, 1.38 + armLift * (i / 4)]);
    for (let i = 1; i <= 4; i++) P.push([sd * 0.07 * i, 0.8 - 0.2 * i]);
  }
  return P;
}

function drawFigures() {
  const rx = view.hz, rz = -view.hx;                 // billboard: faces you
  for (const f of figures) {
    const ca = Math.cos(f.ang), sa = Math.sin(f.ang);
    for (const [u, v] of figurePoints(f)) {
      const vv = v - 0.9, ur = u * ca - vv * sa, vr = u * sa + vv * ca;   // tumble about the waist
      const c = toCam(f.x + rx * ur, f.y + vr, f.z + rz * ur);
      if (c[2] < NEAR) continue;
      const [sx, sy] = toScreen(c);
      wireDot(sx, sy, clamp(60 / c[2], 1.5, 7), 0.15 + 0.85 * depthB(c[2], VIEW_FAR * 1.3));
    }
  }
}

// ---------- Your ghosts: past flights as faint trails in world space ----------
function loadGhosts() {
  try {
    const g = JSON.parse(localStorage.getItem(GHOST_KEY) || "[]");
    return Array.isArray(g) ? g.filter(p => Array.isArray(p) && p.length >= 6).slice(-GHOST_MAX) : [];
  } catch (e) { console.warn("Couldn't read ghosts", e); return []; }
}
function saveGhost(path) {
  if (path.length < 6) return;
  ghosts.push(path);
  while (ghosts.length > GHOST_MAX) ghosts.shift();
  try { localStorage.setItem(GHOST_KEY, JSON.stringify(ghosts)); }
  catch (e) { console.warn("Couldn't save ghosts", e); }
}
// A few points per second, relative to where (and which way) this flight took off
function recordGhost(now) {
  if (!flight || !flightOrigin || now - lastGhostRec < GHOST_STEP || ghostPath.length >= GHOST_POINTS * 3) return;
  lastGhostRec = now;
  const o = flightOrigin, dx = view.x - o.x, dz = travel - o.z;
  const r2 = v => Math.round(v * 100) / 100;
  ghostPath.push(r2(dx * o.hx + dz * o.hz), r2(dx * o.hz - dz * o.hx), r2(view.h));
}
function drawGhosts() {
  if (!ghosts.length) return;
  // Laid out from this flight's take-off; before take-off, from where you are now
  const o = flightOrigin || { x: view.x, z: travel, hx: view.hx, hz: view.hz };
  const far = VIEW_FAR * 1.3;
  ghosts.forEach((g, gi) => {
    const age = 0.45 + 0.55 * ((gi + 1) / ghosts.length);     // older flights fainter
    let px = 0, pz = 0, py = 0, has = false;
    for (let i = 0; i + 2 < g.length; i += 3) {
      const f = g[i], l = g[i + 1];
      const x = o.x + o.hx * f + o.hz * l, z = o.z + o.hz * f - o.hx * l, y = g[i + 2];
      if (has) {
        const mx = (x + px) / 2, mz = (z + pz) / 2;
        const d = Math.hypot(mx - view.x, mz - travel);
        if (d < far && fwdOf(mx, mz) > -2) seg3(px, py, pz, x, y, z, 0.22 * age * (0.3 + 0.7 * depthB(d, far)));
      }
      px = x; pz = z; py = y; has = true;
    }
